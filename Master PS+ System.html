  const notify = (msg, type) => setToast({ msg, type: type || "info" });

  /* ---- Plik współdzielony: ładowanie/zapis/łączenie/odłączanie/synchronizacja ---- */
  const buildSharedPayload = () => ({ entries, deletedIds, forecast, pls, staffList, campaigns, staffOverrides, cph, savedAt: Date.now() });
  const applySharedPayload = (data) => {
    if (!data) return;
    const allDeleted = new Set([...(deletedIdsRef.current || []), ...(Array.isArray(data.deletedIds) ? data.deletedIds : [])]);
    if (Array.isArray(data.deletedIds)) markDeleted(data.deletedIds);
    if (Array.isArray(data.entries)) setEntries(data.entries.filter(e => !allDeleted.has(e.id)));
    if (Array.isArray(data.pls)) setPls(data.pls);
    if (Array.isArray(data.staffList) && data.staffList.length) setStaffList(data.staffList);
    if (Array.isArray(data.campaigns) && data.campaigns.length) setCampaigns(data.campaigns);
    if (data.staffOverrides && typeof data.staffOverrides === "object") setStaffOverrides(data.staffOverrides);
    if (typeof data.cph === "number" && data.cph > 0) setCphState(data.cph);
    if (data.forecast && Array.isArray(data.forecast.rows) && num(data.forecast.updatedAt) >= num(forecastRef.current && forecastRef.current.updatedAt)) setForecast(data.forecast);
  };
  const loadFromSharedFile = async (handle, opts) => {
    opts = opts || {};
    try {
      const { data, lastModified } = await sharedFileRead(handle);
      sharedFileSkipNextWriteRef.current = true;
      applySharedPayload(data);
      sharedFileLastWrittenRef.current = lastModified;
      sharedFileLastWrittenContentRef.current = JSON.stringify({ ...(data || {}), savedAt: null });
      setSharedFileName(handle.name);
      setSharedFileStatus("connected");
      setSharedFileLastSync(Date.now());
      if (!opts.silent) notify(t("notifySharedFileLoaded"), "success");
    } catch (e) {
      setSharedFileStatus("error");
      if (!opts.silent) notify(t("notifySharedFileError", { msg: e.message }), "error");
    }
  };
  const connectExistingSharedFile = async () => {
    if (!SHARED_FILE_SUPPORTED) return;
    if (!await askConfirm(t("sharedFileConfirmLoadOverwrite"))) return;
    try {
      const [handle] = await window.showOpenFilePicker({
        types: [{ description: "JSON", accept: { "application/json": [".json"] } }],
        excludeAcceptAllOption: false,
      });
      const granted = await sharedFileVerifyPermission(handle, true);
      if (!granted) { notify(t("notifySharedFilePermissionDenied"), "error"); return; }
      await sharedFileIdbSet(handle);
      setSharedFileHandle(handle);
      await loadFromSharedFile(handle, {});
    } catch (e) {
      if (e && e.name === "AbortError") return;
      notify(t("notifySharedFileError", { msg: e.message }), "error");
    }
  };
  const createNewSharedFile = async () => {
    if (!SHARED_FILE_SUPPORTED) return;
    if (!await askConfirm(t("sharedFileConfirmCreateNew"))) return;
    try {
      const handle = await window.showSaveFilePicker({
        suggestedName: "master-ps-plus-dane.json",
        types: [{ description: "JSON", accept: { "application/json": [".json"] } }],
      });
      const granted = await sharedFileVerifyPermission(handle, true);
      if (!granted) { notify(t("notifySharedFilePermissionDenied"), "error"); return; }
      await sharedFileIdbSet(handle);
      setSharedFileHandle(handle);
      const payload = buildSharedPayload();
      sharedFileSkipNextWriteRef.current = true;
      const lastModified = await sharedFileWrite(handle, payload);
      sharedFileLastWrittenRef.current = lastModified;
      sharedFileLastWrittenContentRef.current = JSON.stringify({ ...payload, savedAt: null });
      setSharedFileName(handle.name);
      setSharedFileStatus("connected");
      setSharedFileLastSync(Date.now());
      notify(t("notifySharedFileCreated"), "success");
    } catch (e) {
      if (e && e.name === "AbortError") return;
      notify(t("notifySharedFileError", { msg: e.message }), "error");
    }
  };
  const reconnectSharedFile = async () => {
    if (!sharedFileHandle) return;
    const granted = await sharedFileVerifyPermission(sharedFileHandle, true);
    if (!granted) { notify(t("notifySharedFilePermissionDenied"), "error"); return; }
    await loadFromSharedFile(sharedFileHandle, {});
  };
  const disconnectSharedFile = () => {
    sharedFileIdbClear();
    setSharedFileHandle(null);
    setSharedFileStatus(SHARED_FILE_SUPPORTED ? "disconnected" : "unsupported");
    setSharedFileName("");
    setSharedFileLastSync(null);
  };
  const syncNowSharedFile = async () => {
    if (!sharedFileHandle) return;
    await loadFromSharedFile(sharedFileHandle, {});
  };

  // Przy starcie: jeśli wcześniej połączono plik współdzielony (uchwyt zapisany w IndexedDB), próbujemy
  // automatycznie odzyskać dostęp bez klikania — jeśli przeglądarka nie pamięta zgody, użytkownik zobaczy
  // przycisk "Przywróć dostęp" (patrz SharedFileBar), bo requestPermission wymaga kliknięcia (gestu użytkownika).
  useEffect(() => {
    if (!SHARED_FILE_SUPPORTED) return;
    (async () => {
      const handle = await sharedFileIdbGet();
      if (!handle) return;
      setSharedFileHandle(handle);
      setSharedFileName(handle.name);
      let granted = false;
      try { granted = (await handle.queryPermission({ mode: "readwrite" })) === "granted"; } catch (e) {}
      if (!granted) { setSharedFileStatus("needsPermission"); return; }
      await loadFromSharedFile(handle, { silent: true });
    })();
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, []);

  // Odpytywanie pliku co kilka sekund — jeśli zmienił się na dysku (np. zapis innej osoby zsynchronizowany
  // przez OneDrive), wczytujemy nową wersję. Własny zapis nie wywołuje ponownego wczytania, bo od razu po
  // zapisie zapamiętujemy jego lastModified w sharedFileLastWrittenRef.
  useEffect(() => {
    if (!sharedFileHandle || sharedFileStatus !== "connected") return;
    const interval = setInterval(async () => {
      try {
        const file = await sharedFileHandle.getFile();
        if (file.lastModified !== sharedFileLastWrittenRef.current) {
          await loadFromSharedFile(sharedFileHandle, { silent: true });
        }
      } catch (e) {
        setSharedFileStatus("error");
      }
    }, SHARED_FILE_POLL_MS);
    return () => clearInterval(interval);
  }, [sharedFileHandle, sharedFileStatus]);

  // Zapis do pliku współdzielonego (z małym debounce) po każdej zmianie współdzielonych danych — pominięty
  // raz tuż po wczytaniu z pliku (sharedFileSkipNextWriteRef), żeby nie odsyłać do pliku tego, co właśnie
  // z niego przyszło.
  // Przed zapisem: 1) odczytujemy AKTUALNĄ zawartość pliku z dysku i SCALAMY ją z lokalnym stanem
  // (mergeSharedPayload — patrz komentarz przy tej funkcji) zamiast ślepo nadpisywać plik samym lokalnym
  // stanem — to naprawia utratę wpisów innych osób, które zdążyły zapisać się do pliku (np. z innego
  // komputera przez OneDrive), zanim ten zapis wystartował, a nie zdążyły jeszcze dotrzeć do lokalnego stanu
  // tej przeglądarki. 2) Pomijamy zapis, jeśli scalona treść (bez samego znacznika savedAt) jest identyczna
  // z tym, co już wiadomo, że jest zapisane/odczytane — zapobiega to "fantomowym" zapisom wywoływanym przez
  // efekty, które odświeżają referencję entries (np. po zmianie CPH/kampanii - patrz efekty wyżej), mimo że
  // realne dane się nie zmieniły; bez tego takie fantomowe zapisy dodatkowo zwiększały ryzyko wyścigu opisanego
  // w punkcie 1. 3) Jeśli scalanie dołożyło do lokalnego stanu wpisy/dane, których ta przeglądarka jeszcze nie
  // miała (bo pochodzą z pliku), aktualizujemy też lokalny stan, żeby użytkownik od razu widział KOMPLETNE dane
  // (bez czekania na najbliższe pollowanie co SHARED_FILE_POLL_MS).
  useEffect(() => {
    if (!sharedFileHandle || sharedFileStatus !== "connected") return;
    if (sharedFileSkipNextWriteRef.current) { sharedFileSkipNextWriteRef.current = false; return; }
    const timeout = setTimeout(async () => {
      try {
        const localPayload = buildSharedPayload();
        const serializedLocalOnly = JSON.stringify({ ...localPayload, savedAt: null });
        let diskData = null;
        try { diskData = (await sharedFileRead(sharedFileHandle)).data; } catch (e) { /* brak odczytu -> scalamy tylko z lokalnym stanem */ }
        const merged = mergeSharedPayload(diskData, localPayload);
        const serialized = JSON.stringify({ ...merged, savedAt: null });
        if (serialized === sharedFileLastWrittenContentRef.current) return;
        const lastModified = await sharedFileWrite(sharedFileHandle, merged);
        sharedFileLastWrittenRef.current = lastModified;
        sharedFileLastWrittenContentRef.current = serialized;
        setSharedFileLastSync(Date.now());
        // Jeśli scalona treść różni się od tego, co było TYLKO w lokalnym stanie (czyli scalanie dołożyło coś
        // z pliku, czego ta przeglądarka jeszcze nie miała), aktualizujemy lokalny stan od razu — użytkownik
        // nie musi czekać na najbliższe pollowanie, żeby zobaczyć pełne dane.
        if (serialized !== serializedLocalOnly) {
          sharedFileSkipNextWriteRef.current = true;
          applySharedPayload(merged);
        }
      } catch (e) {
        setSharedFileStatus("error");
      }
    }, SHARED_FILE_WRITE_DEBOUNCE_MS);
    return () => clearTimeout(timeout);
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [entries, deletedIds, forecast, pls, staffList, campaigns, staffOverrides, cph, sharedFileHandle, sharedFileStatus]);

  /* ===== Wspólna baza online (gdy aplikacja jest otwarta z linku claude.ai) =====
     Dane trzymane w bazie artefaktu: kolekcja "days" (jeden dokument na dzień: {rows}), dokument
     "config/main" (lista PL, staff, kampanie, przypisania, CPH) i "config/forecast". Każda zmiana zapisuje
     tylko zmienione dni. Zmiany innych osób przychodzą na żywo. Otwarty lokalnie plik HTML działa jak dotąd. */
  const [dbState, setDbState] = useState({ mode: "local" });
  const dbRef = useRef(null);
  const entriesRef = useRef(entries); entriesRef.current = entries;
  const remoteDaysRef = useRef({});
  const daysSyncedRef = useRef(false);
  const remoteConfigRef = useRef(null);
  const configSyncedRef = useRef(false);
  const remoteForecastRef = useRef(null);
  const forecastSyncedRef = useRef(false);
  const writingDaysRef = useRef(false);
  const flushAgainRef = useRef(false);
  const readonlyNotifiedRef = useRef(false);
  const configPayload = () => ({ pls, staffList, campaigns, staffOverrides, cph });

  const groupEntriesByDay = (list) => {
    const byDay = {};
    list.forEach(e => { const d = /^\d{4}-\d{2}-\d{2}$/.test(e.date || "") ? e.date : "bez-daty"; (byDay[d] = byDay[d] || []).push(e); });
    return byDay;
  };
  const handleDbWriteError = (e) => {
    const code = e && e.code;
    if (code === "invalid_argument" || code === "not_granted") {
      setDbState(s => ({ ...s, mode: "readonly" }));
      if (!readonlyNotifiedRef.current) { readonlyNotifiedRef.current = true; notify(t("dbReadonly"), "error"); }
    } else if (code === "quota_exceeded") notify(t("dbQuota"), "error");
    else notify(t("dbWriteError", { msg: (e && e.message) || code || "?" }), "error");
  };
  const flushDays = async () => {
    const db = dbRef.current;
    if (!db || !daysSyncedRef.current) return;
    if (writingDaysRef.current) { flushAgainRef.current = true; return; }
    writingDaysRef.current = true;
    try {
      const byDay = groupEntriesByDay(entriesRef.current);
      const remote = remoteDaysRef.current;
      for (const day of Object.keys(byDay)) {
        const js = JSON.stringify(byDay[day]);
        if (remote[day] !== js) { await db.collection("days").doc(day).set({ rows: byDay[day] }); remote[day] = js; }
      }
      for (const day of Object.keys(remote)) {
        if (!byDay[day]) { await db.collection("days").doc(day).delete(); delete remote[day]; }
      }
    } catch (e) { handleDbWriteError(e); }
    finally {
      writingDaysRef.current = false;
      if (flushAgainRef.current) { flushAgainRef.current = false; flushDays(); }
    }
  };

  useEffect(() => {
    if (!window.claude || typeof window.claude.use !== "function") return;
    let cancelled = false; const unsubs = [];
    setDbState({ mode: "connecting" });
    const slowTimer = setTimeout(() => setDbState(s => (s.mode === "connecting" ? { mode: "slow" } : s)), 10000);
    window.claude.use("db").then(db => {
      if (cancelled) return;
      if (!db) { clearTimeout(slowTimer); setDbState({ mode: "local" }); return; }
      dbRef.current = db;
      const onErr = (e) => { clearTimeout(slowTimer); setDbState({ mode: "error", msg: e && e.code }); };
      unsubs.push(db.collection("days").onSnapshot(snap => {
        if (snap.metadata.fromCache && !daysSyncedRef.current) return;
        clearTimeout(slowTimer);
        const first = !daysSyncedRef.current;
        const prevRemote = remoteDaysRef.current;
        const newRemote = {}; const remoteRows = {};
        snap.docs.forEach(d => { const rows = Array.isArray((d.data() || {}).rows) ? d.data().rows : []; newRemote[d.id] = JSON.stringify(rows); remoteRows[d.id] = rows; });
        remoteDaysRef.current = newRemote;
        daysSyncedRef.current = true;
        setDbState(s => (s.mode === "readonly" ? s : { mode: "online" }));
        if (first && snap.empty) { flushDays(); return; } // pusta baza: wysyłamy obecne dane
        // Dni z lokalnymi, jeszcze niezapisanymi zmianami zostają lokalne; resztę bierzemy z bazy.
        const local = first ? {} : groupEntriesByDay(entriesRef.current);
        const days = new Set([...Object.keys(newRemote), ...Object.keys(local)]);
        const merged = [];
        Array.from(days).sort().forEach(day => {
          const localJs = local[day] ? JSON.stringify(local[day]) : undefined;
          const dirty = !first && localJs !== prevRemote[day];
          const rows = dirty ? (local[day] || []) : (remoteRows[day] || []);
          rows.forEach(r => merged.push(r));
        });
        setEntries(merged);
      }, onErr));
      unsubs.push(db.doc("config/main").onSnapshot(snap => {
        if (snap.metadata.fromCache && !configSyncedRef.current) return;
        configSyncedRef.current = true;
        if (!snap.exists) { remoteConfigRef.current = null; setConfigTick(x => x + 1); return; }
        const d = snap.data();
        remoteConfigRef.current = JSON.stringify(d);
        if (Array.isArray(d.pls)) setPls(d.pls);
        if (Array.isArray(d.staffList) && d.staffList.length) setStaffList(d.staffList);
        if (Array.isArray(d.campaigns) && d.campaigns.length) setCampaigns(d.campaigns);
        if (d.staffOverrides && typeof d.staffOverrides === "object") setStaffOverrides(d.staffOverrides);
        if (typeof d.cph === "number" && d.cph > 0) setCphState(d.cph);
      }, onErr));
      unsubs.push(db.doc("config/forecast").onSnapshot(snap => {
        if (snap.metadata.fromCache && !forecastSyncedRef.current) return;
        forecastSyncedRef.current = true;
        if (!snap.exists) { remoteForecastRef.current = null; setConfigTick(x => x + 1); return; }
        const d = snap.data();
        remoteForecastRef.current = JSON.stringify(d);
        if (Array.isArray(d.rows)) setForecast({ rows: d.rows, updatedAt: num(d.updatedAt) });
      }, onErr));
    });
    return () => { cancelled = true; clearTimeout(slowTimer); unsubs.forEach(u => u()); };
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, []);
  const [configTick, setConfigTick] = useState(0);

  useEffect(() => {
    if (!dbRef.current || !daysSyncedRef.current || dbState.mode === "readonly") return;
    const timer = setTimeout(flushDays, 600);
    return () => clearTimeout(timer);
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [entries, dbState.mode]);
  useEffect(() => {
    const db = dbRef.current;
    if (!db || !configSyncedRef.current || dbState.mode === "readonly") return;
    const timer = setTimeout(async () => {
      const body = configPayload(); const js = JSON.stringify(body);
      if (js === remoteConfigRef.current) return;
      try { await db.doc("config/main").set(body); remoteConfigRef.current = js; } catch (e) { handleDbWriteError(e); }
    }, 800);
    return () => clearTimeout(timer);
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [pls, staffList, campaigns, staffOverrides, cph, configTick, dbState.mode]);
  useEffect(() => {
    const db = dbRef.current;
    if (!db || !forecastSyncedRef.current || dbState.mode === "readonly") return;
    const timer = setTimeout(async () => {
      const body = { rows: forecast.rows, updatedAt: num(forecast.updatedAt) }; const js = JSON.stringify(body);
      if (js === remoteForecastRef.current) return;
      try { await db.doc("config/forecast").set(body); remoteForecastRef.current = js; } catch (e) { handleDbWriteError(e); }
    }, 800);
    return () => clearTimeout(timer);
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [forecast, configTick, dbState.mode]);

  /* ===== Folder wspólny (dzienniki zmian) — patrz komentarz przy SHARED_FOLDER_SUPPORTED ===== */
  const [sync, setSync] = useState({ mode: SHARED_FOLDER_SUPPORTED ? "off" : "unsupported" });
  const [syncStatus, setSyncStatus] = useState(null);
  const [syncName, setSyncNameState] = useState(syncWriterName);
  const [syncHasBackup, setSyncHasBackup] = useState(false);
  const syncEngineRef = useRef(null);
  const syncReadyRef = useRef(false);
  const syncHandleRef = useRef(null);
  const syncStatusKeyRef = useRef("");

  const syncAppState = () => ({ entries, campaigns, pls, staffList, staffOverrides, cph, forecast });
  if (SYNC_DEV_OPFS) window.__mpsDev = { engine: () => syncEngineRef.current, state: () => ({ entries, campaigns, pls, staffList, staffOverrides, cph, forecast }) }; // tylko tryb testowy
  const stopSync = () => {
    const eng = syncEngineRef.current;
    if (eng) { eng.stopTimers(); eng.flush(); }
    syncEngineRef.current = null; syncReadyRef.current = false; SHARED_SYNC_ACTIVE = false;
  };
  // Zmiany innych osób: małe "łatki" nakładane funkcyjnie na aktualny stan, więc niezapisane jeszcze
  // lokalne edycje innych pól nie są nadpisywane.
  const applyRemotePatch = (patch) => {
    if (patch.entries) setEntries(prev => SYNC.applyPatch({ entries: prev }, { entries: patch.entries }).entries);
    if (patch.campaigns) setCampaigns(prev => SYNC.applyPatch({ campaigns: prev }, { campaigns: patch.campaigns }).campaigns);
    if (patch.pls) setPls(prev => SYNC.applyPatch({ pls: prev }, { pls: patch.pls }, comparePl).pls);
    if (patch.staffList) setStaffList(prev => SYNC.applyPatch({ staffList: prev }, { staffList: patch.staffList }, comparePl).staffList);
    if (patch.staffOverrides) setStaffOverrides(prev => SYNC.applyPatch({ staffOverrides: prev }, { staffOverrides: patch.staffOverrides }).staffOverrides);
    if ("cph" in patch) setCphState(patch.cph);
    if ("forecast" in patch) setForecast(patch.forecast);
  };
  const applyFullView = (view) => {
    setEntries(view.entries); setCampaigns(view.campaigns); setPls(view.pls); setStaffList(view.staffList);
    setStaffOverrides(view.staffOverrides); setCphState(view.cph); setForecast(view.forecast);
  };
  // Odświeżamy pasek tylko przy istotnej zmianie statusu (a nie co każde odpytanie folderu), żeby nie
  // przerysowywać całej aplikacji co kilka sekund.
  const onEngineStatus = (s) => {
    const key = [s.state, s.pending, s.error || "", s.lastRemote ? s.lastRemote.w + s.lastRemote.t : ""].join("|");
    if (key === syncStatusKeyRef.current) return;
    syncStatusKeyRef.current = key;
    setSyncStatus(s);
  };

  const startSync = async (handle, opts) => {
    opts = opts || {};
    stopSync();
    syncHandleRef.current = handle;
    setSync({ mode: "connecting", folder: handle.name });
    const writerId = syncWriterId();
    const eng = new SYNC.SyncEngine({
      root: handle, writerId, writerName: syncWriterName(),
      outbox: SYNC.idbOutbox("masterps_sync_outbox_v1", writerId),
      comparePl,
      defaults: { cph: DEFAULT_CPH, forecast: { rows: FORECAST_SEED.map(r => ({ ...r })), updatedAt: 0 } },
      onRemote: applyRemotePatch,
      onStatus: onEngineStatus,
    });
    let view;
    try { view = await eng.start(); }
    catch (e) {
      if (e && e.code === "not_initialized") { setSync({ mode: "notInitialized", folder: handle.name }); return null; }
      setSync({ mode: "error", folder: handle.name, msg: (e && e.message) || String(e) });
      return null;
    }
    // Pierwsze połączenie tej przeglądarki: zachowujemy kopię dotychczasowych danych lokalnych.
    if (!(await syncIdbGet("presync-backup"))) await syncIdbSet("presync-backup", { savedAt: Date.now(), data: syncAppState() });
    setSyncHasBackup(true);
    syncEngineRef.current = eng;
    applyFullView(view);
    syncReadyRef.current = true;
    SHARED_SYNC_ACTIVE = true;
    eng.startTimers(3000, 500);
    setSync({ mode: eng.readOnly ? "readonly" : "online", folder: handle.name });
    if (!opts.silent) notify(t("notifySyncConnected"), "success");
    return eng;
  };

  // Każda zmiana danych w aplikacji trafia do silnika, który zapisuje ją automatycznie w folderze.
  useEffect(() => {
    const eng = syncEngineRef.current;
    if (!eng || !syncReadyRef.current) return;
    eng.commit({ entries, campaigns, pls, staffList, staffOverrides, cph, forecast }).catch(e => notify(t("notifySyncError", { msg: e.message }), "error"));
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [entries, campaigns, pls, staffList, staffOverrides, cph, forecast]);

  // Start: zapamiętany folder -> łączymy automatycznie, a jeśli przeglądarka wymaga zgody — prosimy o jedno kliknięcie.
  useEffect(() => {
    if (!SHARED_FOLDER_SUPPORTED) return;
    (async () => {
      if (SYNC_DEV_OPFS) { await startSync(await syncDevFolder(), { silent: true }); return; }
      setSyncHasBackup(!!(await syncIdbGet("presync-backup")));
      const handle = await syncIdbGet("folder");
      if (!handle) return;
      syncHandleRef.current = handle;
      let p = "prompt";
      try { p = await handle.queryPermission({ mode: "readwrite" }); } catch (e) {}
      if (p === "granted") await startSync(handle, { silent: true });
      else setSync({ mode: "needsPermission", folder: handle.name });
    })();
    const flushNow = () => { const eng = syncEngineRef.current; if (eng) eng.flush(); };
    const onVis = () => { if (document.visibilityState === "hidden") flushNow(); };
    window.addEventListener("beforeunload", flushNow);
    document.addEventListener("visibilitychange", onVis);
    return () => { window.removeEventListener("beforeunload", flushNow); document.removeEventListener("visibilitychange", onVis); stopSync(); };
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, []);

  // Folder bez danych wspólnych (zwykły użytkownik, OneDrive jeszcze nie pobrał danych): co 30 s sprawdzamy po
  // cichu, czy pojawił się manifest.json, i wtedy łączymy automatycznie — bez migotania paska i bez klikania.
  useEffect(() => {
    if (sync.mode !== "notInitialized" || SYNC_SETUP_MODE) return;
    const timer = setInterval(async () => {
      const handle = syncHandleRef.current;
      if (!handle) return;
      try { await handle.getFileHandle("manifest.json"); } catch (e) { return; }
      await startSync(handle);
    }, SYNC_NOT_INIT_RECHECK_MS);
    return () => clearInterval(timer);
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [sync.mode]);

  const connectSharedFolder = async () => {
    try {
      const handle = SYNC_DEV_OPFS ? await syncDevFolder() : await window.showDirectoryPicker({ id: "masterps-shared-data", mode: "readwrite" });
      if (!SYNC_DEV_OPFS) {
        let p = await handle.queryPermission({ mode: "readwrite" });
        if (p !== "granted") p = await handle.requestPermission({ mode: "readwrite" });
        if (p !== "granted") { notify(t("notifySharedFilePermissionDenied"), "error"); return; }
      }
      let initialized = false;
      try { await handle.getFileHandle("manifest.json"); initialized = true; } catch (e) {}
      if (initialized && !await askConfirm(t("syncConfirmFirstConnect", { folder: handle.name }))) return;
      await syncIdbSet("folder", handle);
      await startSync(handle);
    } catch (e) {
      if (e && e.name === "AbortError") return;
      notify(t("notifySyncError", { msg: e.message }), "error");
    }
  };
  const reconnectSharedFolder = async () => {
    const handle = syncHandleRef.current;
    if (!handle) return connectSharedFolder();
    try {
      if (!SYNC_DEV_OPFS) {
        const p = await handle.requestPermission({ mode: "readwrite" });
        if (p !== "granted") { notify(t("notifySharedFilePermissionDenied"), "error"); return; }
      }
      await startSync(handle, { silent: true });
    } catch (e) { notify(t("notifySyncError", { msg: e.message }), "error"); }
  };
  const disconnectSharedFolder = async () => {
    stopSync();
    await syncIdbDel("folder");
    syncHandleRef.current = null;
    setSyncStatus(null);
    setSync({ mode: "off" });
  };
  // Jednorazowe utworzenie danych wspólnych (migracja) z kompletnymi danymi tej przeglądarki + kontrola zgodności.
  const initializeSharedFolder = async () => {
    const handle = syncHandleRef.current;
    if (!handle || !SYNC_SETUP_MODE) return;
    try {
      if (!(await syncFolderIsEmpty(handle))) { notify(t("syncNotEmptyFolder"), "error"); return; }
      const state = syncAppState();
      const counts = { folder: handle.name, entries: state.entries.length, campaigns: state.campaigns.length, forecast: (state.forecast && state.forecast.rows || []).length };
      if (!await askConfirm(t("syncConfirmInit", counts))) return;
      await SYNC.SyncEngine.initialize(handle, state, { writerId: syncWriterId() });
      const eng = await startSync(handle, { silent: true });
      const ok = !!eng && SYNC.canonical(eng.materialize()) === SYNC.canonical(state);
      notify(ok ? t("syncInitDone", counts) : t("syncInitMismatch"), ok ? "success" : "error");
    } catch (e) { notify(t("notifySyncError", { msg: e.message }), "error"); }
  };
  const changeSyncName = (value) => {
    const v = String(value || "").trim();
    try { localStorage.setItem(SYNC_LS_NAME, v); } catch (e) {}
    setSyncNameState(v);
    const eng = syncEngineRef.current;
    if (eng) { eng.name = v; eng.writeWriterInfo().catch(() => {}); }
  };
  const downloadPresyncBackup = async () => {
    const b = await syncIdbGet("presync-backup");
    if (!b) return;
    downloadBlob("Master_PS_before_shared_" + new Date(b.savedAt).toISOString().slice(0, 10) + ".json", JSON.stringify(b.data, null, 2), "application/json");
  };

  const addEntry = (entry) =>
 { setEntries(prev => [...prev, { ...entry, id: uid() }]); notify(t("notifyAdded"), "success"); };
  const updateEntry = (id, patch) => setEntries(prev => prev.map(e => (e.id === id ? { ...e, ...patch } : e)));
  const deleteEntry = (id) => { setEntries(prev => prev.filter(e => e.id !== id)); markDeleted([id]); };
  /* Import pliku OCR wg planu z planOcrImport: aktualizacja istniejących, dodanie nowych, usunięcie duplikatów
     (i opcjonalnie wierszy dla tych samych PL+dni, których nie ma w pliku). */
  const applyOcrImport = (plan, removeStale) => {
    const removeIds = new Set(plan.removeIds);
    if (removeStale) plan.stale.forEach(e => removeIds.add(e.id));
    setEntries(prev => [
      ...prev.filter(e => !removeIds.has(e.id)).map(e => (plan.updates.has(e.id) ? { ...e, ...plan.updates.get(e.id) } : e)),
      ...plan.added,
    ]);
    markDeleted(removeIds);
    const newPls = Array.from(new Set(plan.added.map(x => x.pl)));
    if (newPls.length) setPls(prev => Array.from(new Set([...prev, ...newPls])).sort());
    return removeIds.size;
  };
  const dedupeEntries = async () => {
    const { removeIds, patches } = planDedupe(entries);
    if (removeIds.size === 0) { notify(t("notifyDedupeNone"), "info"); return; }
    if (!await askConfirm(t("confirmDedupe", { count: removeIds.size }) + (SHARED_SYNC_ACTIVE ? "\n\n" + t("syncWarnAllUsers") : ""))) return;
    setEntries(prev => prev.filter(e => !removeIds.has(e.id)).map(e => (patches.has(e.id) ? { ...e, ...patches.get(e.id) } : e)));
    markDeleted(removeIds);
    notify(t("notifyDedupeDone", { count: removeIds.size }), "success");
  };
  /* Zakładka Kampanie: przycisk "Wyczyść ręczne CPH" — usuwa cphOverride ze wszystkich wpisów danej kampanii
     (dopasowanie po nazwie, tak jak cphForCampaign/campaignCphAsOfDate), żeby zaczęły automatycznie korzystać
     z CPH ustawionego dla kampanii, bez konieczności poprawiania każdego wiersza z osobna w Freelancerach/Staff. */
  const clearCphOverridesForCampaign = (campaignName) => {
    const norm = normalizeCampaignName(campaignName);
    const count = entries.filter(e => normalizeCampaignName(e.campaignName) === norm && hasCphOverride(e)).length;
    if (count > 0) {
      setEntries(prev => prev.map(e => (normalizeCampaignName(e.campaignName) === norm && hasCphOverride(e)) ? { ...e, cphOverride: null } : e));
    }
    return count;
  };
  const addPl = (code) => setPls(prev => (prev.includes(code) ? prev : [...prev, code].sort()));
  const bulkAdd = (list, replacementPls, replaceAll) => {
    // Wpis o id, które jest już na liście usuniętych (np. przy przywracaniu kopii JSON), dostaje nowe id —
    // inaczej scalanie z plikiem współdzielonym od razu by go odfiltrowało.
    const del = new Set(deletedIdsRef.current || []);
    list = list.map(x => (x.id && !del.has(x.id) ? x : { ...x, id: uid() }));
    if (replaceAll) {
      const keepIds = new Set(list.map(x => x.id));
      markDeleted(entries.filter(e => !keepIds.has(e.id)).map(e => e.id));
      setEntries(list);
      if (replacementPls) setPls(replacementPls);
      return;
    }
    setEntries(prev => [...prev, ...list]);
    const newPls = Array.from(new Set(list.map(x => x.pl)));
    setPls(prev => Array.from(new Set([...prev, ...newPls])).sort());
  };
  const clearAll = async () => {
    if (!await askConfirm(t("confirmClearAll") + (SHARED_SYNC_ACTIVE ? "\n\n" + t("syncWarnAllUsers") : ""))) return;
    markDeleted(entries.map(e => e.id));
    setEntries([]);
    notify(t("notifyCleared"), "success");
  };
  const addStaffPl = (code) => {
    const c = String(code || "").trim().toUpperCase();
    if (!c) return;
    setStaffList(prev => (prev.includes(c) ? prev : [...prev, c].sort(comparePl)));
    setPls(prev => (prev.includes(c) ? prev : [...prev, c].sort(comparePl)));
  };
  const removeStaffPl = (code) => setStaffList(prev => prev.filter(p => p !== code));
  const resetStaffList = () => setStaffList([...STAFF_PLS_FROM_AUGUST_2026].sort(comparePl));
  const addCampaign = (ref, name, cphValue) => {
    const r = String(ref || "").trim();
    const n = String(name || "").trim();
    if (!r || !n) { notify(t("campaignFormValidation"), "error"); return; }
    if (campaigns.some(c => c.ref === r)) { notify(t("campaignDuplicateRef"), "error"); return; }
    const cphNum = cphValue !== "" && cphValue != null && !isNaN(Number(cphValue)) && Number(cphValue) > 0 ? Number(cphValue) : null;
    setCampaigns(prev => [...prev, { ref: r, name: n, cph: cphNum }]);
    notify(t("notifyCampaignAdded"), "success");
  };
  const updateCampaign = (ref, patch) => setCampaigns(prev => prev.map(c => (c.ref === ref ? { ...c, ...patch } : c)));
  const removeCampaign = (ref) => setCampaigns(prev => prev.filter(c => c.ref !== ref));

  return (
    <LangContext.Provider value={langValue}>
      <div className="min-h-screen bg-slate-50 text-slate-800 pb-10">
        <div className="no-print">
          <Header entries={entries} cph={cph} onCphChange={setCph} />
          {dbState.mode !== "local" ? <DbBar state={dbState} /> : <SharedFolderBar
            sync={sync}
            status={syncStatus}
            engineRef={syncEngineRef}
            name={syncName}
            hasBackup={syncHasBackup}
            onConnect={connectSharedFolder}
            onReconnect={reconnectSharedFolder}
            onDisconnect={disconnectSharedFolder}
            onInitialize={initializeSharedFolder}
            onNameChange={changeSyncName}
            onDownloadBackup={downloadPresyncBackup}
          />}
        </div>
        <SyncOverlay sync={sync} onReconnect={reconnectSharedFolder} onWorkLocal={disconnectSharedFolder} />
        <div className="max-w-7xl mx-auto px-4">
          <div className="no-print">
            <TabBar tab={tab} setTab={setTab} />
          </div>
          {tab === "master" && (
            <MasterTab entries={entries} pls={pls} onAdd={addEntry} onAddPl={addPl} onUpdate={updateEntry} onDelete={deleteEntry} onBulkAdd={bulkAdd} onClearAll={clearAll} onOcrImport={applyOcrImport} onDedupe={dedupeEntries} notify={notify} />
          )}
          {tab === "freelancerProd" && (
            <FreelancerTab
              entries={entries}
              pls={pls}
              onAdd={addEntry}
              onAddPl={addPl}
              onUpdate={updateEntry}
              onDelete={deleteEntry}
              notify={notify}
            />
          )}
          {tab === "freelancerSalesList" && (
            <FreelancerSalesListTab
              entries={entries}
              pls={pls}
              onAdd={addEntry}
              onAddPl={addPl}
              onUpdate={updateEntry}
              onDelete={deleteEntry}
              notify={notify}
            />
          )}
          {tab === "staffProd" && (
            <StaffProductivityTab
              entries={entries}
              staffList={staffList}
              onAddStaffPl={addStaffPl}
              onRemoveStaffPl={removeStaffPl}
              onResetStaffList={resetStaffList}
              onAdd={addEntry}
              onBulkAdd={bulkAdd}
              onUpdate={updateEntry}
              onDelete={deleteEntry}
              notify={notify}
            />
          )}
          {tab === "weekly" && <WeeklyTab entries={entries} staffList={staffList} />}
          {tab === "monthly" && <MonthlyTab entries={entries} staffList={staffList} />}
          {tab === "productivityPrint" && (
            <ProductivityPrintTab
              entries={entries}
              pls={pls}
              staffList={staffList}
              onUpdate={updateEntry}
              onDelete={deleteEntry}
              notify={notify}
            />
          )}
          {tab === "summary" && <SummaryTab entries={entries} pls={pls} staffOverrides={staffOverrides} setStaffOverrides={setStaffOverrides} staffList={staffList} />}
          {tab === "campaigns" && (
            <CampaignsTab
              entries={entries}
              campaigns={campaigns}
              onAddCampaign={addCampaign}
              onUpdateCampaign={updateCampaign}
              onRemoveCampaign={removeCampaign}
              onClearCphOverrides={clearCphOverridesForCampaign}
              notify={notify}
            />
          )}
          {tab === "forecast" && <ForecastTab entries={entries} forecast={forecast} onForecastChange={updateForecast} notify={notify} />}
        </div>
        {toast && <div className="no-print"><Toast toast={toast} /></div>}
        <div className="no-print text-center text-xs text-slate-400 mt-8">{sync.mode === "online" ? t("footerShared", { cph, folder: sync.folder || "" }) : t("footer", { cph })}</div>
      </div>
    </LangContext.Provider>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
<script>
(function () {
  var source = document.getElementById("app-source").textContent;
  var result = Babel.transform(source, { presets: [["react", { runtime: "classic" }]] });
  var s = document.createElement("script");
  s.text = result.code;
  document.body.appendChild(s);
})();
</script>

</body></html>
