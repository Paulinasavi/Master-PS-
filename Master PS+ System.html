const FORECAST_START = "2026-07-01";
const STORAGE_FORECAST = "masterps_forecast_v1";
function forecastKeyOf(r) { return String(r.ref || "").trim().toUpperCase() + "|" + r.start; }
function addDaysIso(iso, n) {
  const [y, m, d] = iso.split("-").map(Number);
  const dt = new Date(Date.UTC(y, m - 1, d + n));
  return dt.toISOString().slice(0, 10);
}
/* Import pliku "Estimación Pharma" (xlsx): wiersz z nagłówkami WEEK / DAYS, wiersz nad nim = nazwy kampanii
   (z kodem ref na końcu, np. "... 13711P2602"; komórki scalone na kolumny APP / Extra / FD), poniżej tygodnie
   w formacie "dd/mm/rr al dd/mm/rr". Bierzemy tylko tygodnie kończące się od FORECAST_START (lipiec 2026). */
function parseForecastFile(file, t, onDone, onError) {
  const reader = new FileReader();
  reader.onload = (evt) => {
    try {
      const wb = XLSX.read(new Uint8Array(evt.target.result), { type: "array" });
      const sheet = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: null, blankrows: true });
      let hi = -1;
      for (let i = 0; i < rows.length; i++) {
        if (Array.isArray(rows[i]) && rows[i].some(c => String(c || "").trim().toUpperCase() === "WEEK")) { hi = i; break; }
      }
      if (hi < 1) throw new Error(t("forecastErrFormat"));
      const labels = rows[hi].map(c => String(c || "").trim().toLowerCase());
      const names = rows[hi - 1] || [];
      const daysCol = labels.indexOf("days");
      if (daysCol === -1) throw new Error(t("forecastErrFormat"));
      const colmap = []; let cur = null;
      for (let c = 0; c < labels.length; c++) {
        if (c <= daysCol) continue;
        const n = names[c] != null ? String(names[c]).trim() : "";
        if (n) cur = n;
        if (!labels[c]) { cur = n || null; continue; }
        if (!cur) continue;
        const refs = cur.match(/\d{4,5}P[0-9A-Z]{4}/gi);
        if (!refs) continue;
        const ref = refs[refs.length - 1].toUpperCase();
        const name = cur.replace(new RegExp(refs[refs.length - 1], "i"), "").replace(/\s+/g, " ").replace(/\b(SPAIN)\b/i, "").trim();
        const l = labels[c];
        const kind = l.includes("app") ? "app" : l.includes("fd") ? "fd" : "extra";
        colmap.push({ c, ref, name, kind });
      }
      if (!colmap.length) throw new Error(t("forecastErrFormat"));
      const out = {};
      for (let i = hi + 1; i < rows.length; i++) {
        const row = rows[i]; if (!row) continue;
        const m = String(row[daysCol] || "").match(/(\d{1,2})\/(\d{1,2})\/(\d{2,4})\s*al\s*(\d{1,2})\/(\d{1,2})\/(\d{2,4})/i);
        if (!m) continue;
        const yy = (s) => (s.length === 2 ? "20" + s : s);
        const p2 = (s) => String(s).padStart(2, "0");
        const start = `${yy(m[3])}-${p2(m[2])}-${p2(m[1])}`, end = `${yy(m[6])}-${p2(m[5])}-${p2(m[4])}`;
        if (end < FORECAST_START) continue;
        colmap.forEach(({ c, ref, name, kind }) => {
          const v = row[c];
          if (v === null || v === undefined || String(v).trim() === "") return;
          const n = Number(String(v).replace(",", "."));
          if (isNaN(n)) return;
          const k = ref + "|" + start;
          if (!out[k]) out[k] = { ref, name, start, end, app: 0, extra: 0, fd: 0 };
          out[k][kind] = round2(out[k][kind] + n);
        });
      }
      const list = Object.values(out);
      if (!list.length) throw new Error(t("forecastErrNoRows"));
      onDone(list);
    } catch (err) { onError(err); }
  };
  reader.onerror = () => onError(new Error(t("errReadFile")));
  reader.readAsArrayBuffer(file);
}
/* Bez duplikatów: dla każdej kampanii (ref) obecnej w pliku cała jej prognoza jest ZASTĘPOWANA danymi z pliku
   (klucz ref + początek tygodnia). Kampanie, których nie ma w pliku, zostają bez zmian. */
function mergeForecast(currentRows, fileRows) {
  const fileRefs = new Set(fileRows.map(r => r.ref));
  const curMap = new Map(currentRows.map(r => [forecastKeyOf(r), r]));
  const fileMap = new Map(fileRows.map(r => [forecastKeyOf(r), r]));
  let added = 0, changed = 0, removed = 0, same = 0;
  fileMap.forEach((r, k) => {
    const c = curMap.get(k);
    if (!c) added++;
    else if (num(c.app) !== num(r.app) || num(c.extra) !== num(r.extra) || num(c.fd) !== num(r.fd)) changed++;
    else same++;
  });
  currentRows.forEach(r => { if (fileRefs.has(String(r.ref).toUpperCase()) && !fileMap.has(forecastKeyOf(r))) removed++; });
  const kept = currentRows.filter(r => !fileRefs.has(String(r.ref).toUpperCase()));
  const rows = [...kept, ...fileRows].sort((a, b) => (a.ref === b.ref ? a.start.localeCompare(b.start) : a.ref.localeCompare(b.ref)));
  return { rows, added, changed, removed, same, campaigns: fileRefs.size };
}
function exportForecastCsv(rows) {
  const header = ["ref", "kampania", "start", "end", "APP", "Extra", "FD", "Suma"];
  const data = [header].concat(rows.map(r => [r.ref, r.name || campaignNameForRef(r.ref), formatDisplayDate(r.start), formatDisplayDate(r.end), num(r.app), num(r.extra), num(r.fd), round2(num(r.app) + num(r.extra) + num(r.fd))]));
  downloadBlob("Forecast_" + todayIso() + ".csv", "﻿" + data.map(r => r.map(csvCell).join(";")).join("\r\n"), "text/csv;charset=utf-8;");
}
function campaignNameForRef(ref) {
  const o = (CAMPAIGNS || []).find(c => c.ref === ref);
  return o ? o.name : "";
}

    return Array.from(m.entries()).sort((a, b) => String(a[1]).localeCompare(String(b[1])));
  }, [rows]);
  const visible = rows.filter(r => !refFilter || r.ref === refFilter).slice().sort((a, b) => (a.ref === b.ref ? a.start.localeCompare(b.start) : a.ref.localeCompare(b.ref)));

    return Array.from(m.entries()).sort((a, b) => String(a[1]).localeCompare(String(b[1])));
  }, [refs]);

  const setField = (row, field, value) => {
    const n = value === "" ? 0 : Number(String(value).replace(",", "."));
    if (isNaN(n) || n < 0) return;
    const k = forecastKeyOf(row);
    onChange(rows.map(r => (forecastKeyOf(r) === k ? { ...r, [field]: n } : r)));

  const removeRow = (row) => { const k = forecastKeyOf(row); onChange(rows.filter(r => forecastKeyOf(r) !== k)); };

    const k = forecastKeyOf(row);

        <div><label className="block text-xs text-slate-500 mb-1">FD</label><input type="number" min="0" value={nFd} onChange={e => setNFd(e.target.value)} className="w-full border border-slate-300 rounded-md px-2 py-1.5 text-sm" /></div>

  };

  const plannedByRef = useMemo(() => {

      map[r.ref] = round2((map[r.ref] || 0) + num(r.app) + num(r.extra) + num(r.fd));

    const map = {};
    forecastRows.forEach(r => {
      const mk = monthKeyOf(r.start) < "2026-07" ? "2026-07" : monthKeyOf(r.start);
      map[mk] = round2((map[mk] || 0) + num(r.app) + num(r.extra) + num(r.fd));
    });
    return map;
  }, [forecastRows]);

  const actualEntries = useMemo(() => entries.filter(e => e.date >= FORECAST_START), [entries]);

  const actualByRef = useMemo(() => {
    const map = {};
    actualEntries.forEach(e => {
      if (!e.campaignRef) return;
      map[e.campaignRef] = round2((map[e.campaignRef] || 0) + qtyOf(e));
    });
    return map;
  }, [actualEntries]);

  const actualByMonth = useMemo(() => {
    const map = {};
    actualEntries.forEach(e => {
      const mk = monthKeyOf(e.date);
      map[mk] = round2((map[mk] || 0) + qtyOf(e));
    });
    return map;
  }, [actualEntries]);

  const campaignRows = useMemo(() => {
    const refs = new Set([...Object.keys(plannedByRef), ...Object.keys(actualByRef)]);
    const nameOf = {};
    forecastRows.forEach(r => { if (r.name && !nameOf[r.ref]) nameOf[r.ref] = r.name; });
    const known = new Set(CAMPAIGNS.map(o => o.ref));
    const list = [...CAMPAIGNS.filter(o => refs.has(o.ref)), ...Array.from(refs).filter(r => !known.has(r) && plannedByRef[r]).map(r => ({ ref: r, name: nameOf[r] || r }))];
    return list.map(o => {
      const planned = plannedByRef[o.ref] || 0;
      const actual = actualByRef[o.ref] || 0;
      const pct = planned > 0 ? round2((actual / planned) * 100) : (actual > 0 ? 100 : 0);
      return { ref: o.ref, name: o.name, planned, actual, diff: round2(actual - planned), pct };
    }).sort((a, b) => b.planned - a.planned);
  }, [plannedByRef, actualByRef]);

  const monthRows = useMemo(() => {
    const months = Array.from(new Set([...Object.keys(plannedByMonth), ...Object.keys(actualByMonth)])).sort();
    return months.map(mk => {
      const planned = plannedByMonth[mk] || 0;
      const actual = actualByMonth[mk] || 0;
      const pct = planned > 0 ? round2((actual / planned) * 100) : (actual > 0 ? 100 : 0);
      return { mk, planned, actual, diff: round2(actual - planned), pct };
    });
  }, [plannedByMonth, actualByMonth]);

  const totalPlanned = round2(campaignRows.reduce((s, r) => s + r.planned, 0));
  const totalActual = round2(campaignRows.reduce((s, r) => s + r.actual, 0));
  const totalPct = totalPlanned > 0 ? round2((totalActual / totalPlanned) * 100) : 0;
  const maxPlanned = Math.max(1, ...campaignRows.map(r => r.planned));

  const Card = ({ label, value, accent }) => (
    <div className="bg-white border border-slate-200 rounded-xl shadow-sm p-4">
      <div className="text-xs uppercase tracking-wide text-slate-400">{label}</div>
      <div className={`text-2xl font-semibold mt-1 ${accent || "text-slate-800"}`}>{value}</div>
    </div>
  );

  return (
    <div>
      <p className="text-sm text-slate-500 mb-4">{t("forecastIntro")}</p>

      <div className="flex flex-wrap gap-2 mb-4 no-print">
        <button onClick={() => fileRef.current.click()} className="bg-[#009999] hover:bg-[#007373] text-white text-sm font-medium px-3 py-2 rounded-md">{t("forecastImportBtn")}</button>
        <input type="file" ref={fileRef} accept=".xlsx,.xls" className="hidden" onChange={handleFile} />
        <button onClick={() => setEditing(v => !v)} className="bg-white border border-slate-300 hover:bg-slate-50 text-sm font-medium px-3 py-2 rounded-md">{editing ? t("forecastEditClose") : t("forecastEditBtn")}</button>
        <button onClick={() => exportForecastCsv(forecastRows)} className="bg-white border border-slate-300 hover:bg-slate-50 text-sm font-medium px-3 py-2 rounded-md">{t("forecastExportBtn")}</button>
        <button onClick={resetToSeed} className="ml-auto bg-white border border-slate-300 text-slate-500 hover:bg-slate-50 text-sm font-medium px-3 py-2 rounded-md">{t("forecastResetBtn")}</button>
        {forecast.updatedAt ? <span className="text-xs text-slate-400 self-center w-full">{t("forecastLastUpdate", { date: new Date(forecast.updatedAt).toLocaleString(lang) })}</span> : null}
      </div>
      {editing && <ForecastEditor rows={forecastRows} onChange={onForecastChange} notify={notify} />}

      <div className="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-6">
        <Card label={t("forecastPlanned")} value={fmt(totalPlanned)} />
        <Card label={t("forecastActual")} value={fmt(totalActual)} accent="text-[#007373]" />
        <Card label={t("forecastPct")} value={totalPct + "%"} accent={totalPct >= 100 ? "text-emerald-600" : "text-amber-600"} />
      </div>

      <h3 className="text-sm font-semibold text-slate-700 mb-2">{t("forecastByMonth")}</h3>
      <div className="overflow-x-auto border border-slate-200 rounded-xl bg-white shadow-sm mb-6">
        <table className="min-w-full text-sm">
          <thead className="bg-slate-100 text-slate-600">
            <tr>
              <th className="px-3 py-2 text-left font-medium">{t("tabMonthly")}</th>
              <th className="px-3 py-2 text-left font-medium">{t("forecastPlanned")}</th>
              <th className="px-3 py-2 text-left font-medium">{t("forecastActual")}</th>
              <th className="px-3 py-2 text-left font-medium">{t("forecastDiff")}</th>
              <th className="px-3 py-2 text-left font-medium">{t("forecastPct")}</th>
            </tr>
          </thead>
          <tbody className="divide-y divide-slate-100">
            {monthRows.map(r => (
              <tr key={r.mk} className="hover:bg-slate-50">
                <td className="px-3 py-2 font-medium">{monthLabel(lang, r.mk)}</td>
                <td className="px-3 py-2">{fmt(r.planned)}</td>
                <td className="px-3 py-2">{fmt(r.actual)}</td>
                <td className={`px-3 py-2 ${r.diff < 0 ? "text-red-500" : "text-emerald-600"}`}>{r.diff > 0 ? "+" : ""}{fmt(r.diff)}</td>
                <td className="px-3 py-2 font-medium">{r.pct}%</td>
              </tr>
            ))}
            {monthRows.length === 0 && (
              <tr><td colSpan="5" className="px-3 py-8 text-center text-slate-400">{t("noDataDot")}</td></tr>
            )}
          </tbody>
        </table>
      </div>

      <h3 className="text-sm font-semibold text-slate-700 mb-2">{t("forecastByCampaign")}</h3>
      <div className="overflow-x-auto border border-slate-200 rounded-xl bg-white shadow-sm">
        <table className="min-w-full text-sm">
          <thead className="bg-slate-100 text-slate-600">
            <tr>
              <th className="px-3 py-2 text-left font-medium">{t("colCampaign")}</th>
              <th className="px-3 py-2 text-left font-medium">{t("forecastPlanned")}</th>
              <th className="px-3 py-2 text-left font-medium">{t("forecastActual")}</th>
              <th className="px-3 py-2 text-left font-medium">{t("forecastDiff")}</th>
              <th className="px-3 py-2 text-left font-medium">{t("forecastPct")}</th>
              <th className="px-3 py-2 text-left font-medium w-40"></th>
            </tr>
          </thead>
          <tbody className="divide-y divide-slate-100">
            {campaignRows.map(r => (
              <tr key={r.ref} className="hover:bg-slate-50">
                <td className="px-3 py-2 font-medium max-w-[280px] truncate" title={r.name + " (" + r.ref + ")"}>{r.name}</td>
                <td className="px-3 py-2">{fmt(r.planned)}</td>
                <td className="px-3 py-2">{fmt(r.actual)}</td>
                <td className={`px-3 py-2 ${r.diff < 0 ? "text-red-500" : "text-emerald-600"}`}>{r.diff > 0 ? "+" : ""}{fmt(r.diff)}</td>
                <td className="px-3 py-2 font-medium">{r.pct}%</td>
                <td className="px-3 py-2">
                  <div className="h-2 bg-slate-100 rounded-full overflow-hidden">
                    <div className={`h-2 rounded-full ${r.pct >= 100 ? "bg-emerald-500" : "bg-[#00CCCC]"}`} style={{ width: Math.min(100, (r.planned / maxPlanned * 100)) + "%" }}></div>
                  </div>
                </td>
              </tr>
            ))}
            {campaignRows.length === 0 && (
              <tr><td colSpan="6" className="px-3 py-8 text-center text-slate-400">{t("noDataDot")}</td></tr>
            )}
          </tbody>
        </table>
      </div>
    </div>
  );
}

function MultiEmployeeSelect({ options, selected, onChange, allLabel }) {
  const { t } = useLang();
  const [open, setOpen] = useState(false);
  const ref = useRef(null);
  useEffect(() => {
    function onClickOutside(e) { if (ref.current && !ref.current.contains(e.target)) setOpen(false); }
    document.addEventListener("mousedown", onClickOutside);
    return () => document.removeEventListener("mousedown", onClickOutside);
  }, []);
  const toggle = (p) => {
    onChange(selected.includes(p) ? selected.filter(x => x !== p) : [...selected, p]);
  };
  const label = selected.length === 0
    ? allLabel
    : selected.length === 1
      ? selected[0]
      : t("employeesSelectedCount", { count: selected.length });
  return (
    <div className="relative" ref={ref}>
      <button
        type="button"
        onClick={() => setOpen(o => !o)}
        className="border border-slate-300 rounded-md px-2 py-1.5 text-sm bg-white min-w-[170px] text-left flex items-center justify-between gap-2 hover:border-slate-400"
      >
        <span className="truncate">{label}</span>
        <span className="text-slate-400 text-xs">▾</span>
      </button>
      {open && (
        <div className="absolute z-20 mt-1 w-60 max-h-72 overflow-y-auto bg-white border border-slate-200 rounded-md shadow-lg p-2">
          {options.map(p => (
            <label key={p} className="flex items-center gap-2 px-2 py-1.5 text-sm hover:bg-slate-50 rounded cursor-pointer">
              <input type="checkbox" checked={selected.includes(p)} onChange={() => toggle(p)} className="accent-[#00CCCC]" />
              <span>{p}</span>
            </label>
          ))}
          {options.length === 0 && <div className="px-2 py-1.5 text-xs text-slate-400">{t("noDataDot")}</div>}
          {selected.length > 0 && (
            <button
              type="button"
              onClick={() => onChange([])}
              className="mt-1 w-full text-xs text-center px-2 py-1.5 rounded-md border border-dashed border-slate-300 text-slate-400 hover:text-slate-600 hover:border-slate-400"
            >
              {t("clearSelection")}
            </button>
          )}
        </div>
      )}
    </div>
  );
}

/* Wyniesione poza SummaryTab (na poziom modułu), żeby nie tworzyć nowej referencji komponentu przy każdym
   renderowaniu SummaryTab — inaczej React przy każdej zmianie stanu w tej zakładce (np. zaznaczenie
   pracownika w filtrze) traktowałby to jako NOWY typ komponentu i całkowicie odmontowywał/montował na nowo
   całą zawartość każdej sekcji (w tym otwarty select z listą pracowników), co gubiło fokus na zaznaczanym
   elemencie i powodowało nieoczekiwany powrót strony na górę. */
function SectionCard({ title, children }) {
  return (
    <div className="bg-white border border-slate-200 rounded-xl shadow-sm mb-6">
      <div className="px-4 py-3 border-b border-slate-100 font-semibold text-slate-700">{title}</div>
      <div className="overflow-x-auto">{children}</div>
    </div>
  );
}
function SummaryTab({ entries, pls, staffOverrides, setStaffOverrides, staffList }) {
  const { t, lang } = useLang();
  const weekly = useMemo(() => groupWeekly(entries), [entries]);
  const [staffDateFrom, setStaffDateFrom] = useState("");
  const [staffDateTo, setStaffDateTo] = useState("");
  const staffFilteredEntries = useMemo(
    () => entries.filter(e => (!staffDateFrom || e.date >= staffDateFrom) && (!staffDateTo || e.date <= staffDateTo)),
    [entries, staffDateFrom, staffDateTo]
  );
  const weeklyByType = useMemo(() => groupWeeklyByType(staffFilteredEntries, staffOverrides, staffList), [staffFilteredEntries, staffOverrides, staffList]);
  function resetStaffDateRange() { setStaffDateFrom(""); setStaffDateTo(""); }
  const [filterPl, setFilterPl] = useState("");
  const monthlyEntries = useMemo(() => (filterPl ? entries.filter(e => e.pl === filterPl) : entries), [entries, filterPl]);
  const monthly = useMemo(() => groupMonthlyPrizesForSummary(monthlyEntries), [monthlyEntries]);
  /* Zakładka Podsumowanie: w listach wyboru pracownika (filtr miesięczny i filtr w Podsumowaniu
     pracowników) pokazujemy wyłącznie aktualnie obowiązujące konta — PL01-PL10 (staff) i PLF11-PLF40
     (freelancerzy) — bez starych/nieaktualnych kodów (np. PL11-PL26 bez "F", NCH035, pgarcia). To dotyczy
     tylko listy wyboru w tej zakładce; nie zmienia globalnej listy `pls` używanej w innych zakładkach, ani
     danych/wierszy w tabelach Podsumowania (te nadal pokazują wszystkie wpisy, niezależnie od PL). */
  const plOptions = useMemo(() => {
    const validPls = new Set([...(staffList && staffList.length ? staffList : STAFF_PLS_FROM_AUGUST_2026), ...FREELANCER_PLS_FROM_AUGUST_2026].map(p => String(p).trim().toUpperCase()));
    const source = pls && pls.length ? pls : [...new Set(entries.map(e => e.pl))];
    return source.filter(p => validPls.has(String(p).trim().toUpperCase())).sort(comparePl);
  }, [pls, entries, staffList]);
  const [empDateFrom, setEmpDateFrom] = useState("");
  const [empDateTo, setEmpDateTo] = useState("");
  const [empFilterPls, setEmpFilterPls] = useState([]);
  const empFilteredEntries = useMemo(
    () => entries.filter(e =>
      (!empDateFrom || e.date >= empDateFrom) &&
      (!empDateTo || e.date <= empDateTo) &&
      (empFilterPls.length === 0 || empFilterPls.includes(e.pl))
    ),
    [entries, empDateFrom, empDateTo, empFilterPls]
  );
  const byEmployee = useMemo(() => groupByEmployee(empFilteredEntries, staffList), [empFilteredEntries, staffList]);
  const byEmployeeSorted = useMemo(() => [...byEmployee].sort((a, b) => comparePl(a.pl, b.pl)), [byEmployee]);
  const [editingWeek, setEditingWeek] = useState(null);
  function resetEmpDateRange() { setEmpDateFrom(""); setEmpDateTo(""); setEmpFilterPls([]); }

  const weekTotals = useMemo(() => weekly.reduce((a, r) => ({ qty: a.qty + r.qty, hours: round2(a.hours + r.hours) }), { qty: 0, hours: 0 }), [weekly]);
  const typeTotals = useMemo(() => weeklyByType.reduce((a, r) => ({ staffQty: a.staffQty + r.staffQty, staffHours: round2(a.staffHours + r.staffHours), freeQty: a.freeQty + r.freeQty, freeHours: round2(a.freeHours + r.freeHours) }), { staffQty: 0, staffHours: 0, freeQty: 0, freeHours: 0 }), [weeklyByType]);

  function toggleStaffForWeek(weekKey, pl, weekPls, weekRefDate) {
    setStaffOverrides(prev => {
      const defaultList = defaultStaffListForDate(weekRefDate, staffList);
      const base = Array.isArray(prev[weekKey]) ? prev[weekKey] : weekPls.filter(p => defaultList.includes(p));
      const has = base.includes(pl);
      const next = has ? base.filter(p => p !== pl) : [...base, pl];
      return { ...prev, [weekKey]: next };
    });
  }
  function resetWeekAssignment(weekKey) {
    setStaffOverrides(prev => {
      const next = { ...prev };
      delete next[weekKey];
      return next;
    });
  }
  const monthTotals = useMemo(() => monthly.reduce((a, r) => ({ qty: a.qty + r.qty, hours: round2(a.hours + r.hours) }), { qty: 0, hours: 0 }), [monthly]);
  const empTotals = useMemo(() => byEmployee.reduce((a, r) => ({ app: a.app + r.app, phys: a.phys + r.phys, prizes: a.prizes + r.prizes, qty: a.qty + r.qty, hours: round2(a.hours + r.hours) }), { app: 0, phys: 0, prizes: 0, qty: 0, hours: 0 }), [byEmployee]);

  return (
    <div>

            </tr>
          </thead>
          <tbody className="divide-y divide-slate-100">
            {weekly.map(r => (

                <td className="px-3 py-2">{fmt(r.qty)}</td>

            {weekly.length === 0 && (
              <tr><td colSpan="4" className="px-3 py-6 text-center text-slate-400">{t("noDataDot")}</td></tr>
            )}
          </tbody>
          {weekly.length > 0 && (

              <tr>
                <td className="px-3 py-2" colSpan="2">{t("sum")}</td>

                <td className="px-3 py-2">{fmt(weekTotals.hours)}</td>

        </table>
      </SectionCard>

      <SectionCard title={t("summaryStaffTitle")}>
        <p className="px-4 pt-3 text-xs text-slate-500">{t("summaryStaffNote")}</p>
        <div className="flex flex-wrap items-end gap-4 px-4 pt-3 pb-1">

function HoursCell({ entry, onCommit }) {
  const { t } = useLang();
  // UWAGA: wiąże się z staffHoursBaseOf (BEZ godzin admin), nie z staffHoursOf — inaczej edycja tego pola
  // (np. samo kliknięcie + zapis bez zmiany wartości) "zapiekłaby" już dodane godziny admin do hoursOverride,
  // co przy następnej zmianie godzin admin policzyłoby je podwójnie. Godziny admin mają własną, oddzielną
  // komórkę (AdminHoursCell) w tej samej tabeli.
  const current = staffHoursBaseOf(entry);
  const [val, setVal] = useState(String(current));
  useEffect(() => { setVal(String(current)); }, [current]);
  const commit = () => {
    const trimmed = val.trim();
    if (trimmed === "" || Number(trimmed) === 0) { onCommit({ hoursOverride: null }); return; }
    const n = parseFloat(trimmed);
    if (isNaN(n) || n <= 0) { setVal(String(current)); return; }
    onCommit({ hoursOverride: n });
  };
  return (
    <input
      type="number"
      min="0"
      step="0.01"
      value={val}
      onChange={(e) => setVal(e.target.value)}
      onBlur={commit}
      onKeyDown={(e) => { if (e.key === "Enter") e.currentTarget.blur(); }}
      title={t("staffHoursCellHint")}
      className="w-20 rounded px-1 py-0.5 text-xs text-center border border-[#00CCCC] bg-[#E6FAFA] text-[#007373] font-semibold"
    />
  );
}
/* Komórka "Godziny admin" — dodatkowe godziny, które ZAWSZE sumują się z godzinami wiersza (patrz
   adminHoursOf/hoursOf/staffHoursOf/freelancerHoursOf/salesListHoursOf). Zawsze edytowalna wprost w tabeli
   (bez potrzeby wchodzenia w tryb edycji wiersza) — analogicznie do CphCell/HoursCell powyżej. Używana w
   zakładkach Freelancerzy, Freelancer Sales List i Staff (patrz odpowiednie tabele). */
function AdminHoursCell({ entry, onCommit }) {
  const { t } = useLang();
  const current = adminHoursOf(entry);
  const [val, setVal] = useState(String(current));
  useEffect(() => { setVal(String(current)); }, [current]);
  const commit = () => {
    const trimmed = val.trim();
    if (trimmed === "" || Number(trimmed) === 0) { onCommit({ adminHours: null }); return; }
    const n = parseFloat(trimmed);
    if (isNaN(n) || n < 0) { setVal(String(current)); return; }
    onCommit({ adminHours: n });
  };
  return (
    <input
      type="number"
      min="0"
      step="0.01"
      value={val}
      onChange={(e) => setVal(e.target.value)}
      onBlur={commit}
      onKeyDown={(e) => { if (e.key === "Enter") e.currentTarget.blur(); }}
      title={t("adminHoursCellHint")}
      className="w-20 rounded px-1 py-0.5 text-xs text-center border border-amber-300 bg-amber-50 text-amber-700 font-semibold"
    />
  );
}

function StaffMonthFillForm({ staffList, entries, onBulkAdd, notify }) {
  const { t, lang } = useLang();
  const [monthKey, setMonthKey] = useState(() => todayIso().slice(0, 7));
  const [pl, setPl] = useState(staffList[0] || "");
  useEffect(() => { if ((!pl || !staffList.includes(pl)) && staffList.length) setPl(staffList[0]); }, [staffList]);
  const [campaignChoice, setCampaignChoice] = useState("");
  const [customCampaignName, setCustomCampaignName] = useState("");
  const [dayRows, setDayRows] = useState({});

  useEffect(() => { setDayRows({}); }, [monthKey, pl]);

  const selectedCampaign = CAMPAIGNS.find(o => o.ref === campaignChoice);
  const effectiveCampaignName = campaignChoice === "__custom__" ? customCampaignName.trim() : campaignChoice === "__training__" ? TRAINING_CAMPAIGN_NAME : campaignChoice === "__admin__" ? ADMIN_CAMPAIGN_NAME : (selectedCampaign ? selectedCampaign.name : "");
  const effectiveCampaignRef = (campaignChoice === "__custom__" || campaignChoice === "__training__" || campaignChoice === "__admin__") ? "" : (selectedCampaign ? selectedCampaign.ref : "");
  // Wartość informacyjna (nagłówek formularza) — reprezentatywna dla całego miesiąca. Rzeczywisty CPH
  // użyty do przeliczeń jest liczony PER DZIEŃ niżej (dayCampaignCph), bo miesiąc lipiec/sierpień może
  // obejmować dni z obu stron granicy STAFF_RULE_CUTOFF_DATE.
  const campaignCph = campaignCphAsOfDate(effectiveCampaignName, `${monthKey}-01`, effectiveCampaignRef);
  const total = daysInMonth(monthKey);

  function setRow(day, field, value) {
    setDayRows(prev => ({ ...prev, [day]: { ...(prev[day] || {}), [field]: value } }));
  }

  function handleSaveMonth() {
    const newEntries = [];
    for (let d = 1; d <= total; d++) {
      const row = dayRows[d];
      if (!row) continue;
      const hoursNum = parseFloat(row.hours);
      const hasAnyQty = row.app || row.phys || row.prizes;
      if (!hasAnyQty && (row.hours === undefined || row.hours === "")) continue;
      if (isNaN(hoursNum) || hoursNum <= 0) continue;
      const iso = `${monthKey}-${String(d).padStart(2, "0")}`;
      newEntries.push({
        id: uid(),
        date: iso,
        pl,
        app: num(row.app), phys: num(row.phys), prizes: num(row.prizes),
        campaignName: effectiveCampaignName, campaignRef: effectiveCampaignRef,
        hoursOverride: hoursNum,
      });
    }
    if (newEntries.length === 0) { notify(t("staffMonthNoRows"), "error"); return; }
    const { unique, duplicates } = splitOcrDuplicates(newEntries, entries);
    if (unique.length > 0) onBulkAdd(unique);
    if (duplicates.length > 0) {
      const msg = unique.length > 0
        ? t("staffMonthSavedWithDuplicates", { count: unique.length, blocked: duplicates.length })
        : t("staffMonthAllDuplicates", { blocked: duplicates.length });
      notify(msg, "error");
    } else {
      notify(t("staffMonthSaved", { count: unique.length }), "success");
    }
    setDayRows({});
  }

  const rowsFilled = Object.keys(dayRows).some(d => {
    const r = dayRows[d];
    return r && (r.app || r.phys || r.prizes || r.hours);
  });

  return (
    <div className="bg-white border border-slate-200 rounded-xl shadow-sm p-4 mb-4">
      <div className="text-sm font-semibold text-slate-700 mb-3">{t("staffMonthFormTitle")}</div>
      <div className="flex flex-wrap items-end gap-3 mb-4">
        <div>
          <label className="block text-xs text-slate-500 mb-1">{t("formEmployee")}</label>
          <select value={pl} onChange={e => setPl(e.target.value)} className="border border-slate-300 rounded-md px-2 py-1.5 text-sm min-w-[110px]">
            {staffList.map(p => <option key={p} value={p}>{p}</option>)}
          </select>
        </div>
        <div>
          <label className="block text-xs text-slate-500 mb-1">{t("monthSelect")}</label>
          <input type="month" value={monthKey} onChange={e => setMonthKey(e.target.value)} className="border border-slate-300 rounded-md px-2 py-1.5 text-sm" />
        </div>
        <div className="flex-1 min-w-[220px]">
          <label className="block text-xs text-slate-500 mb-1">{t("formCampaign")}</label>
          <select value={campaignChoice} onChange={e => setCampaignChoice(e.target.value)} className="w-full border border-slate-300 rounded-md px-2 py-1.5 text-sm">
            <option value="">{t("noCampaign")}</option>
            {CAMPAIGNS.map(o => <option key={o.ref} value={o.ref}>{o.name} — {o.ref}</option>)}
            <option value="__training__">{t("trainingOption")}</option>
            <option value="__admin__">{t("adminOption")}</option>
            <option value="__custom__">{t("otherCampaign")}</option>
          </select>
          {campaignChoice === "__custom__" && (
            <input type="text" value={customCampaignName} onChange={e => setCustomCampaignName(e.target.value)} placeholder={t("customCampaignName")} className="w-full border border-slate-300 rounded-md px-2 py-1.5 text-sm mt-2" />
          )}
        </div>
        <div className="text-xs text-slate-500">
          {t("staffCampaignCph")}: <span className="font-semibold text-slate-700">{campaignCph}</span>
        </div>
      </div>

      <div className="overflow-y-auto max-h-96 border border-slate-200 rounded-lg">
        <table className="min-w-full text-sm">

              <th className="px-3 py-2 text-left font-medium">{t("staffFormHoursLabel")}</th>
              <th className="px-3 py-2 text-left font-medium">{t("staffAchievedCph")}</th>
              <th className="px-3 py-2 text-left font-medium">{t("staffAchievementPct")}</th>
            </tr>
          </thead>
          <tbody className="divide-y divide-slate-100">
            {Array.from({ length: total }, (_, i) => i + 1).map(d => {
              const row = dayRows[d] || { app: "", phys: "", prizes: "", hours: "" };
              const qty = qtyOfStaff({ app: row.app, phys: row.phys, prizes: row.prizes });
              const hoursNum = parseFloat(row.hours);
              const achieved = (!isNaN(hoursNum) && hoursNum > 0) ? round2(qty / hoursNum) : null;
              const iso = `${monthKey}-${String(d).padStart(2, "0")}`;
              const dayCampaignCph = campaignCphAsOfDate(effectiveCampaignName, iso, effectiveCampaignRef);
              const pct = achieved != null && dayCampaignCph > 0 ? round2((achieved / dayCampaignCph) * 100) : null;
              return (
                <tr key={d} className="hover:bg-slate-50">
                  <td className="px-3 py-2 whitespace-nowrap text-slate-500">{formatDisplayDate(iso)}</td>
                  <td className="px-2 py-1"><input type="number" min="0" value={row.app} onChange={e => setRow(d, "app", e.target.value)} placeholder="0" className="w-20 border border-slate-300 rounded px-1.5 py-1 text-xs" /></td>

                  <td className="px-2 py-1"><input type="number" min="0" value={row.prizes} onChange={e => setRow(d, "prizes", e.target.value)} placeholder="0" className="w-20 border border-slate-300 rounded px-1.5 py-1 text-xs" /></td>
                  <td className="px-2 py-1"><input type="number" min="0" step="0.01" value={row.hours} onChange={e => setRow(d, "hours", e.target.value)} placeholder="0.00" className="w-20 border border-[#00CCCC] bg-[#E6FAFA] rounded px-1.5 py-1 text-xs" /></td>
                  <td className="px-3 py-2 text-slate-500">{achieved != null ? achieved : "—"}</td>
                  <td className={`px-3 py-2 font-medium ${pct == null ? "text-slate-400" : pct >= 100 ? "text-emerald-600" : "text-amber-600"}`}>{pct != null ? pct + "%" : "—"}</td>
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>

      <div className="flex items-center justify-between mt-3">
        <div className="text-xs text-slate-400">{t("staffMonthHelper")}</div>

          type="button"

        >

        </button>
      </div>
    </div>
  );
}

function StaffProductivityTab({ entries, staffList, onAddStaffPl, onRemoveStaffPl, onResetStaffList, onAdd, onBulkAdd, onUpdate, onDelete, notify }) {
  const { t, lang } = useLang();
  const [newPlCode, setNewPlCode] = useState("");
  const [addMode, setAddMode] = useState("day");

  // Filtry ujednolicone z zakładką Freelancerzy: miesiąc, wielu pracowników naraz, dzień, zakres dat Od-Do.
  const [filterMonth, setFilterMonth] = useState("");
  const [filterStaffPls, setFilterStaffPls] = useState([]);
  const [filterDate, setFilterDate] = useState("");
  const [filterDateFrom, setFilterDateFrom] = useState("");
  const [filterDateTo, setFilterDateTo] = useState("");
  useEffect(() => { setFilterStaffPls(prev => prev.filter(p => staffList.includes(p))); }, [staffList]);

  const staffEntries = useMemo(
    () => entries.filter(e => staffList.includes(String(e.pl || "").trim().toUpperCase())),
    [entries, staffList]
  );

  const months = useMemo(() => Array.from(new Set(staffEntries.map(e => monthKeyOf(e.date)))).sort(), [staffEntries]);

  const filteredStaffEntries = useMemo(() => {
    return staffEntries
      .filter(e => !filterMonth || monthKeyOf(e.date) === filterMonth)
      .filter(e => filterStaffPls.length === 0 || filterStaffPls.includes(e.pl))
      .filter(e => !filterDate || e.date === filterDate)
      .filter(e => !filterDateFrom || e.date >= filterDateFrom)
      .filter(e => !filterDateTo || e.date <= filterDateTo);
  }, [staffEntries, filterMonth, filterStaffPls, filterDate, filterDateFrom, filterDateTo]);

  const sorted = useMemo(
    () => [...filteredStaffEntries].sort((a, b) => (a.date === b.date ? a.pl.localeCompare(b.pl) : b.date.localeCompare(a.date))),
    [filteredStaffEntries]
  );
  const totals = useMemo(() => {
    // UWAGA: "hours" liczone tu z staffHoursBaseOf (BEZ godzin admin), żeby zgadzało się z tym, co widać w
    // edytowalnej komórce Godziny (HoursCell, też oparta na staffHoursBaseOf) i żeby średnia ważona
    // Produktywności/% realizacji nie była "rozwadniana" godzinami admin (patrz staffAchievedCphOf). Godziny
    // admin mają własną, osobną sumę (adminHours) — widoczną w nowej kolumnie "Godziny admin".
    let app = 0, phys = 0, prizes = 0, hours = 0, adminHours = 0, qtyWithHours = 0, expected = 0;
    filteredStaffEntries.forEach(e => {
      app += num(e.app); phys += num(e.phys); prizes += num(e.prizes);
      const h = staffHoursBaseOf(e);
      hours = round2(hours + h);
      adminHours = round2(adminHours + adminHoursOf(e));
      // Do średniej ważonej Produktywności liczymy tylko wiersze z wpisanymi godzinami
      // (ta sama zasada co przy pojedynczym wierszu: bez godzin brak sensownego % realizacji).
      if (h > 0) {
        const q = qtyOfStaff(e);
        qtyWithHours += q;
        const campaignCph = staffTargetCphOf(e);
        if (campaignCph > 0) expected += campaignCph * h;
      }
    });
    const qty = app + phys + prizes;
    const pct = expected > 0 ? round2((qtyWithHours / expected) * 100) : null;
    return { app, phys, prizes, qty, hours, adminHours, pct };
  }, [filteredStaffEntries]);
  function resetStaffDateRange() { setFilterDateFrom(""); setFilterDateTo(""); }

  function handleAddStaffPl() {
    if (!newPlCode.trim()) return;
    onAddStaffPl(newPlCode);
    setNewPlCode("");
  }

  return (
    <div>
      <div className="bg-white border border-slate-200 rounded-xl shadow-sm p-4 mb-4 no-print">
        <div className="flex items-center justify-between mb-2">
          <div className="font-semibold text-slate-700 text-sm">{t("staffListTitle")}</div>
          <button type="button" onClick={onResetStaffList} className="text-xs px-2 py-1 rounded-md border border-dashed border-slate-300 text-slate-400 hover:text-slate-600 hover:border-slate-400">
            {t("resetAssign")}
          </button>
        </div>
        <p className="text-xs text-slate-500 mb-3">{t("staffListNote")}</p>
        <div className="flex flex-wrap gap-2 mb-3">
          {staffList.map(p => (
            <span key={p} className="inline-flex items-center gap-1.5 bg-[#E6FAFA] text-[#007373] text-xs font-medium px-2.5 py-1 rounded-full">
              {p}
              <button type="button" onClick={() => onRemoveStaffPl(p)} className="text-[#007373]/60 hover:text-rose-600">×</button>
            </span>
          ))}
          {staffList.length === 0 && <span className="text-xs text-slate-400">{t("noDataDot")}</span>}
        </div>
        <div className="flex items-center gap-2">
          <input
            type="text"
            value={newPlCode}
            onChange={e => setNewPlCode(e.target.value)}
            onKeyDown={e => { if (e.key === "Enter") { e.preventDefault(); handleAddStaffPl(); } }}
            placeholder={t("staffListAddPlaceholder")}
            className="border border-slate-300 rounded-md px-2 py-1.5 text-sm w-40"
          />
          <button type="button" onClick={handleAddStaffPl} className="text-sm px-3 py-1.5 rounded-md border border-slate-300 bg-white hover:bg-slate-100 text-slate-600">
            {t("staffListAddBtn")}
          </button>
        </div>
      </div>

      <div className="flex gap-2 mb-3 no-print">
        <button
          type="button"
          onClick={() => setAddMode("day")}
          className={`text-xs font-medium px-3 py-1.5 rounded-md border ${addMode === "day" ? "bg-[#00CCCC] border-[#00CCCC] text-white" : "bg-white border-slate-300 text-slate-600 hover:bg-slate-100"}`}
        >
          {t("staffModeDay")}
        </button>
        <button

        >
          {t("staffModeMonth")}
        </button>
      </div>

      <div className="no-print">
        {addMode === "day" && <StaffAddEntryForm staffList={staffList} onAdd={onAdd} notify={notify} />}
        {addMode === "month" && <StaffMonthFillForm staffList={staffList} entries={entries} onBulkAdd={onBulkAdd} notify={notify} />}
      </div>

      <div className="flex flex-wrap gap-2 mb-3 no-print">

        {(filterDateFrom || filterDateTo) && (

            {t("resetRange")}
          </button>
        )}
        <span className="text-xs text-slate-400">{t("rowsCount", { count: sorted.length })}</span>
      </div>

      <div className="hidden print:block mb-4">
        <div className="text-lg font-semibold text-slate-800">{t("tabStaffProd")}</div>
        <div className="text-sm text-slate-600 mt-1">
          {printRangeLabel(t, { filterDate, filterDateFrom, filterDateTo })}
          {filterMonth ? ` · ${monthLabel(lang, filterMonth)}` : ""}
          {filterStaffPls.length > 0 ? ` · ${t("printFilterEmployeesLabel")} ${filterStaffPls.join(", ")}` : ""}
          {` · ${t("rowsCount", { count: sorted.length })}`}
        </div>

function FreelancerTab({ entries, pls, onAdd, onAddPl, onUpdate, onDelete, notify }) {

  const freelancerPlSet = useMemo(() => new Set(FREELANCER_PLS_FROM_AUGUST_2026), []);
  const freelancerPls = useMemo(() => {
    const fromPls = (pls || []).filter(p => freelancerPlSet.has(String(p || "").trim().toUpperCase()));
    return Array.from(new Set([...FREELANCER_PLS_FROM_AUGUST_2026, ...fromPls])).sort(comparePl);
  }, [pls, freelancerPlSet]);

  const [filterMonth, setFilterMonth] = useState("");

  const [filterDateFrom, setFilterDateFrom] = useState("");
  const [filterDateTo, setFilterDateTo] = useState("");

  const freelancerEntries = useMemo(
    () => entries.filter(e => freelancerPlSet.has(String(e.pl || "").trim().toUpperCase())),

  );

  const months = useMemo(() => Array.from(new Set(freelancerEntries.map(e => monthKeyOf(e.date)))).sort(), [freelancerEntries]);

/* ============================== PLIK WSPÓŁDZIELONY (OneDrive / inny zsynchronizowany folder) ==============================
   Umożliwia kilku osobom korzystanie z TYCH SAMYCH danych naraz, bez własnego serwera: dane (entries, pls,
   staffList, campaigns, staffOverrides, cph) są zapisywane do jednego pliku .json, który każda osoba wskazuje
   w swoim, lokalnie zsynchronizowanym folderze OneDrive (działa też z innym folderem synchronizowanym, np.
   Dropbox/Google Drive Desktop — dla aplikacji to zwykły plik na dysku). Aplikacja co kilka sekund sprawdza, czy
   plik na dysku się zmienił (np. bo dotarła zmiana od innej osoby przez synchronizację OneDrive) i wtedy wczytuje
   nową wersję. Zapis działa na zasadzie "ostatni zapis wygrywa" — to nie jest prawdziwa baza danych z blokadami
   zapisu, więc przy zapisie DOKŁADNIE w tej samej chwili przez dwie osoby jedna zmiana może zostać nadpisana
   (OneDrive w takiej sytuacji czasem dodatkowo tworzy plik "-kopia konfliktu" do ręcznego porównania). Wymaga
   File System Access API — działa w Chrome/Edge na komputerze; Firefox, Safari i przeglądarki mobilne nie są
   wspierane i aplikacja wtedy po prostu działa jak dotychczas (dane tylko w localStorage tej przeglądarki). */
/* Stary tryb "jeden wspólny plik JSON" jest wyłączony: zastępuje go folder wspólny z dziennikami zmian
   (patrz SharedFolderBar i komentarz przy SHARED_FOLDER_SUPPORTED niżej). Kod zostaje, ale nie jest aktywny. */
const SHARED_FILE_SUPPORTED = false;
const SHARED_FILE_IDB_DB = "masterps_shared_file_v1";
const SHARED_FILE_IDB_STORE = "handles";
const SHARED_FILE_IDB_KEY = "handle";
const SHARED_FILE_POLL_MS = 5000;
const SHARED_FILE_WRITE_DEBOUNCE_MS = 700;

function sharedFileIdbOpen() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(SHARED_FILE_IDB_DB, 1);
    req.onupgradeneeded = () => { req.result.createObjectStore(SHARED_FILE_IDB_STORE); };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
async function sharedFileIdbGet() {
  try {
    const db = await sharedFileIdbOpen();
    return await new Promise((resolve, reject) => {
      const tx = db.transaction(SHARED_FILE_IDB_STORE, "readonly");
      const req = tx.objectStore(SHARED_FILE_IDB_STORE).get(SHARED_FILE_IDB_KEY);
      req.onsuccess = () => resolve(req.result || null);
      req.onerror = () => reject(req.error);
    });
  } catch (e) { return null; }
}
async function sharedFileIdbSet(handle) {
  try {
    const db = await sharedFileIdbOpen();
    return await new Promise((resolve, reject) => {
      const tx = db.transaction(SHARED_FILE_IDB_STORE, "readwrite");
      tx.objectStore(SHARED_FILE_IDB_STORE).put(handle, SHARED_FILE_IDB_KEY);
      tx.oncomplete = () => resolve(true);
      tx.onerror = () => reject(tx.error);
    });
  } catch (e) { return false; }
}
async function sharedFileIdbClear() {
  try {
    const db = await sharedFileIdbOpen();
    return await new Promise((resolve, reject) => {
      const tx = db.transaction(SHARED_FILE_IDB_STORE, "readwrite");
      tx.objectStore(SHARED_FILE_IDB_STORE).delete(SHARED_FILE_IDB_KEY);
      tx.oncomplete = () => resolve(true);
      tx.onerror = () => reject(tx.error);
    });
  } catch (e) { return false; }
}
async function sharedFileVerifyPermission(handle, forWrite) {
  const opts = forWrite ? { mode: "readwrite" } : { mode: "read" };
  try {
    if ((await handle.queryPermission(opts)) === "granted") return true;
    if ((await handle.requestPermission(opts)) === "granted") return true;
  } catch (e) {}
  return false;
}
async function sharedFileRead(handle) {
  const file = await handle.getFile();
  const text = await file.text();
  const data = text.trim() ? JSON.parse(text) : {};
  return { data, lastModified: file.lastModified };
}
async function sharedFileWrite(handle, data) {
  const writable = await handle.createWritable();
  await writable.write(JSON.stringify(data, null, 2));
  await writable.close();
  const file = await handle.getFile();
  return file.lastModified;
}

/* ---- Scalanie (merge) danych pliku współdzielonego przed zapisem ----
   Zamiast ślepo nadpisywać cały plik aktualnym stanem tej przeglądarki (co mogłoby bezpowrotnie skasować
   wpisy dodane przez inne osoby, które zdążyły zapisać się do pliku - np. na innym komputerze przez OneDrive
   - ale jeszcze nie dotarły do lokalnego stanu tej przeglądarki, bo odpytywanie pliku odbywa się co
   SHARED_FILE_POLL_MS), przed każdym zapisem odczytujemy AKTUALNĄ zawartość pliku z dysku i scalamy ją z
   lokalnym stanem: suma zbiorów (unia) po kluczu (id wpisu / ref kampanii / sam kod loginu), z lokalną wersją
   mającą pierwszeństwo przy konflikcie tego samego klucza (zakładamy, że to najnowsza zmiana wprowadzona w
   TEJ przeglądarce). To naprawia zgłaszany problem "nie widzę wpisów innych osób mimo połączenia z plikiem" -
   bez scalania, w scenariuszu kilku osób dodających dane w podobnym czasie, kolejne zapisy poszczególnych
   przeglądarek mogły się nawzajem "prześcigać" i kasować cudze, jeszcze niepobrane wpisy. */
function unionByKey(diskList, localList, keyFn) {
  const map = new Map();
  (Array.isArray(diskList) ? diskList : []).forEach(item => map.set(keyFn(item), item));
  (Array.isArray(localList) ? localList : []).forEach(item => map.set(keyFn(item), item));
  return Array.from(map.values());
}
function unionStrings(diskList, localList) {
  const set = new Set([...(Array.isArray(diskList) ? diskList : []), ...(Array.isArray(localList) ? localList : [])]);
  return Array.from(set).sort();
}
function mergeSharedPayload(diskData, localPayload) {
  const disk = diskData && typeof diskData === "object" ? diskData : {};
  const deletedIds = unionStrings(disk.deletedIds, localPayload.deletedIds);
  const deletedSet = new Set(deletedIds);
  return {
    entries: unionByKey(disk.entries, localPayload.entries, e => e.id).filter(e => !deletedSet.has(e.id)),
    deletedIds,
    pls: unionStrings(disk.pls, localPayload.pls),
    staffList: unionStrings(disk.staffList, localPayload.staffList),
    campaigns: unionByKey(disk.campaigns, localPayload.campaigns, c => c.ref),
    // staffOverrides: obiekt kluczowany numerem tygodnia (weekKey) -> tablica loginów staffu dla tego
    // tygodnia. Scalanie płytkie (per klucz tygodnia) jest tu bezpieczne, bo każdy klucz to samodzielna,
    // kompletna wartość (cała lista dla danego tygodnia), a nie coś wymagającego głębszego scalania.
    // Forecast: wygrywa nowsza wersja (updatedAt) — cała lista naraz, więc import/edycja nie duplikują wierszy.
    forecast: (disk.forecast && Array.isArray(disk.forecast.rows) && (!localPayload.forecast || num(disk.forecast.updatedAt) > num(localPayload.forecast.updatedAt))) ? disk.forecast : localPayload.forecast,
    staffOverrides: { ...(disk.staffOverrides && typeof disk.staffOverrides === "object" ? disk.staffOverrides : {}), ...(localPayload.staffOverrides || {}) },
    cph: localPayload.cph,
    savedAt: Date.now(),
  };
}

  if (!SHARED_FILE_SUPPORTED) {

      </div>

  }

const CONFIRM_LABELS = { pl: ["OK", "Anuluj"], en: ["OK", "Cancel"], it: ["OK", "Annulla"], es: ["Aceptar", "Cancelar"] };
function askConfirm(message) {
  return new Promise(resolve => {
    const [okL, cancelL] = CONFIRM_LABELS[CURRENT_LANG] || CONFIRM_LABELS.pl;
    const overlay = document.createElement("div");
    overlay.className = "fixed inset-0 z-[100] bg-slate-900/40 flex items-center justify-center p-4";
    const box = document.createElement("div");
    box.className = "bg-white rounded-xl shadow-xl max-w-lg w-full p-5 text-slate-800";
    box.setAttribute("role", "dialog"); box.setAttribute("aria-modal", "true");
    const msg = document.createElement("div");
    msg.className = "text-sm whitespace-pre-line max-h-[60vh] overflow-y-auto";
    msg.textContent = message;
    const row = document.createElement("div");
    row.className = "flex justify-end gap-2 mt-4";
    const cancel = document.createElement("button");
    cancel.type = "button"; cancel.textContent = cancelL;
    cancel.className = "bg-white border border-slate-300 hover:bg-slate-50 text-sm font-medium px-4 py-2 rounded-md";
    const ok = document.createElement("button");
    ok.type = "button"; ok.textContent = okL;
    ok.className = "bg-[#009999] hover:bg-[#007373] text-white text-sm font-medium px-4 py-2 rounded-md";
    const done = (v) => { document.removeEventListener("keydown", onKey); overlay.remove(); resolve(v); };
    const onKey = (e) => { if (e.key === "Escape") done(false); if (e.key === "Enter") done(true); };
    cancel.onclick = () => done(false); ok.onclick = () => done(true);
    overlay.onclick = (e) => { if (e.target === overlay) done(false); };
    document.addEventListener("keydown", onKey);
    row.append(cancel, ok); box.append(msg, row); overlay.append(box);
    document.body.appendChild(overlay); ok.focus();
  });
}

/* ============================== FOLDER WSPÓŁDZIELONY (dzienniki zmian) ==============================
   Kilka osób pracuje jednocześnie na tych samych danych: każda przeglądarka dopisuje swoje zmiany WYŁĄCZNIE
   do własnych plików w folderze wspólnym (OneDrive/SharePoint), a odczytuje pliki wszystkich osób i scala je
   (silnik: window.MasterPSSync, plik sync/masterps-sync.js). Zapis i odświeżanie są automatyczne.
   Wymaga File System Access API (Chrome/Edge na komputerze). */
const SYNC = typeof window !== "undefined" ? window.MasterPSSync : null;
const SYNC_DEV_PARAMS = typeof location !== "undefined" ? new URLSearchParams(location.search) : new URLSearchParams("");
const SYNC_DEV_OPFS = SYNC_DEV_PARAMS.get("syncdev") === "opfs"; // tylko testy deweloperskie: prywatny magazyn przeglądarki zamiast folderu
/* Tworzenie danych wspólnych (jednorazowa migracja) jest dostępne tylko po otwarciu aplikacji z "?setup=1"
   (albo w trybie testów deweloperskich). Zwykli użytkownicy, którzy trafią na folder bez danych (np. bo OneDrive
   nie pobrał ich jeszcze), widzą komunikat "poczekaj" i aplikacja sama sprawdza folder ponownie — dzięki temu
   nikt nie utworzy przypadkiem drugiej, starszej kopii danych wspólnych. */
const SYNC_SETUP_MODE = SYNC_DEV_PARAMS.get("setup") === "1" || (SYNC_DEV_OPFS && SYNC_DEV_PARAMS.get("setup") !== "0");
const SYNC_NOT_INIT_RECHECK_MS = 30000;
const SHARED_FOLDER_SUPPORTED = !!SYNC && typeof indexedDB !== "undefined" && (typeof window.showDirectoryPicker === "function" || SYNC_DEV_OPFS);
const SYNC_IDB_DB = "masterps_shared_folder_v1";
const SYNC_LS_WRITER = "masterps_sync_writer_v1";
const SYNC_LS_NAME = "masterps_sync_name_v1";
let SHARED_SYNC_ACTIVE = false; // czytane przez potwierdzenia operacji dotyczących wszystkich danych

function syncIdb(mode, fn) {
  return new Promise((resolve) => {
    let req;
    try { req = indexedDB.open(SYNC_IDB_DB, 1); } catch (e) { resolve(null); return; }
    req.onupgradeneeded = () => req.result.createObjectStore("kv");
    req.onerror = () => resolve(null);
    req.onsuccess = () => {
      try {
        const tx = req.result.transaction("kv", mode);
        const r = fn(tx.objectStore("kv"));
        tx.oncomplete = () => resolve(r && "result" in r ? r.result : true);
        tx.onerror = () => resolve(null);
      } catch (e) { resolve(null); }
    };
  });
}
const syncIdbGet = (k) => syncIdb("readonly", s => s.get(k));
const syncIdbSet = (k, v) => syncIdb("readwrite", s => s.put(v, k));
const syncIdbDel = (k) => syncIdb("readwrite", s => s.delete(k));

function syncWriterId() {
  if (SYNC_DEV_OPFS && SYNC_DEV_PARAMS.get("writer")) return SYNC_DEV_PARAMS.get("writer");
  let id = null;
  try { id = localStorage.getItem(SYNC_LS_WRITER); } catch (e) {}
  if (!id) {
    id = "W-" + Array.from(crypto.getRandomValues(new Uint8Array(6)), b => (b % 36).toString(36)).join("");
    try { localStorage.setItem(SYNC_LS_WRITER, id); } catch (e) {}
  }
  return id;
}
function syncWriterName() {
  if (SYNC_DEV_OPFS && SYNC_DEV_PARAMS.get("name")) return SYNC_DEV_PARAMS.get("name");
  try { return localStorage.getItem(SYNC_LS_NAME) || ""; } catch (e) { return ""; }
}
async function syncDevFolder() {
  const root = await navigator.storage.getDirectory();
  const dir = await root.getDirectoryHandle("MasterPS-Data", { create: true });
  const p = Number(SYNC_DEV_PARAMS.get("faults")) || 0; // tylko testy: symulacja plików chwilowo zablokowanych przez OneDrive
  return p > 0 ? syncDevFaulty(dir, p) : dir;
}
function syncDevFaulty(h, p) {
  const fail = () => { if (Math.random() < p) { const e = new Error("simulated OneDrive lock"); e.name = "NotReadableError"; throw e; } };
  if (h.kind === "file") return { kind: "file", name: h.name, getFile: async () => { fail(); return h.getFile(); }, createWritable: (o) => h.createWritable(o) };
  return {
    kind: "directory", name: h.name,
    getDirectoryHandle: async (n, o) => syncDevFaulty(await h.getDirectoryHandle(n, o), p),
    getFileHandle: async (n, o) => syncDevFaulty(await h.getFileHandle(n, o), p),
    entries: async function* () { for await (const [n, c] of h.entries()) yield [n, syncDevFaulty(c, p)]; },
    queryPermission: async () => "granted", requestPermission: async () => "granted",
  };
}
async function syncFolderIsEmpty(handle) {
  for await (const [name] of handle.entries()) {
    if (name === "desktop.ini" || name.startsWith(".") || name.endsWith(".crswap")) continue;
    return false;
  }
  return true;
}

function SyncAgo({ ts }) {
  const { t } = useLang();
  const [, setTick] = useState(0);
  useEffect(() => { const i = setInterval(() => setTick(x => x + 1), 5000); return () => clearInterval(i); }, []);
  const s = Math.max(0, Math.round((Date.now() - ts) / 1000));
  if (s < 60) return t("syncAgoSec", { n: s });
  if (s < 3600) return t("syncAgoMin", { n: Math.floor(s / 60) });
  return t("syncAgoHour", { n: Math.floor(s / 3600) });
}

/* "sprawdzono X s temu": pokazuje, że automatyczne sprawdzanie folderu działa (odświeża się samo, bez
   przerysowywania reszty aplikacji). Po najechaniu myszą: statystyki odczytu do diagnozy. */
function SyncLastCheck({ engineRef }) {
  const { t } = useLang();
  const [, setTick] = useState(0);
  useEffect(() => { const i = setInterval(() => setTick(x => x + 1), 2000); return () => clearInterval(i); }, []);
  const eng = engineRef && engineRef.current;
  if (!eng || !eng.status.lastPollAt) return null;
  const s = Math.max(0, Math.round((Date.now() - eng.status.lastPollAt) / 1000));
  const st = eng.stats;
  const info = "lines read: " + st.linesRead + " · read retries: " + st.pollErrors + " · gaps healed: " + (st.gapsHealed || 0) + " · damaged lines: " + st.badLines + " · last read error: " + (st.lastPollError || "-");
  return <span className={s > 30 ? "text-rose-600" : "text-slate-400"} title={info}>{" · "}{t("syncChecked", { n: s })}</span>;
}

    // pracowników, niezależnie od tego, co było już zapisane w tej przeglądarce — nic z bazy nie jest usuwane.
    const merged = Array.from(new Set([...base, ...STAFF_PLS_FROM_AUGUST_2026, ...FREELANCER_PLS_FROM_AUGUST_2026]));
