<!-- Shared-folder sync engine: copied from sync/masterps-sync.js by sync/embed-engine.ps1 (do not edit here) -->
<script id="masterps-sync-engine">
/* ============================================================================================
   Master PS+ shared change-log sync engine (format "masterps-changelog", version 1)

   Folder layout (inside the shared OneDrive/SharePoint "Data" folder):
     manifest.json                     written once by initialize()
     writers/<writerId>.json           display name of each browser, written only by that browser
     log/<YYYY-MM>/<writerId>.jsonl    change lines, appended ONLY by that writer
     snapshots/snap-<ts>-<writer>.json full merged state + how far each log file was read

   Every change line: {"v":1,"w":writerId,"s":seq,"t":hybridTimestamp,"ops":[...]}
   Merge rule: every field / presence flag / setting is a register; the value with the highest
   stamp (timestamp + writerId) wins. Applying a line is idempotent and order-independent, so
   every browser ends up with identical data no matter when or in which order files arrive.

   The engine never touches anything outside the folder handle it is given.
   Plain JavaScript, no dependencies; works with real folder handles (File System Access API),
   the browser's private storage (OPFS) and the in-memory test folder in sync-tests.html.
   ============================================================================================ */
(function (global) {
  "use strict";

  const FORMAT = "masterps-changelog";
  const VERSION = 1;
  const enc = new TextEncoder();
  const LOG_FILE_RE = /^W-[A-Za-z0-9_-]+\.jsonl$/;
  const MONTH_RE = /^\d{4}-\d{2}$/;
  const SNAP_RE = /^snap-.+\.json$/;

  /* ---------------- hybrid logical clock ---------------- */
  const pad = (n, w) => String(n).padStart(w, "0");
  const makeTs = (p, l) => pad(p, 15) + "." + pad(l, 6);
  const parseTs = (ts) => { const i = ts.indexOf("."); return { p: Number(ts.slice(0, i)), l: Number(ts.slice(i + 1)) }; };
  const isTs = (ts) => typeof ts === "string" && /^\d{15}\.\d{6}$/.test(ts);
  const monthOfTs = (ts) => new Date(parseTs(ts).p).toISOString().slice(0, 7); // UTC month

  class Clock {
    constructor(now) { this.now = now; this.p = 0; this.l = 0; }
    tick() {
      const n = Math.floor(this.now());
      if (n > this.p) { this.p = n; this.l = 0; } else { this.l += 1; }
      return makeTs(this.p, this.l);
    }
    observe(ts) {
      const { p, l } = parseTs(ts);
      if (p > this.p || (p === this.p && l > this.l)) { this.p = p; this.l = l; }
    }
    current() { return makeTs(this.p, this.l); }
  }

  /* ---------------- value helpers ---------------- */
  const norm = (v) => (v === undefined ? null : v);
  function same(a, b) {
    a = norm(a); b = norm(b);
    if (a === b) return true;
    if (a && b && typeof a === "object" && typeof b === "object") return JSON.stringify(a) === JSON.stringify(b);
    return false;
  }
  function fieldsOf(obj, key) {
    const f = {};
    for (const k of Object.keys(obj)) if (k !== key && obj[k] !== undefined && obj[k] !== null) f[k] = obj[k];
    return f;
  }
  const defaultCompare = (a, b) => String(a).localeCompare(String(b), undefined, { numeric: true });

  /* ---------------- the merged model (registers) ---------------- */
  // entity: { p: [present, stamp] | null, f: { field: [value, stamp] }, o: orderStamp | null }
  class Model {
    constructor() {
      this.entries = new Map();
      this.campaigns = new Map();
      this.pls = new Map();       // code -> [present, stamp]
      this.staff = new Map();     // code -> [present, stamp]
      this.weeks = new Map();     // weekKey -> [array|null, stamp]
      this.settings = new Map();  // key -> [value, stamp]
      this.forecast = null;       // [value, stamp]
    }
  }

  const newTouched = () => ({ entries: new Map(), campaigns: new Map(), pls: new Set(), staff: new Set(), weeks: new Set(), settings: new Set(), forecast: false, count: 0 });

  function touchEntity(tmap, key) { let t = tmap.get(key); if (!t) { t = { presence: false, fields: new Set() }; tmap.set(key, t); } return t; }

  /* Effective value of a field: a (re-)add carries the complete record, so any field written
     before the latest add (ent.r) counts as empty. Using "max stamp" comparisons only keeps the
     result independent of the order in which lines arrive. */
  const effective = (ent, k) => { const r = ent.f[k]; return r && (!ent.r || r[1] >= ent.r) ? r[0] : null; };

  // kind: "add" | "upd" | "del"
  function applyEntity(map, tmap, key, kind, fields, stamp) {
    let ent = map.get(key);
    if (!ent) { ent = { p: null, f: {}, o: null, r: null }; map.set(key, ent); }
    const before = {};
    for (const k of Object.keys(ent.f)) before[k] = effective(ent, k);
    if (kind === "add" || kind === "del") {
      const val = kind === "add";
      if (!ent.p || stamp > ent.p[1]) {
        const changed = !ent.p || ent.p[0] !== val;
        ent.p = [val, stamp];
        if (changed) touchEntity(tmap, key).presence = true;
      }
    }
    if (kind === "add") {
      if (!ent.o || stamp < ent.o) ent.o = stamp;
      if (!ent.r || stamp > ent.r) ent.r = stamp;
    }
    if (fields) {
      for (const k of Object.keys(fields)) {
        const r = ent.f[k];
        if (!r || stamp > r[1]) ent.f[k] = [norm(fields[k]), stamp];
      }
    }
    for (const k of Object.keys(ent.f)) {
      if (!same(before[k] === undefined ? null : before[k], effective(ent, k))) touchEntity(tmap, key).fields.add(k);
    }
  }

  function applyRegister(map, tset, key, value, stamp) {
    const r = map.get(key);
    if (!r || stamp > r[1]) {
      if (!r || !same(r[0], value)) tset.add(key);
      map.set(key, [value, stamp]);
    }
  }

  function applyOp(model, op, stamp, t) {
    switch (op.op) {
      case "entry.add": applyEntity(model.entries, t.entries, op.k, "add", op.f, stamp); break;
      case "entry.upd": applyEntity(model.entries, t.entries, op.k, "upd", op.f, stamp); break;
      case "entry.del": applyEntity(model.entries, t.entries, op.k, "del", null, stamp); break;
      case "campaign.add": applyEntity(model.campaigns, t.campaigns, op.k, "add", op.f, stamp); break;
      case "campaign.upd": applyEntity(model.campaigns, t.campaigns, op.k, "upd", op.f, stamp); break;
      case "campaign.del": applyEntity(model.campaigns, t.campaigns, op.k, "del", null, stamp); break;
      case "pl.add": applyRegister(model.pls, t.pls, op.k, true, stamp); break;
      case "pl.del": applyRegister(model.pls, t.pls, op.k, false, stamp); break;
      case "staff.add": applyRegister(model.staff, t.staff, op.k, true, stamp); break;
      case "staff.del": applyRegister(model.staff, t.staff, op.k, false, stamp); break;
      case "week.set": applyRegister(model.weeks, t.weeks, op.k, norm(op.value), stamp); break;
      case "setting.set": applyRegister(model.settings, t.settings, op.k, norm(op.value), stamp); break;
      case "forecast.set":
        if (!model.forecast || stamp > model.forecast[1]) {
          if (!model.forecast || !same(model.forecast[0], op.value)) t.forecast = true;
          model.forecast = [op.value, stamp];
        }
        break;
      default: return false; // unknown op from a newer version: ignored
    }
    t.count += 1;
    return true;
  }

  /* ---------------- model <-> app state ---------------- */
  function buildEntityObj(key, keyName, ent) {
    const o = { [keyName]: key };
    for (const k of Object.keys(ent.f)) { const v = effective(ent, k); if (v !== null && v !== undefined) o[k] = v; }
    return o;
  }
  function presentEntities(map, keyName) {
    const rows = [];
    for (const [key, ent] of map) if (ent.p && ent.p[0]) rows.push([ent.o || "", key, ent]);
    rows.sort((a, b) => (a[0] < b[0] ? -1 : a[0] > b[0] ? 1 : a[1] < b[1] ? -1 : 1));
    return rows.map(r => buildEntityObj(r[1], keyName, r[2]));
  }
  function presentCodes(map, cmp) {
    const out = [];
    for (const [code, r] of map) if (r[0]) out.push(code);
    return out.sort(cmp);
  }

  function materialize(model, opts) {
    const weeks = {};
    for (const [k, r] of model.weeks) if (r[0] !== null && r[0] !== undefined) weeks[k] = r[0];
    const cphReg = model.settings.get("cph");
    return {
      entries: presentEntities(model.entries, "id"),
      campaigns: presentEntities(model.campaigns, "ref"),
      pls: presentCodes(model.pls, opts.comparePl),
      staffList: presentCodes(model.staff, opts.comparePl),
      staffOverrides: weeks,
      cph: cphReg && cphReg[0] !== null ? cphReg[0] : opts.defaults.cph,
      forecast: model.forecast && model.forecast[0] ? model.forecast[0] : opts.defaults.forecast,
    };
  }

  /* Differences between two app states -> list of ops. */
  function diffEntities(prevArr, nextArr, keyName, kind, ops) {
    if (prevArr === nextArr) return;
    const pm = new Map();
    for (const x of prevArr || []) if (x && x[keyName] != null && !pm.has(x[keyName])) pm.set(x[keyName], x);
    const seen = new Set();
    for (const x of nextArr || []) {
      if (!x) continue;
      const id = x[keyName];
      if (id == null || seen.has(id)) continue;
      seen.add(id);
      const p = pm.get(id);
      if (!p) { ops.push({ op: kind + ".add", k: id, f: fieldsOf(x, keyName) }); continue; }
      if (p === x) continue;
      const f = {}; let n = 0;
      for (const k of new Set([...Object.keys(p), ...Object.keys(x)])) {
        if (k === keyName) continue;
        if (!same(p[k], x[k])) { f[k] = norm(x[k]); n++; }
      }
      if (n) ops.push({ op: kind + ".upd", k: id, f });
    }
    for (const id of pm.keys()) if (!seen.has(id)) ops.push({ op: kind + ".del", k: id });
  }
  function diffCodes(prevArr, nextArr, kind, ops) {
    if (prevArr === nextArr) return;
    const p = new Set(prevArr || []), n = new Set(nextArr || []);
    for (const c of n) if (!p.has(c)) ops.push({ op: kind + ".add", k: c });
    for (const c of p) if (!n.has(c)) ops.push({ op: kind + ".del", k: c });
  }
  function diffState(prev, next) {
    const ops = [];
    diffEntities(prev.entries, next.entries, "id", "entry", ops);
    diffEntities(prev.campaigns, next.campaigns, "ref", "campaign", ops);
    diffCodes(prev.pls, next.pls, "pl", ops);
    diffCodes(prev.staffList, next.staffList, "staff", ops);
    if (prev.staffOverrides !== next.staffOverrides) {
      const a = prev.staffOverrides || {}, b = next.staffOverrides || {};
      for (const k of new Set([...Object.keys(a), ...Object.keys(b)])) if (!same(a[k], b[k])) ops.push({ op: "week.set", k, value: norm(b[k]) });
    }
    if (!same(prev.cph, next.cph)) ops.push({ op: "setting.set", k: "cph", value: norm(next.cph) });
    if (prev.forecast !== next.forecast && !same(prev.forecast, next.forecast)) ops.push({ op: "forecast.set", value: norm(next.forecast) });
    return ops;
  }

  /* Remote changes -> a small patch that is applied to the app state (and to the engine's base copy).
     Entities: only the fields that really changed are merged, so unrelated local edits are kept. */
  function buildPatch(model, t, opts) {
    const patch = {};
    const ent = (map, tmap, keyName) => {
      if (!tmap.size) return null;
      const up = new Map(), rm = new Set();
      for (const [key, info] of tmap) {
        const e = map.get(key);
        if (!e || !e.p || !e.p[0]) { rm.add(key); continue; }
        const fields = {};
        for (const k of info.fields) fields[k] = e.f[k] ? effective(e, k) : null;
        up.set(key, { obj: buildEntityObj(key, keyName, e), fields, o: e.o || "" });
      }
      return { up, rm };
    };
    const codes = (map, tset) => {
      if (!tset.size) return null;
      const add = [], del = [];
      for (const c of tset) (map.get(c) && map.get(c)[0] ? add : del).push(c);
      return { add, del };
    };
    const e = ent(model.entries, t.entries, "id"); if (e) patch.entries = e;
    const c = ent(model.campaigns, t.campaigns, "ref"); if (c) patch.campaigns = c;
    const p = codes(model.pls, t.pls); if (p) patch.pls = p;
    const s = codes(model.staff, t.staff); if (s) patch.staffList = s;
    if (t.weeks.size) { patch.staffOverrides = {}; for (const k of t.weeks) patch.staffOverrides[k] = model.weeks.get(k)[0]; }
    if (t.settings.has("cph")) { const r = model.settings.get("cph"); patch.cph = r && r[0] !== null ? r[0] : opts.defaults.cph; }
    if (t.forecast) patch.forecast = model.forecast[0];
    return patch;
  }

  function patchEntityArray(arr, p, keyName) {
    if (!p) return arr;
    const out = [], done = new Set();
    for (const x of arr || []) {
      const id = x && x[keyName];
      if (p.rm.has(id)) continue;
      const u = p.up.get(id);
      if (u && !done.has(id)) {
        const merged = { ...x };
        for (const k of Object.keys(u.fields)) { const v = u.fields[k]; if (v === null || v === undefined) delete merged[k]; else merged[k] = v; }
        out.push(merged); done.add(id); continue;
      }
      if (u) continue; // duplicate id in app state: drop
      out.push(x);
    }
    const fresh = [];
    for (const [id, u] of p.up) if (!done.has(id)) fresh.push(u);
    fresh.sort((a, b) => (a.o < b.o ? -1 : a.o > b.o ? 1 : 0));
    for (const u of fresh) out.push(u.obj);
    return out;
  }
  function patchCodes(arr, p, cmp) {
    if (!p) return arr;
    const s = new Set(arr || []);
    p.add.forEach(c => s.add(c)); p.del.forEach(c => s.delete(c));
    return Array.from(s).sort(cmp);
  }
  /* Pure function: the app calls it as a functional state update for each slice. */
  function applyPatch(state, patch, cmp) {
    cmp = cmp || defaultCompare;
    const next = { ...state };
    if (patch.entries) next.entries = patchEntityArray(state.entries, patch.entries, "id");
    if (patch.campaigns) next.campaigns = patchEntityArray(state.campaigns, patch.campaigns, "ref");
    if (patch.pls) next.pls = patchCodes(state.pls, patch.pls, cmp);
    if (patch.staffList) next.staffList = patchCodes(state.staffList, patch.staffList, cmp);
    if (patch.staffOverrides) {
      const w = { ...(state.staffOverrides || {}) };
      for (const k of Object.keys(patch.staffOverrides)) { const v = patch.staffOverrides[k]; if (v === null || v === undefined) delete w[k]; else w[k] = v; }
      next.staffOverrides = w;
    }
    if ("cph" in patch) next.cph = patch.cph;
    if ("forecast" in patch) next.forecast = patch.forecast;
    return next;
  }

  /* ---------------- model serialization (snapshots) ---------------- */
  function serializeModel(m) {
    return {
      entries: Array.from(m.entries), campaigns: Array.from(m.campaigns),
      pls: Array.from(m.pls), staff: Array.from(m.staff), weeks: Array.from(m.weeks),
      settings: Array.from(m.settings), forecast: m.forecast,
    };
  }
  function deserializeModel(s) {
    const m = new Model();
    m.entries = new Map(s.entries || []); m.campaigns = new Map(s.campaigns || []);
    m.pls = new Map(s.pls || []); m.staff = new Map(s.staff || []); m.weeks = new Map(s.weeks || []);
    m.settings = new Map(s.settings || []); m.forecast = s.forecast || null;
    return m;
  }

  /* ---------------- folder helpers ---------------- */
  async function getDir(root, parts, create) {
    let d = root;
    for (const p of parts) {
      try { d = await d.getDirectoryHandle(p, { create: !!create }); }
      catch (e) { if (!create && e && e.name === "NotFoundError") return null; throw e; }
    }
    return d;
  }
  async function readJSON(dir, name) {
    let fh;
    try { fh = await dir.getFileHandle(name); } catch (e) { if (e && e.name === "NotFoundError") return null; throw e; }
    const text = await (await fh.getFile()).text();
    if (!text.trim()) return null;
    return JSON.parse(text);
  }
  async function writeText(dir, name, text) {
    const fh = await dir.getFileHandle(name, { create: true });
    const w = await fh.createWritable();
    await w.write(text);
    await w.close();
  }
  async function appendText(dir, name, text) {
    const fh = await dir.getFileHandle(name, { create: true });
    const before = (await fh.getFile()).size;
    const w = await fh.createWritable({ keepExistingData: true });
    await w.seek(before);
    await w.write(text);
    await w.close();
    return { before, after: before + enc.encode(text).length };
  }

  /* ---------------- outbox (unsaved changes survive closing the tab) ---------------- */
  function memoryOutbox() {
    let state = { seq: 0, lines: [] };
    return { load: async () => ({ seq: state.seq, lines: state.lines.slice() }), save: async (s) => { state = { seq: s.seq, lines: s.lines.slice() }; } };
  }
  function idbOutbox(dbName, key) {
    const open = () => new Promise((res, rej) => {
      const r = indexedDB.open(dbName, 1);
      r.onupgradeneeded = () => r.result.createObjectStore("kv");
      r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
    });
    const run = async (mode, fn) => { const db = await open(); return new Promise((res, rej) => { const tx = db.transaction("kv", mode); const q = fn(tx.objectStore("kv")); tx.oncomplete = () => res(q && q.result); tx.onerror = () => rej(tx.error); }); };
    return {
      load: async () => { const v = await run("readonly", s => s.get(key)); return v && Array.isArray(v.lines) ? v : { seq: 0, lines: [] }; },
      save: async (s) => { await run("readwrite", st => st.put({ seq: s.seq, lines: s.lines }, key)); },
    };
  }

  /* ---------------- the engine ---------------- */
  class SyncEngine {
    /* options: root (Data folder handle), writerId, writerName, now, outbox, comparePl, defaults,
                onRemote(patch, info), onStatus(status), snapshotEvery, snapshotMinAgeMs, fullScanEvery */
    constructor(o) {
      if (!o || !o.root || !o.writerId) throw new Error("root and writerId are required");
      this.root = o.root;
      this.w = o.writerId;
      this.name = o.writerName || "";
      this.now = o.now || (() => Date.now());
      this.clock = new Clock(this.now);
      this.outbox = o.outbox || memoryOutbox();
      this.opts = { comparePl: o.comparePl || defaultCompare, defaults: Object.assign({ cph: 120, forecast: { rows: [], updatedAt: 0 } }, o.defaults || {}) };
      this.onRemote = o.onRemote || (() => {});
      this.onStatus = o.onStatus || (() => {});
      this.snapshotEvery = o.snapshotEvery != null ? o.snapshotEvery : 3000;
      this.snapshotMinAgeMs = o.snapshotMinAgeMs != null ? o.snapshotMinAgeMs : 24 * 3600 * 1000;
      this.fullScanEvery = o.fullScanEvery || 20;
      this.model = new Model();
      this.base = null;            // last app state known to the engine
      this.offsets = new Map();    // "log/<month>/<file>" -> bytes already read
      this.covered = {};           // writerId -> highest seq seen
      this.seq = 0;
      this.ownApplied = 0;         // own lines up to this seq are already in the model
      this.pending = [];           // [{t, text}] not yet written to the folder
      this.flushing = false; this.polling = false; this.pollCount = 0;
      this.eventsSinceSnapshot = 0; this.lastSnapshotAt = 0;
      this.readOnly = false; this.started = false;
      this.writerNames = {};
      this.fileState = new Map();     // path -> { mtime, badAt, badCount } for re-read decisions
      this.rereadWriters = new Set(); // writers whose files must be read again from the start (gap found)
      this.contig = {};               // writerId -> highest line number seen without gaps
      this.pollStartedAt = 0;
      this.stats = { linesRead: 0, badLines: 0, flushes: 0, flushErrors: 0, pollErrors: 0, snapshotsWritten: 0, gapsHealed: 0, lastPollError: null };
      this.status = { state: "starting", pending: 0, lastRemote: null, lastFlushAt: 0, lastPollAt: 0, error: null };
    }

    setStatus(patch) { Object.assign(this.status, patch, { pending: this.pending.length }); try { this.onStatus({ ...this.status }); } catch (e) {} }

    /* Loads snapshot + logs + unsaved outbox. Returns the full app state. */
    async start() {
      const manifest = await readJSON(this.root, "manifest.json");
      if (!manifest || manifest.format !== FORMAT) { const e = new Error("The shared folder is not initialized"); e.code = "not_initialized"; throw e; }
      if (Number(manifest.version) > VERSION) this.readOnly = true;

      await this.loadLatestSnapshot();
      const ob = await this.outbox.load();
      await this.poll({ full: true, silent: true });
      // A file briefly locked by OneDrive at startup: try again a few times so the first screen is complete
      // (anything still missing afterwards arrives automatically with the next checks).
      for (let i = 0; i < 5 && this.consecutivePollErrors > 0; i++) {
        await new Promise(r => setTimeout(r, 200));
        await this.poll({ full: true, silent: true });
      }
      // unsaved lines from a previous session of this browser
      const t = newTouched();
      for (const text of ob.lines || []) {
        try {
          const ev = JSON.parse(text);
          if ((this.covered[this.w] || 0) >= ev.s) continue; // already written to the folder before the tab closed
          this.applyLine(ev, t, true);
          this.pending.push({ t: ev.t, text });
        } catch (e) { this.stats.badLines++; }
      }
      this.seq = Math.max(this.seq, Number(ob.seq) || 0, this.covered[this.w] || 0);
      this.ownApplied = this.seq;
      this.base = materialize(this.model, this.opts);
      this.started = true;
      this.setStatus({ state: this.readOnly ? "readonly" : "online", error: null });
      this.writeWriterInfo().catch(() => {});
      this.flush();
      return this.base;
    }

    async loadLatestSnapshot() {
      const dir = await getDir(this.root, ["snapshots"], false);
      if (!dir) return;
      const names = [];
      for await (const [name, h] of dir.entries()) if (h.kind === "file" && SNAP_RE.test(name)) names.push(name);
      names.sort().reverse();
      for (const name of names) {
        try {
          const s = await readJSON(dir, name);
          if (!s || s.format !== FORMAT || !s.model) continue;
          if (Number(s.version) > VERSION) { this.readOnly = true; continue; }
          this.model = deserializeModel(s.model);
          this.offsets = new Map(Object.entries(s.files || {}));
          this.covered = Object.assign({}, s.covered || {});
          this.contig = Object.assign({}, s.covered || {});
          if (isTs(s.maxTs)) this.clock.observe(s.maxTs);
          this.lastSnapshotAt = Number(s.createdAt) || 0;
          this.snapshotName = name;
          return;
        } catch (e) { /* half-synced or broken snapshot: try the previous one */ }
      }
    }

    /* notOnDisk: the line comes from this browser's unsaved outbox, so it must not be counted as saved. */
    applyLine(ev, t, notOnDisk) {
      if (!ev || ev.v !== 1 || typeof ev.w !== "string" || !isTs(ev.t) || !Array.isArray(ev.ops)) { this.stats.badLines++; return false; }
      if (ev.w === this.w && ev.s <= this.ownApplied) return false; // already applied locally
      if (ev.w !== this.w && typeof ev.s === "number") {
        const c = this.contig[ev.w] || 0;
        this.gapRetries = this.gapRetries || {};
        if (ev.s === c + 1) { this.contig[ev.w] = ev.s; this.gapRetries[ev.w] = 0; }
        else if (ev.s > c + 1 && !this.rereadWriters.has(ev.w)) {
          // A line was missed: read this writer's files again. If it never shows up (about a minute), accept the gap.
          this.gapRetries[ev.w] = (this.gapRetries[ev.w] || 0) + 1;
          if (this.gapRetries[ev.w] > 20) { this.contig[ev.w] = ev.s; this.gapRetries[ev.w] = 0; }
          else { this.rereadWriters.add(ev.w); this.stats.gapsHealed++; }
        }
      }
      this.clock.observe(ev.t);
      const stamp = ev.t + "@" + ev.w;
      for (const op of ev.ops) applyOp(this.model, op, stamp, t);
      if (!notOnDisk && (!this.covered[ev.w] || ev.s > this.covered[ev.w])) this.covered[ev.w] = ev.s;
      if (ev.w === this.w && ev.s > this.seq) this.seq = ev.s;
      this.eventsSinceSnapshot += ev.ops.length;
      if (ev.w !== this.w) {
        this.status.lastRemote = { w: ev.w, name: this.writerNames[ev.w] || "", t: parseTs(ev.t).p };
        if (!this.writerNames[ev.w]) this.needNames = true;
      }
      return true;
    }

    /* App calls this after every state change. Returns the number of recorded ops. */
    async commit(next) {
      if (!this.started) throw new Error("engine not started");
      const ops = diffState(this.base, next);
      this.base = next;
      if (!ops.length) return 0;
      if (this.readOnly) { this.setStatus({ state: "readonly" }); return 0; }
      const ts = this.clock.tick();
      this.seq += 1;
      const ev = { v: 1, w: this.w, s: this.seq, t: ts, ops };
      const stamp = ts + "@" + this.w;
      const t = newTouched();
      for (const op of ops) applyOp(this.model, op, stamp, t);
      this.ownApplied = this.seq;
      // covered[own writer] is advanced only after the line is really in the folder (see flush),
      // otherwise a snapshot could claim unsaved lines as saved and they would never be written.
      this.eventsSinceSnapshot += ops.length;
      this.pending.push({ t: ts, text: JSON.stringify(ev) });
      await this.saveOutbox();
      this.setStatus({});
      return ops.length;
    }

    async saveOutbox() { try { await this.outbox.save({ seq: this.seq, lines: this.pending.map(p => p.text) }); } catch (e) {} }

    /* Appends unsaved lines to this writer's own log file(s). */
    async flush() {
      if (this.flushing || !this.pending.length || this.readOnly) return false;
      this.flushing = true;
      const batch = this.pending.slice();
      try {
        const byMonth = new Map();
        for (const p of batch) { const m = monthOfTs(p.t); if (!byMonth.has(m)) byMonth.set(m, []); byMonth.get(m).push(p.text); }
        for (const [month, lines] of byMonth) {
          const dir = await getDir(this.root, ["log", month], true);
          const path = "log/" + month + "/" + this.w + ".jsonl";
          const r = await appendText(dir, this.w + ".jsonl", lines.join("\n") + "\n");
          if ((this.offsets.get(path) || 0) === r.before) this.offsets.set(path, r.after); // no need to read own lines back
        }
        this.pending.splice(0, batch.length);
        for (const p of batch) { const s = JSON.parse(p.text).s; if (!this.covered[this.w] || s > this.covered[this.w]) this.covered[this.w] = s; }

        this.setStatus({ state: (this.consecutivePollErrors || 0) >= 10 ? "error" : "online", lastFlushAt: this.now(), flushError: false, error: (this.consecutivePollErrors || 0) >= 10 ? this.status.error : null });

      } catch (e) {
        this.stats.flushErrors++;
        this.setStatus({ state: "error", flushError: true, error: (e && (e.name + ": " + e.message)) || String(e) });
        return false;
      } finally { this.flushing = false; }

    /* Reads new lines from all writers. Calls onRemote(patch) when something changed.
       Robust against what OneDrive does on a real disk: a file that is briefly locked or replaced while
       it downloads only skips THAT file until the next check (never the whole check), a line that is not
       readable yet is retried instead of skipped, and every change already merged is always delivered
       to the screen, even if a later file in the same check fails. */

      o = o || {};
      if (this.polling && this.now() - this.pollStartedAt < 30000) return 0; // a stuck check is not allowed to block forever
      this.polling = true;
      this.pollStartedAt = this.now();

      let applied = 0, fileErrors = 0, lastError = null;
      try {
        this.pollCount += 1;
        const full = o.full || this.pollCount % this.fullScanEvery === 0 || this.rereadWriters.size > 0;
        const reread = new Set(this.rereadWriters);
        this.rereadWriters.clear();
        const logDir = await getDir(this.root, ["log"], false);
        if (logDir) {
          const months = [];
          for await (const [name, h] of logDir.entries()) if (h.kind === "directory" && MONTH_RE.test(name)) months.push([name, h]);
          months.sort((a, b) => (a[0] < b[0] ? -1 : 1));
          for (const [month, dir] of (full ? months : months.slice(-2))) {
            let names;
            try { names = []; for await (const [name, fh] of dir.entries()) if (fh.kind === "file" && LOG_FILE_RE.test(name)) names.push([name, fh]); } // ignores .crswap, desktop.ini, conflict copies
            catch (e) { fileErrors++; lastError = e; continue; }
            for (const [name, fh] of names) {
              try { applied += await this.readLogFile("log/" + month + "/" + name, fh, name.slice(0, -6), reread, t); }
              catch (e) { fileErrors++; lastError = e; } // e.g. locked by OneDrive while downloading: retried next check
            }
          }
        }
        if (full || this.needNames) {
          try {
            this.needNames = false;
            await this.readWriterNames();
            if (this.status.lastRemote && !this.writerNames[this.status.lastRemote.w]) this.needNames = true; // name file not readable yet: try again next check
            const lr = this.status.lastRemote;
            if (lr && !lr.name && this.writerNames[lr.w]) lr.name = this.writerNames[lr.w];
          } catch (e) {}
        }
      } catch (e) {
        fileErrors++; lastError = e;
      } finally {
        this.polling = false;
      }
      // Deliver everything merged in this check, even if some file failed.
      if (t.count && this.base && !o.silent) {
        const patch = buildPatch(this.model, t, this.opts);
        this.base = applyPatch(this.base, patch, this.opts.comparePl);
        try { this.onRemote(patch, { lines: applied, lastRemote: this.status.lastRemote }); } catch (e) {}
      }
      if (fileErrors) { this.stats.pollErrors++; this.consecutivePollErrors = (this.consecutivePollErrors || 0) + 1; this.stats.lastPollError = (lastError && (lastError.name + ": " + lastError.message)) || String(lastError); }
      else this.consecutivePollErrors = 0;
      // Brief read errors are normal with OneDrive; only report a problem when it persists (about 30 s).
      const persistent = this.consecutivePollErrors >= 10;
      const flushError = this.status.state === "error" && this.pending.length && this.status.flushError;
      this.setStatus({
        state: this.readOnly ? "readonly" : (persistent || flushError ? "error" : "online"),
        lastPollAt: this.now(),
        error: persistent ? this.stats.lastPollError : flushError ? this.status.error : null,
      });
      return applied;
    }

    /* Reads the not-yet-read part of one log file. Returns the number of applied lines. */
    async readLogFile(path, fh, writer, reread, t) {
      const file = await fh.getFile();
      const st = this.fileState.get(path) || { mtime: 0, badAt: -1, badCount: 0 };
      let off = this.offsets.get(path) || 0;
      const mtimeChanged = st.mtime !== 0 && file.lastModified !== st.mtime;
      // Re-read from the start (harmless, every line is idempotent) when the file was rewritten in place,
      // got shorter, or a gap in this writer's line numbers shows that a line was missed.
      if (reread.has(writer) || file.size < off || (file.size === off && mtimeChanged)) off = 0;
      else if (file.size === off) { st.mtime = file.lastModified; this.fileState.set(path, st); return 0; }
      const text = await file.slice(off).text();
      const parts = text.split("\n");
      parts.pop(); // "" or an incomplete last line that is read again next time
      let consumed = 0, applied = 0;
      for (const line of parts) {
        const bytes = enc.encode(line + "\n").length;
        if (line.trim()) {
          let ev = null;
          if (line.indexOf("\u0000") < 0) { try { ev = JSON.parse(line); } catch (e) { ev = null; } }
          if (!ev) {
            // Not readable yet (e.g. OneDrive is still filling the file): stop here and try again next check.
            // Only a line that stays broken for many checks is treated as damaged and skipped.
            const at = off + consumed;
            if (st.badAt === at) st.badCount++; else { st.badAt = at; st.badCount = 1; }
            if (st.badCount < 20) break;
            this.stats.badLines++; st.badAt = -1; st.badCount = 0;
            consumed += bytes;
            continue;
          }
          this.stats.linesRead++;
          if (this.applyLine(ev, t)) applied++;
        }
        consumed += bytes;
      }
      this.offsets.set(path, off + consumed);
      st.mtime = file.lastModified;
      this.fileState.set(path, st);
      return applied;
    }

    async readWriterNames() {
      const dir = await getDir(this.root, ["writers"], false);
      if (!dir) return;
      for await (const [name, h] of dir.entries()) {
        if (h.kind !== "file" || !/^W-[A-Za-z0-9_-]+\.json$/.test(name)) continue;
        try { const info = await readJSON(dir, name); if (info && info.name) this.writerNames[name.slice(0, -5)] = String(info.name); } catch (e) {}
      }
    }
    async writeWriterInfo() {
      if (this.readOnly) return;
      const dir = await getDir(this.root, ["writers"], true);
      const cur = await readJSON(dir, this.w + ".json").catch(() => null);
      if (cur && cur.name === this.name) return;
      await writeText(dir, this.w + ".json", JSON.stringify({ w: this.w, name: this.name, updatedAt: this.now() }));
    }

    /* Writes a snapshot when enough has changed (or when forced). Any browser may do it: the
       file is its own, and snapshots never need to agree with each other. */
    async maybeSnapshot(force) {
      if (this.readOnly) return false;
      if (!force && (this.eventsSinceSnapshot < this.snapshotEvery || this.now() - this.lastSnapshotAt < this.snapshotMinAgeMs)) return false;
      const ts = this.clock.tick();
      const name = "snap-" + ts + "-" + this.w + ".json";
      const snap = { format: FORMAT, version: VERSION, kind: "snapshot", createdAt: this.now(), by: this.w, maxTs: this.clock.current(), files: Object.fromEntries(this.offsets), covered: { ...this.covered }, model: serializeModel(this.model) };
      const dir = await getDir(this.root, ["snapshots"], true);
      await writeText(dir, name, JSON.stringify(snap));
      this.eventsSinceSnapshot = 0;
      this.lastSnapshotAt = this.now();
      this.stats.snapshotsWritten++;
      return name;
    }

    /* Full merged state straight from the model (used for checks and tests). */
    materialize() { return materialize(this.model, this.opts); }

    /* Timers for the real app: poll every pollMs, flush shortly after changes. */
    startTimers(pollMs, flushMs) {
      this.stopTimers();
      this._pollTimer = setInterval(() => { this.poll().then(() => this.maybeSnapshotWithJitter()); }, pollMs || 3000);
      this._flushTimer = setInterval(() => { if (this.pending.length) this.flush(); }, flushMs || 500);
    }
    stopTimers() { clearInterval(this._pollTimer); clearInterval(this._flushTimer); }
    maybeSnapshotWithJitter() {
      if (this._snapPlanned || this.eventsSinceSnapshot < this.snapshotEvery || this.now() - this.lastSnapshotAt < this.snapshotMinAgeMs) return;
      this._snapPlanned = true;
      setTimeout(() => { this._snapPlanned = false; this.maybeSnapshot(false).catch(() => {}); }, Math.random() * 60000);
    }

    /* One-time setup: writes the genesis snapshot and manifest from the current complete data. */
    static async initialize(root, appState, o) {
      o = o || {};
      const now = o.now || (() => Date.now());
      const w = o.writerId;
      if (!w) throw new Error("writerId is required");
      if (await readJSON(root, "manifest.json")) { const e = new Error("The shared folder is already initialized"); e.code = "already_initialized"; throw e; }
      const existingLog = await getDir(root, ["log"], false);
      if (existingLog) { for await (const entry of existingLog.entries()) { void entry; const e = new Error("The shared folder already contains change logs"); e.code = "already_initialized"; throw e; } }
      const model = new Model();
      const t = newTouched();
      const p = Math.floor(now());
      let l = 0;
      const stamp = () => makeTs(p, l++) + "@" + w;
      for (const op of diffState({ entries: [], campaigns: [], pls: [], staffList: [], staffOverrides: {}, cph: null, forecast: null }, appState)) applyOp(model, op, stamp(), t);
      const maxTs = makeTs(p, l);
      const snapName = "snap-" + makeTs(p, 0) + "-" + w + "-genesis.json";
      const snapDir = await getDir(root, ["snapshots"], true);
      await getDir(root, ["log"], true);
      await getDir(root, ["writers"], true);
      await writeText(snapDir, snapName, JSON.stringify({ format: FORMAT, version: VERSION, kind: "genesis", createdAt: p, by: w, maxTs, files: {}, covered: {}, model: serializeModel(model) }));
      await writeText(root, "manifest.json", JSON.stringify({ format: FORMAT, version: VERSION, createdAt: p, createdBy: w, genesis: "snapshots/" + snapName }, null, 2));
      return { snapshot: snapName, ops: t.count };
    }
  }

  /* Order- and null-independent form of an app state, for "is the data identical?" checks. */
  function canonical(s) {
    const clean = (o) => { const r = {}; Object.keys(o).sort().forEach(k => { if (o[k] !== null && o[k] !== undefined) r[k] = o[k]; }); return r; };
    const ents = (arr, key) => (arr || []).map(clean).sort((a, b) => (String(a[key]) < String(b[key]) ? -1 : String(a[key]) > String(b[key]) ? 1 : 0));
    const weeks = {}; Object.keys(s.staffOverrides || {}).sort().forEach(k => { if (s.staffOverrides[k] != null) weeks[k] = s.staffOverrides[k]; });
    return JSON.stringify({ entries: ents(s.entries, "id"), campaigns: ents(s.campaigns, "ref"), pls: Array.from(new Set(s.pls || [])).sort(), staffList: Array.from(new Set(s.staffList || [])).sort(), staffOverrides: weeks, cph: s.cph, forecast: s.forecast });
  }

/* ============================== FUNKCJE POMOCNICZE ============================== */
function round2(n) { return Number(n.toFixed(2)); }
function num(v) { const n = Number(v); return isNaN(n) ? 0 : n; }
function qtyOf(e) { return num(e.app) + num(e.phys); }
/* Zakładka Staff: "CPH wyliczone" (i wszystko co z niego wynika — podgląd w formularzach, zapis
   cphOverride przy wpisywaniu godzin, zbiorcza Produktywność w stopce) liczone jest wyłącznie
   z kolumny "prizes" (nie z tck_via_app/tck_via_physical), na wyraźną prośbę użytkownika. */
function qtyOfStaff(e) { return num(e.prizes); }
function hasHoursOverride(e) { return e && e.hoursOverride !== undefined && e.hoursOverride !== null && e.hoursOverride !== "" && !isNaN(Number(e.hoursOverride)); }
/* Godziny admin: dodatkowe, ręcznie wpisywane godziny (np. praca administracyjna przy kampanii "Trening"),
   które ZAWSZE sumują się z godzinami wiersza, niezależnie od kampanii/typu wpisu (Freelancerzy/Freelancer
   Sales List/Staff) — patrz pole adminHours na wpisie. Domyślnie 0/brak, więc stare wpisy (bez tego pola)
   liczą się tak jak dotychczas, bez zmian. Dodawane WYŁĄCZNIE raz — patrz combinedFreelancerHoursOf poniżej,
   które celowo sumuje wersje "bazowe" (bez adminHoursOf) obu zakładek, żeby nie zdublować tej wartości. */
function adminHoursOf(e) { return round2(num(e && e.adminHours)); }
function hoursOf(e) {
  const base = hasHoursOverride(e) ? round2(Number(e.hoursOverride)) : round2(qtyOf(e) / cphForEntry(e));
  return round2(base + adminHoursOf(e));
}
/* Zakładka Staff: godziny wpisywane wyłącznie ręcznie (nie liczone automatycznie z CPH kampanii jak dla
   freelancerów). Dla wiersza, w którym nie wpisano jeszcze godzin, wyświetlamy 0 — a nie domyślny szacunek
   z ilości/CPH kampanii — żeby nie sugerować nieprawdziwej wartości, dopóki nie zostaną wpisane realne godziny.
   staffHoursBaseOf (bez godzin admin) jest używane do wiązania pola edycji (HoursCell) — żeby edycja tego pola
   nigdy nie "zapiekła" już dodanych godzin admin do hoursOverride. staffHoursOf (z godzinami admin) jest
   używane wszędzie indziej (podsumowania, Produktywność do druku, eksport). */
function staffHoursBaseOf(e) { return hasHoursOverride(e) ? round2(Number(e.hoursOverride)) : 0; }
function staffHoursOf(e) { return round2(staffHoursBaseOf(e) + adminHoursOf(e)); }
/* CPH wyliczone (= prizes / godziny) i Produktywność (= CPH wyliczone / CPH kampanii * 100) mają się pojawić
   dopiero, gdy wpisane zostaną godziny — do tego czasu pokazujemy "—". Liczone ZAWSZE na żywo z aktualnych
   prizes/godzin (a nie z zapisanego wcześniej cphOverride), żeby nigdy nie "zastygło" na starej wartości —
   np. gdy zmieni się ilość w kolumnie prizes dla wiersza, który miał już wpisane godziny. Pole cphOverride
   nie jest tu w ogóle używane, żeby nie kolidować z jego inną rolą w zakładkach Master/Freelancer (tam
   cphOverride wpływa na przeliczanie Godzin z ilości — to są te same wpisy, współdzielone między zakładkami). */
/* UWAGA: liczone z staffHoursBaseOf (BEZ godzin admin) — godziny admin to praca administracyjna, nie
   produktywna, więc nie powinny "rozwadniać" wyliczonego CPH / % realizacji. */
function staffAchievedCphOf(e) {
  const hours = staffHoursBaseOf(e);
  if (!(hours > 0)) return null;
  return round2(qtyOfStaff(e) / hours);
}
function staffAchievementPctOf(e, campaignCph) {
  const achieved = staffAchievedCphOf(e);
  return (achieved != null && campaignCph > 0) ? round2((achieved / campaignCph) * 100) : null;
}
/* Zakładka Freelancerzy: standardowo ilość/godziny liczone z "tck_via_app" (nie z prizes). WYJĄTEK: jeśli
   dla wiersza tck_via_physical wynosi maksymalnie 100 (czyli sprzedaż fizyczna jest niska/brak — typowo
   dane wpisane głównie w prizes), wtedy ilość/godziny liczone z "prizes" zamiast z tck_via_app. Godziny =
   ilość / CPH (kampanii albo ręcznie wpisany cphOverride) — chyba że wpisano ręczne godziny (hoursOverride),
   które mają zawsze pierwszeństwo, tak jak w reszcie widoków. CPH liczony przez cphForEntryAsOfDate: dla
   wpisów od sierpnia 2026 reaguje na edycje w zakładce Kampanie, dla wcześniejszych miesięcy zostaje
   zamrożony na pierwotnej wartości (patrz komentarz przy campaignCphAsOfDate wyżej w pliku). */
const FREELANCER_PHYS_THRESHOLD_FOR_PRIZES = 100;
function freelancerQtyOf(e) { return num(e && e.phys) <= FREELANCER_PHYS_THRESHOLD_FOR_PRIZES ? num(e && e.prizes) : num(e && e.app); }
/* freelancerHoursBaseOf = wersja BEZ godzin admin — używana przez combinedFreelancerHoursOf poniżej, żeby
   przy sumowaniu z zakładką Sales List godziny admin nie zdublowały się (dodawane tam tylko raz). */
function freelancerHoursBaseOf(e) {
  if (hasHoursOverride(e)) return round2(Number(e.hoursOverride));
  return round2(freelancerQtyOf(e) / cphForEntryAsOfDate(e));

async function downloadBlob(filename, content, type) {
  try {
    if (window.claude && typeof window.claude.use === "function") {
      const dl = await window.claude.use("downloads");
      if (dl) { await dl.save({ filename, data: new Blob([content], { type }) }); return; }
    }
  } catch (e) { return; } // widz odmówił zapisu albo zapis niedostępny
  const blob = new Blob([content], { type });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

  const csv = rows.map(r => r.map(csvCell).join(";")).join("\r\n");
  downloadBlob("Master_PS_" + todayIso() + ".csv", "﻿" + csv, "text/csv;charset=utf-8;");
}

/* Import pliku "Lista OcrTransaction" (xlsx/csv) - jeden wiersz = jedna transakcja/promocja */
function parseOcrFile(file, t, onDone, onError) {
  const reader = new FileReader();
  reader.onload = (evt) => {
    try {
      const data = new Uint8Array(evt.target.result);
      const wb = XLSX.read(data, { type: "array" });
      const sheet = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: null });
      let headerIdx = -1;
      for (let i = 0; i < rows.length; i++) {
        if (Array.isArray(rows[i]) && rows[i].some(c => String(c || "").trim().toLowerCase() === "iduser")) {
          headerIdx = i; break;
        }
      }
      if (headerIdx === -1) throw new Error(t("errNoIdUser"));
      const headers = rows[headerIdx].map(h => String(h || "").trim().toLowerCase());
      const col = (name) => headers.indexOf(name.toLowerCase());
      const idxUser = col("idUser"), idxYear = col("year"), idxMonth = col("month"), idxDay = col("day");
      const idxApp = col("tck_via_app"), idxPhys = col("tck_via_physical"), idxPrizes = col("prizes");
      const idxPromoRef = col("promotion_reference"), idxPromoName = col("promotion_name");
      if ([idxUser, idxYear, idxMonth, idxDay, idxApp, idxPhys, idxPrizes].some(i => i === -1)) {
        throw new Error(t("errMissingColumns"));
      }
      const cleanInt = (v) => { const n = parseInt(String(v == null ? "" : v).replace(/[^\d-]/g, ""), 10); return isNaN(n) ? 0 : n; };
      const out = [];
      for (let i = headerIdx + 1; i < rows.length; i++) {
        const row = rows[i];
        if (!row || row[idxUser] == null || String(row[idxUser]).trim() === "") continue;
        const y = cleanInt(row[idxYear]), m = cleanInt(row[idxMonth]), d = cleanInt(row[idxDay]);
        if (!y || !m || !d) continue;
        const iso = `${y}-${String(m).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
        out.push({
          id: uid(),
          date: iso,
          pl: String(row[idxUser]).trim(),
          app: num(row[idxApp]),
          phys: num(row[idxPhys]),
          prizes: num(row[idxPrizes]),
          campaignRef: idxPromoRef !== -1 && row[idxPromoRef] != null ? String(row[idxPromoRef]).trim() : "",
          campaignName: idxPromoName !== -1 && row[idxPromoName] != null ? String(row[idxPromoName]).trim() : "",
        });
      }
      if (out.length === 0) throw new Error(t("errNoValidRows"));
      onDone(out);
    } catch (err) { onError(err); }
  };
  reader.onerror = () => onError(new Error(t("errReadFile")));
  reader.readAsArrayBuffer(file);
}

/* Import kopii zapasowej JSON (pełne dane) */
function parseBackupJson(file, t, onDone, onError) {
  const reader = new FileReader();
  reader.onload = (evt) => {
    try {
      const parsed = JSON.parse(evt.target.result);
      if (!Array.isArray(parsed.entries)) throw new Error(t("errInvalidBackup"));
      onDone(parsed);
    } catch (err) { onError(err); }
  };
  reader.onerror = () => onError(new Error(t("errReadFile")));
  reader.readAsText(file);
}

function Header({ entries, cph, onCphChange }) {
  const { t } = useLang();
  const totalHours = useMemo(() => round2(entries.reduce((s, e) => s + hoursOf(e), 0)), [entries]);
  const totalQty = useMemo(() => entries.reduce((s, e) => s + qtyOf(e), 0), [entries]);
  const distinctPl = useMemo(() => new Set(entries.map(e => e.pl)).size, [entries]);
  const [cphInput, setCphInput] = useState(String(cph));
  useEffect(() => { setCphInput(String(cph)); }, [cph]);
  const commitCph = () => {
    const n = parseFloat(cphInput);
    if (!isNaN(n) && n > 0) onCphChange(n);
    else setCphInput(String(cph));
  };

  const Stat = ({ label, value }) => (
    <div className="bg-white/10 rounded-lg px-4 py-2 min-w-[130px]">
      <div className="text-[11px] uppercase tracking-wide text-white/80">{label}</div>
      <div className="text-xl font-semibold text-white">{value}</div>

  return (
    <div className="bg-gradient-to-r from-[#009999] to-[#00CCCC] text-white">
      <div className="max-w-7xl mx-auto px-4 py-6">
        <div className="flex items-start justify-between gap-4">
          <div>
            <h1 className="text-2xl font-bold">Master PS+ System</h1>
            <p className="text-white/80 text-sm mt-1">{t("subtitle", { cph })}</p>
          </div>
          <div className="flex items-center gap-3">
            <div className="bg-white/10 rounded-lg px-3 py-2 flex items-center gap-2" title={t("cphHint")}>
              <label className="text-[11px] uppercase tracking-wide text-white/80" htmlFor="cph-input">{t("cphLabel")}</label>
              <input
                id="cph-input"
                type="number"
                min="1"
                step="1"
                value={cphInput}
                onChange={(e) => setCphInput(e.target.value)}
                onBlur={commitCph}
                onKeyDown={(e) => { if (e.key === "Enter") e.currentTarget.blur(); }}

function EditableRow({ entry, pls, onSave, onCancel, qtyFn, fallbackCphFn, disableHoursOverride, physOnlyLayout, showTrainingOption, showAdminOption, showAdminHours, onAdminHoursCommit }) {
  const { t } = useLang();
  // qtyFn/fallbackCphFn dają widokom (Freelancerzy = prizes, Freelancer Sales List = tck_via_physical + CPH=140)
  // możliwość podglądu innej wartości "ilości" i domyślnego CPH w podpowiedziach pól — bez zmiany zachowania
  // domyślnego (Master = tck_via_app + tck_via_physical, CPH kampanii), gdy te propsy nie są podane.
  // disableHoursOverride: zakładka Freelancer Sales List NIE pozwala tu wpisywać ręcznych godzin — pole
  // hoursOverride jest wspólne z zakładką Freelancerzy, a ręczne godziny mają dotyczyć wyłącznie tamtej
  // zakładki (patrz komentarz przy salesListHoursOf). Tu pokazujemy tylko wyliczoną wartość, bez edycji.
  // physOnlyLayout: zakładka Freelancer Sales List pokazuje w tabeli tylko tck_via_physical + jeden CPH (bez
  // tck_via_app i prizes) — tu odzwierciedlamy to samo w wierszu edycji, żeby liczba kolumn zgadzała się
  // z nagłówkiem tabeli tej zakładki (7 kolumn, nie 10 jak w Master/Freelancerzy).
  // showAdminHours/onAdminHoursCommit: dodaje kolumnę "Godziny admin" (patrz AdminHoursCell) — używane w
  // zakładkach Freelancerzy/Freelancer Sales List, NIE w Master (patrz wywołania EditableRow w tych
  // zakładkach). Komórka wiąże się z "entry" (nie "draft") i zapisuje się NATYCHMIAST, niezależnie od
  // przycisku "Zapisz" tego wiersza — tak jak CphCell w widoku bez edycji.
  const getQty = qtyFn || qtyOf;
  const getFallbackCph = fallbackCphFn || ((d) => cphForCampaign(d.campaignName, d.campaignRef));
  const effectiveCph = (d) => (hasCphOverride(d) ? Number(d.cphOverride) : getFallbackCph(d));
  const [draft, setDraft] = useState({ ...entry });
  // Wpis "Trening" nie ma żadnej ilości fizycznej, więc w zakładce Freelancer Sales List (disableHoursOverride)
  // wzór ilość/CPH zawsze daje 0 godzin — dlatego mimo disableHoursOverride pozwalamy tu wpisać godziny ręcznie
  // dla wpisów Trening (patrz komentarz przy salesListHoursOf/combinedFreelancerHoursOf).
  const isTrainingRow = isTrainingEntry(draft);
  const isAdminRow = isAdminEntry(draft);
  const set = (k) => (e) => setDraft(d => ({ ...d, [k]: e.target.value }));
  const [campaignChoice, setCampaignChoice] = useState(() => {
    if (entry.campaignRef && CAMPAIGNS.some(o => o.ref === entry.campaignRef)) return entry.campaignRef;
    if (!entry.campaignRef && entry.campaignName === TRAINING_CAMPAIGN_NAME) return "__training__";
    if (!entry.campaignRef && entry.campaignName === ADMIN_CAMPAIGN_NAME) return "__admin__";
    if (entry.campaignName) return "__custom__";
    return "";
  });
  const handleCampaignChoice = (e) => {
    const v = e.target.value;
    setCampaignChoice(v);
    if (v === "__custom__") {
      setDraft(d => ({ ...d, campaignRef: "" }));
    } else if (v === "__training__") {
      setDraft(d => ({ ...d, campaignName: TRAINING_CAMPAIGN_NAME, campaignRef: "" }));
    } else if (v === "__admin__") {
      setDraft(d => ({ ...d, campaignName: ADMIN_CAMPAIGN_NAME, campaignRef: "" }));
    } else if (v === "") {
      setDraft(d => ({ ...d, campaignName: "", campaignRef: "" }));
    } else {
      const opt = CAMPAIGNS.find(o => o.ref === v);
      setDraft(d => ({ ...d, campaignName: opt ? opt.name : "", campaignRef: opt ? opt.ref : "" }));
    }
  };
  return (
    <tr className="bg-amber-50">
      <td className="px-3 py-2"><input type="date" value={draft.date} onChange={set("date")} className="border border-slate-300 rounded px-1 py-0.5 text-xs w-32" /></td>
      <td className="px-3 py-2">
        <select value={draft.pl} onChange={set("pl")} className="border border-slate-300 rounded px-1 py-0.5 text-xs">
          {pls.map(p => <option key={p} value={p}>{p}</option>)}
        </select>
      </td>
      {!physOnlyLayout && (
        <td className="px-3 py-2"><input type="number" value={draft.app} onChange={set("app")} className="border border-slate-300 rounded px-1 py-0.5 text-xs w-20" /></td>
      )}
      {!physOnlyLayout && (
        <td className="px-3 py-2 text-center">
          <input type="number" min="1" step="1" value={draft.cphOverride ?? ""} onChange={set("cphOverride")} placeholder={String(getFallbackCph(draft))} title={t("cphCellHint")} className={`border rounded px-1 py-0.5 text-xs w-16 text-center ${draft.cphOverride ? "border-[#00CCCC] bg-[#E6FAFA] text-[#007373] font-semibold" : "border-slate-300"}`} />
        </td>
      )}
      <td className="px-3 py-2"><input type="number" value={draft.phys} onChange={set("phys")} className="border border-slate-300 rounded px-1 py-0.5 text-xs w-20" /></td>
      {!physOnlyLayout && (
        <td className="px-3 py-2"><input type="number" value={draft.prizes} onChange={set("prizes")} className="border border-slate-300 rounded px-1 py-0.5 text-xs w-20" /></td>
      )}
      <td className="px-3 py-2 text-center">
        <input type="number" min="1" step="1" value={draft.cphOverride ?? ""} onChange={set("cphOverride")} placeholder={String(getFallbackCph(draft))} title={t("cphCellHint")} className={`border rounded px-1 py-0.5 text-xs w-16 text-center ${draft.cphOverride ? "border-[#00CCCC] bg-[#E6FAFA] text-[#007373] font-semibold" : "border-slate-300"}`} />
      </td>
      <td className="px-3 py-2">
        <select value={campaignChoice} onChange={handleCampaignChoice} className="border border-slate-300 rounded px-1 py-0.5 text-xs w-32">
          <option value="">{t("noCampaign")}</option>
          {CAMPAIGNS.map(o => <option key={o.ref} value={o.ref}>{o.name} — {o.ref}</option>)}
          {showTrainingOption && <option value="__training__">{t("trainingOption")}</option>}
          {showAdminOption && <option value="__admin__">{t("adminOption")}</option>}
          <option value="__custom__">{t("otherCampaign")}</option>
        </select>
        {campaignChoice === "__custom__" && (
          <input type="text" value={draft.campaignName || ""} onChange={set("campaignName")} placeholder={t("customCampaignName")} className="border border-slate-300 rounded px-1 py-0.5 text-xs w-32 mt-1" />
        )}
      </td>
      <td className="px-3 py-2 text-center">
        {disableHoursOverride && !isTrainingRow && !isAdminRow ? (
          <span className="text-xs text-slate-500" title={t("salesListHoursNotEditableHint")}>{fmt(round2(getQty(draft) / effectiveCph(draft)))}</span>
        ) : (
          <input type="number" step="0.01" value={draft.hoursOverride ?? ""} onChange={set("hoursOverride")} placeholder={(isTrainingRow || isAdminRow) ? "0.00" : fmt(round2(getQty(draft) / effectiveCph(draft)))} title={isAdminRow ? t("adminHoursHint") : isTrainingRow ? t("trainingHoursHint") : undefined} className="border border-slate-300 rounded px-1 py-0.5 text-xs w-16 text-center" />
        )}
      </td>
      {showAdminHours && (
        <td className="px-3 py-2"><AdminHoursCell entry={entry} onCommit={onAdminHoursCommit} /></td>
      )}
      <td className="px-3 py-2 text-right whitespace-nowrap">
        <button onClick={() => onSave({ ...draft, app: num(draft.app), phys: num(draft.phys), prizes: num(draft.prizes), hoursOverride: draft.hoursOverride === "" || draft.hoursOverride === null || draft.hoursOverride === undefined ? null : num(draft.hoursOverride), cphOverride: draft.cphOverride === "" || draft.cphOverride === null || draft.cphOverride === undefined ? null : num(draft.cphOverride) })} className="text-emerald-600 hover:text-emerald-800 text-xs font-medium mr-2">{t("save")}</button>
        <button onClick={onCancel} className="text-slate-500 hover:text-slate-700 text-xs">{t("cancel")}</button>
      </td>
    </tr>
  );
}

function CphCell({ entry, onCommit, fallbackCph }) {
  const { t } = useLang();
  // fallbackCph pozwala widokom z własnym stałym CPH (np. Freelancer Sales List = 140) pokazywać go jako
  // wartość domyślną, gdy wiersz nie ma jeszcze własnego, ręcznie wpisanego CPH (cphOverride).
  const effective = hasCphOverride(entry) ? Number(entry.cphOverride) : (fallbackCph != null ? fallbackCph : cphForCampaign(entry.campaignName, entry.campaignRef));
  const [val, setVal] = useState(String(effective));
  useEffect(() => { setVal(String(effective)); }, [effective]);
  const commit = () => {
    const trimmed = val.trim();
    if (trimmed === "") { onCommit(null); return; }
    const n = parseFloat(trimmed);
    if (!isNaN(n) && n > 0) onCommit(n);
    else setVal(String(effective));
  };
  const overridden = hasCphOverride(entry);
  return (
    <input
      type="number"
      min="1"
      step="1"
      value={val}
      onChange={(e) => setVal(e.target.value)}
      onBlur={commit}
      onKeyDown={(e) => { if (e.key === "Enter") e.currentTarget.blur(); }}
      title={t("cphCellHint")}
      className={`w-16 rounded px-1 py-0.5 text-xs text-center border ${
        overridden ? "border-[#00CCCC] bg-[#E6FAFA] text-[#007373] font-semibold" : "border-slate-300 text-slate-500"
      }`}
    />
  );
}

/* Odpowiednik CphCell dla zakładki Staff — zapisuje do OSOBNEGO pola staffCphOverride (patrz komentarz
   przy staffTargetCphOf), więc edycja tutaj nigdy nie wpływa na Godziny liczone w Master/Freelancer. */
function StaffCphCell({ entry, onCommit }) {
  const { t } = useLang();
  const fallback = campaignCphAsOfDate(entry.campaignName, entry.date, entry.campaignRef);
  const effective = hasStaffCphOverride(entry) ? Number(entry.staffCphOverride) : fallback;
  const [val, setVal] = useState(String(effective));
  useEffect(() => { setVal(String(effective)); }, [effective]);
  const commit = () => {
    const trimmed = val.trim();
    if (trimmed === "") { onCommit(null); return; }
    const n = parseFloat(trimmed);
    if (!isNaN(n) && n > 0) onCommit(n);
    else setVal(String(effective));
  };
  const overridden = hasStaffCphOverride(entry);
  return (
    <input
      type="number"
      min="1"
      step="1"
      value={val}
      onChange={(e) => setVal(e.target.value)}
      onBlur={commit}
      onKeyDown={(e) => { if (e.key === "Enter") e.currentTarget.blur(); }}
      title={t("staffCphCellHint")}
      className={`w-16 rounded px-1 py-0.5 text-xs text-center border ${
        overridden ? "border-[#00CCCC] bg-[#E6FAFA] text-[#007373] font-semibold" : "border-slate-300 text-slate-500"
      }`}
    />
  );
}

function MasterTab({ entries, pls, onAdd, onAddPl, onUpdate, onDelete, onBulkAdd, onClearAll, onOcrImport, onDedupe, notify }) {
  const { t, lang } = useLang();
  const [filterMonth, setFilterMonth] = useState("");
  const [filterPls, setFilterPls] = useState([]);
  const [filterDate, setFilterDate] = useState("");
  const [editingId, setEditingId] = useState(null);
  const ocrInputRef = useRef(null);
  const backupInputRef = useRef(null);

  const months = useMemo(() => Array.from(new Set(entries.map(e => monthKeyOf(e.date)))).sort(), [entries]);

  const filtered = useMemo(() => {
    return entries
      .filter(e => !filterMonth || monthKeyOf(e.date) === filterMonth)
      .filter(e => filterPls.length === 0 || filterPls.includes(e.pl))
      .filter(e => !filterDate || e.date === filterDate)
      .slice()
      .sort((a, b) => (a.date === b.date ? a.pl.localeCompare(b.pl) : a.date.localeCompare(b.date)));
  }, [entries, filterMonth, filterPls, filterDate]);

  const totals = useMemo(() => {
    return filtered.reduce((acc, e) => {
      acc.app += num(e.app); acc.phys += num(e.phys); acc.prizes += num(e.prizes); acc.hours += hoursOf(e);
      return acc;
    }, { app: 0, phys: 0, prizes: 0, hours: 0 });
  }, [filtered]);

  const handleOcrFile = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    parseOcrFile(file, t, async (newEntries) => {
      const plan = planOcrImport(newEntries, entries);
      let removeStale = false;
      if (plan.stale.length > 0) {
        const list = plan.stale.slice(0, 10).map(e => `• ${formatDisplayDate(e.date)} ${e.pl} — ${e.campaignName || e.campaignRef || "?"} (${num(e.app)} / ${num(e.phys)} / ${num(e.prizes)})`).join("\n")
          + (plan.stale.length > 10 ? "\n…" : "");
        removeStale = await askConfirm(t("confirmOcrStale", { count: plan.stale.length, list }));
      }
      const removed = onOcrImport(plan, removeStale);
      notify(t("notifyOcrImportSummary", { added: plan.added.length, updated: plan.changed, unchanged: plan.unchanged, removed }), "success");
    },(err) => notify(t("notifyErrorOcr", { msg: err.message }), "error"));
    e.target.value = "";
  };

  const handleBackupFile = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    parseBackupJson(file, t, async (parsed) => {
      if (await askConfirm(t("confirmImportBackup", { count: parsed.entries.length }) + (SHARED_SYNC_ACTIVE ? "\n\n" + t("syncWarnAllUsers") : ""))) {
        onBulkAdd(parsed.entries.map(pe => ({ ...pe, id: pe.id || uid() })), parsed.pls, true);
        notify(t("notifyImportedBackup"), "success");
      }
    }, (err) => notify(t("notifyErrorBackup", { msg: err.message }), "error"));
    e.target.value = "";
  };

  return (
    <div>
      <div className="flex flex-wrap gap-2 mb-4">
        <button onClick={() => ocrInputRef.current.click()} className="bg-white border border-slate-300 hover:bg-slate-50 text-sm font-medium px-3 py-2 rounded-md">{t("importOcr")}</button>
        <input type="file" ref={ocrInputRef} accept=".xlsx,.xls,.csv" className="hidden" onChange={handleOcrFile} />
        <button onClick={() => exportEntriesCsv(filtered)} className="bg-white border border-slate-300 hover:bg-slate-50 text-sm font-medium px-3 py-2 rounded-md">{t("exportCsv")}</button>
        <button onClick={() => exportBackupJson(entries, pls)} className="bg-white border border-slate-300 hover:bg-slate-50 text-sm font-medium px-3 py-2 rounded-md">{t("exportBackup")}</button>
        <button onClick={() => backupInputRef.current.click()} className="bg-white border border-slate-300 hover:bg-slate-50 text-sm font-medium px-3 py-2 rounded-md">{t("importBackup")}</button>
        <input type="file" ref={backupInputRef} accept=".json" className="hidden" onChange={handleBackupFile} />
        <button onClick={onDedupe} className="bg-white border border-amber-300 text-amber-700 hover:bg-amber-50 text-sm font-medium px-3 py-2 rounded-md">{t("dedupeButton")}</button>
        <button onClick={onClearAll} className="ml-auto bg-white border border-rose-300 text-rose-600 hover:bg-rose-50 text-sm font-medium px-3 py-2 rounded-md">{t("clearAll")}</button>
      </div>

      <AddEntryForm pls={pls} onAdd={onAdd} onAddPl={onAddPl} notify={notify} />

      <div className="flex flex-wrap gap-3 mb-3 items-center">
        <select value={filterMonth} onChange={e => setFilterMonth(e.target.value)} className="border border-slate-300 rounded-md px-2 py-1.5 text-sm">
          <option value="">{t("allMonths")}</option>
          {months.map(m => <option key={m} value={m}>{monthLabel(lang, m)}</option>)}
        </select>
        <MultiEmployeeSelect options={pls} selected={filterPls} onChange={setFilterPls} allLabel={t("allEmployees")} />
        <div className="flex items-center gap-1.5">
          <label className="text-xs text-slate-500">{t("filterDayLabel")}</label>
          <input type="date" value={filterDate} onChange={e => setFilterDate(e.target.value)} className="border border-slate-300 rounded-md px-2 py-1.5 text-sm" />
        </div>
        {filterDate && (
          <button type="button" onClick={() => setFilterDate("")} className="text-xs px-2 py-1.5 rounded-md border border-slate-300 bg-white hover:bg-slate-100 text-slate-600">
            {t("clearDayFilter")}
          </button>
        )}
        <span className="text-xs text-slate-400">{t("rowsCount", { count: filtered.length })}</span>
      </div>

      <div className="overflow-x-auto border border-slate-200 rounded-xl bg-white shadow-sm">
        <table className="min-w-full text-sm">
          <thead className="bg-slate-100 text-slate-600 sticky top-0">
            <tr>
              <th className="px-3 py-2 text-left font-medium">{t("colDate")}</th>
              <th className="px-3 py-2 text-left font-medium">PL</th>
              <th className="px-3 py-2 text-left font-medium">tck_via_app</th>
              <th className="px-3 py-2 text-left font-medium">CPH</th>
              <th className="px-3 py-2 text-left font-medium">tck_via_physical</th>
              <th className="px-3 py-2 text-left font-medium">prizes</th>
              <th className="px-3 py-2 text-left font-medium">CPH</th>
              <th className="px-3 py-2 text-left font-medium">{t("colCampaign")}</th>
              <th className="px-3 py-2 text-left font-medium">{t("colHours")}</th>
              <th className="px-3 py-2 text-right font-medium">{t("colActions")}</th>
            </tr>
          </thead>
          <tbody className="divide-y divide-slate-100">
            {filtered.map(e => (
              editingId === e.id ? (
                <EditableRow key={e.id} entry={e} pls={pls} onSave={(draft) => { onUpdate(e.id, draft); setEditingId(null); }} onCancel={() => setEditingId(null)} />
              ) : (
                <tr key={e.id} className="hover:bg-slate-50">
                  <td className="px-3 py-2 whitespace-nowrap">{formatDisplayDate(e.date)}</td>
                  <td className="px-3 py-2 font-medium">{e.pl}</td>
                  <td className="px-3 py-2">{fmt(e.app)}</td>
                  <td className="px-3 py-2"><CphCell entry={e} onCommit={(v) => onUpdate(e.id, { cphOverride: v })} /></td>
                  <td className="px-3 py-2">{fmt(e.phys)}</td>
                  <td className="px-3 py-2">{fmt(e.prizes)}</td>
                  <td className="px-3 py-2"><CphCell entry={e} onCommit={(v) => onUpdate(e.id, { cphOverride: v })} /></td>
                  <td className="px-3 py-2 max-w-[220px] truncate" title={campaignLabelOf(e, t)}>{campaignLabelOf(e, t) || "—"}</td>
                  <td className="px-3 py-2 font-medium">{fmt(hoursOf(e))}{hasHoursOverride(e) && <span className="ml-1 text-[10px] uppercase text-[#008080] font-semibold" title={t("hoursManualNote")}>({t("manualBadge")})</span>}</td>
                  <td className="px-3 py-2 text-right whitespace-nowrap">
                    <button onClick={() => setEditingId(e.id)} className="text-[#008080] hover:text-[#005c5c] text-xs font-medium mr-3">{t("edit")}</button>
                    <button onClick={async () => { if (await askConfirm(t("confirmDelete"))) onDelete(e.id); }} className="text-rose-500 hover:text-rose-700 text-xs font-medium">{t("delete")}</button>
                  </td>
                </tr>
              )
            ))}
            {filtered.length === 0 && (
              <tr><td colSpan="10" className="px-3 py-8 text-center text-slate-400">{t("noRows")}</td></tr>
            )}
          </tbody>
          {filtered.length > 0 && (
            <tfoot className="bg-slate-50 font-semibold border-t border-slate-200">
              <tr>
                <td className="px-3 py-2" colSpan="2">{t("sum")}</td>
                <td className="px-3 py-2">{fmt(totals.app)}</td>
                <td></td>
                <td className="px-3 py-2">{fmt(totals.phys)}</td>
                <td className="px-3 py-2">{fmt(totals.prizes)}</td>
                <td></td>
                <td></td>
                <td className="px-3 py-2">{fmt(round2(totals.hours))}</td>
                <td></td>
              </tr>
            </tfoot>
          )}
        </table>
      </div>
    </div>
  );
}

function MonthlyTab({ entries, staffList }) {
  const { t, lang } = useLang();
  /* Godziny i ilości liczone DOKŁADNIE tak samo jak w zakładce "Produktywność do druku":
     - freelancerzy (PLF11-PLF40): ilość = Freelancerzy + tck_via_physical (Sales List),
       godziny = combinedFreelancerHoursOf (Freelancerzy + Sales List + Trening/Admin/Ad hoc + godziny admin, każde raz),
     - staff: ilość = prizes, godziny = staffHoursOf (ręcznie wpisane + godziny admin),
     - pozostałe loginy (dane historyczne): dotychczasowa reguła hoursOf. */
  const freelancerPlSet = useMemo(() => new Set(FREELANCER_PLS_FROM_AUGUST_2026), []);
  const staffSet = useMemo(
    () => new Set((staffList && staffList.length ? staffList : STAFF_PLS_FROM_AUGUST_2026).map(p => String(p).trim().toUpperCase())),
    [staffList]
  );
  const months = useMemo(() => Array.from(new Set(entries.map(e => monthKeyOf(e.date)))).sort(), [entries]);
  const [selectedMonth, setSelectedMonth] = useState("");
  const [dateFrom, setDateFrom] = useState("");
  const [dateTo, setDateTo] = useState("");

  useEffect(() => {
    if (!selectedMonth && months.length) {
      const last = months[months.length - 1];
      setSelectedMonth(last);
      setDateFrom(monthStartOf(last));
      setDateTo(monthEndOf(last));
    }
  }, [months]);

  function handleMonthChange(m) {
    setSelectedMonth(m);
    if (m) { setDateFrom(monthStartOf(m)); setDateTo(monthEndOf(m)); }
  }

  function handleResetToMonth() {
    if (selectedMonth) { setDateFrom(monthStartOf(selectedMonth)); setDateTo(monthEndOf(selectedMonth)); }
    else { setDateFrom(""); setDateTo(""); }
  }

  const grouped = useMemo(() => {
    const map = {};
    entries.filter(e => (!dateFrom || e.date >= dateFrom) && (!dateTo || e.date <= dateTo)).forEach(e => {
      if (!map[e.pl]) map[e.pl] = { pl: e.pl, app: 0, phys: 0, prizes: 0, qty: 0, hours: 0 };
      const r = map[e.pl];
      r.app += num(e.app); r.phys += num(e.phys); r.prizes += num(e.prizes);
      const plKey = String(e.pl || "").trim().toUpperCase();
      if (freelancerPlSet.has(plKey)) {
        r.qty = round2(r.qty + freelancerQtyOf(e) + salesListQtyOf(e));
        r.hours = round2(r.hours + combinedFreelancerHoursOf(e));
      } else if (staffSet.has(plKey)) {
        r.qty = round2(r.qty + qtyOfStaff(e));
        r.hours = round2(r.hours + staffHoursOf(e));
      } else {
        r.qty = round2(r.qty + qtyOf(e));
        r.hours = round2(r.hours + hoursOf(e));
      }
    });
    return Object.values(map).sort((a, b) => comparePl(a.pl, b.pl));
  }, [entries, dateFrom, dateTo, freelancerPlSet, staffSet]);

  const maxHours = Math.max(1, ...grouped.map(r => r.hours));
  const grand = grouped.reduce((acc, r) => ({ app: acc.app + r.app, phys: acc.phys + r.phys, prizes: acc.prizes + r.prizes, qty: acc.qty + r.qty, hours: round2(acc.hours + r.hours) }), { app: 0, phys: 0, prizes: 0, qty: 0, hours: 0 });

  return (
    <div>
      <div className="flex flex-wrap items-end gap-4 mb-4 bg-slate-50 border border-slate-200 rounded-xl p-3">
        <div className="flex items-center gap-2">
          <label className="text-sm text-slate-600">{t("monthSelect")}</label>
          <select value={selectedMonth} onChange={e => handleMonthChange(e.target.value)} className="border border-slate-300 rounded-md px-2 py-1.5 text-sm">
            {months.length === 0 && <option value="">{t("noData")}</option>}
            {months.map(m => <option key={m} value={m}>{monthLabel(lang, m)}</option>)}
          </select>
        </div>
        <div className="flex items-center gap-2">
          <label className="text-sm text-slate-600">{t("dateFromLabel")}</label>
          <input type="date" value={dateFrom} onChange={e => setDateFrom(e.target.value)} className="border border-slate-300 rounded-md px-2 py-1.5 text-sm" />
        </div>
        <div className="flex items-center gap-2">
          <label className="text-sm text-slate-600">{t("dateToLabel")}</label>
          <input type="date" value={dateTo} onChange={e => setDateTo(e.target.value)} className="border border-slate-300 rounded-md px-2 py-1.5 text-sm" />
        </div>
        <button type="button" onClick={handleResetToMonth} className="text-sm px-3 py-1.5 rounded-md border border-slate-300 bg-white hover:bg-slate-100 text-slate-600">
          {t("resetFilter")}
        </button>
        <div className="text-xs text-slate-400 basis-full">{t("filterRangeNote")}</div>
      </div>

      <div className="overflow-x-auto border border-slate-200 rounded-xl bg-white shadow-sm">
        <table className="min-w-full text-sm">
          <thead className="bg-slate-100 text-slate-600">
            <tr>
              <th className="px-3 py-2 text-left font-medium">PL</th>
              <th className="px-3 py-2 text-left font-medium">tck_via_app</th>
              <th className="px-3 py-2 text-left font-medium">tck_via_physical</th>
              <th className="px-3 py-2 text-left font-medium">prizes</th>
              <th className="px-3 py-2 text-left font-medium">{t("colQty")}</th>
              <th className="px-3 py-2 text-left font-medium">{t("colHours")}</th>
              <th className="px-3 py-2 text-left font-medium w-40"></th>
            </tr>
          </thead>
          <tbody className="divide-y divide-slate-100">
            {grouped.map(r => (
              <tr key={r.pl} className="hover:bg-slate-50">
                <td className="px-3 py-2 font-medium">{r.pl}</td>
                <td className="px-3 py-2">{fmt(r.app)}</td>
                <td className="px-3 py-2">{fmt(r.phys)}</td>
                <td className="px-3 py-2">{fmt(r.prizes)}</td>
                <td className="px-3 py-2">{fmt(r.qty)}</td>
                <td className="px-3 py-2 font-medium">{fmt(r.hours)}</td>
                <td className="px-3 py-2">
                  <div className="h-2 bg-slate-100 rounded-full overflow-hidden">
                    <div className="h-2 bg-[#00CCCC] rounded-full" style={{ width: (r.hours / maxHours * 100) + "%" }}></div>
                  </div>
                </td>
              </tr>
            ))}
            {grouped.length === 0 && (
              <tr><td colSpan="7" className="px-3 py-8 text-center text-slate-400">{t("noDataMonth")}</td></tr>
            )}
          </tbody>
          {grouped.length > 0 && (
            <tfoot className="bg-slate-50 font-semibold border-t border-slate-200">
              <tr>
                <td className="px-3 py-2">{t("sum")}</td>
                <td className="px-3 py-2">{fmt(grand.app)}</td>
                <td className="px-3 py-2">{fmt(grand.phys)}</td>
                <td className="px-3 py-2">{fmt(grand.prizes)}</td>
                <td className="px-3 py-2">{fmt(grand.qty)}</td>
                <td className="px-3 py-2">{fmt(grand.hours)}</td>
                <td></td>
              </tr>
            </tfoot>
          )}
        </table>
      </div>
    </div>
  );
}

  const freelancerPlSet = useMemo(() => new Set(FREELANCER_PLS_FROM_AUGUST_2026), []);
  const freelancerPls = useMemo(() => {
    const fromPls = (pls || []).filter(p => freelancerPlSet.has(String(p || "").trim().toUpperCase()));
    return Array.from(new Set([...FREELANCER_PLS_FROM_AUGUST_2026, ...fromPls])).sort(comparePl);
  }, [pls, freelancerPlSet]);
  const staffSet = useMemo(
    () => new Set((staffList && staffList.length ? staffList : STAFF_PLS_FROM_AUGUST_2026).map(p => String(p).trim().toUpperCase())),
    [staffList]
  );

  // Lista wszystkich pracowników (freelancerzy + staff) do rozwijanej listy wyboru konkretnej osoby —
  // wybór filtruje OBIE tabele naraz (w praktyce dotyczy tej, do której dana osoba należy).
  const allEmployeesForFilter = useMemo(
    () => Array.from(new Set([...freelancerPls, ...(staffList || [])])).sort(comparePl),
    [freelancerPls, staffList]

  const months = useMemo(() => Array.from(new Set(entries.map(e => monthKeyOf(e.date)))).sort(), [entries]);

    () => listStaffProductivityDaily(entries, staffSet, selectedMonth),
    [entries, staffSet, selectedMonth]
  );
  const freelancerRows = useMemo(
    () => freelancerRowsAll.filter(r => !selectedPl || r.pl === selectedPl),

  const staffRows = useMemo(
    () => staffRowsAll.filter(r => !selectedPl || r.pl === selectedPl),
