function makeT(lang) {
  const dict = TRANSLATIONS[lang] || TRANSLATIONS.pl;
  return function t(key, vars) {
    let str = dict[key] || TRANSLATIONS.pl[key] || key;
    if (vars) {
      Object.keys(vars).forEach((k) => {
        str = str.split("{" + k + "}").join(String(vars[k]));
      });
    }
    return str;
  };
}

/* ============================== FUNKCJE POMOCNICZE ============================== */
function round2(n) { return Number(n.toFixed(2)); }
function num(v) { const n = Number(v); return isNaN(n) ? 0 : n; }
function qtyOf(e) { return num(e.app) + num(e.phys); }
/* Zakładka Staff: "CPH wyliczone" (i wszystko co z niego wynika — podgląd w formularzach, zapis
   cphOverride przy wpisywaniu godzin, zbiorcza Produktywność w stopce) liczone jest wyłącznie
   z kolumny "prizes" (nie z tck_via_app/tck_via_physical), na wyraźną prośbę użytkownika. */
function qtyOfStaff(e) { return num(e.prizes); }
function hasHoursOverride(e) { return e && e.hoursOverride !== undefined && e.hoursOverride !== null && e.hoursOverride !== "" && !isNaN(Number(e.hoursOverride)); }
/* Godziny admin: dodatkowe, ręcznie wpisywane godziny (np. praca administracyjna przy kampanii "Trening"),
   które ZAWSZE sumują się z godzinami wiersza, niezależnie od kampanii/typu wpisu (Freelancerzy/Freelancer
   Sales List/Staff) — patrz pole adminHours na wpisie. Domyślnie 0/brak, więc stare wpisy (bez tego pola)
   liczą się tak jak dotychczas, bez zmian. Dodawane WYŁĄCZNIE raz — patrz combinedFreelancerHoursOf poniżej,
   które celowo sumuje wersje "bazowe" (bez adminHoursOf) obu zakładek, żeby nie zdublować tej wartości. */
function adminHoursOf(e) { return round2(num(e && e.adminHours)); }
function hoursOf(e) {
  const base = hasHoursOverride(e) ? round2(Number(e.hoursOverride)) : round2(qtyOf(e) / cphForEntry(e));
  return round2(base + adminHoursOf(e));
}
/* Zakładka Staff: godziny wpisywane wyłącznie ręcznie (nie liczone automatycznie z CPH kampanii jak dla
   freelancerów). Dla wiersza, w którym nie wpisano jeszcze godzin, wyświetlamy 0 — a nie domyślny szacunek
   z ilości/CPH kampanii — żeby nie sugerować nieprawdziwej wartości, dopóki nie zostaną wpisane realne godziny.
   staffHoursBaseOf (bez godzin admin) jest używane do wiązania pola edycji (HoursCell) — żeby edycja tego pola
   nigdy nie "zapiekła" już dodanych godzin admin do hoursOverride. staffHoursOf (z godzinami admin) jest
   używane wszędzie indziej (podsumowania, Produktywność do druku, eksport). */
function staffHoursBaseOf(e) { return hasHoursOverride(e) ? round2(Number(e.hoursOverride)) : 0; }
function staffHoursOf(e) { return round2(staffHoursBaseOf(e) + adminHoursOf(e)); }
/* CPH wyliczone (= prizes / godziny) i Produktywność (= CPH wyliczone / CPH kampanii * 100) mają się pojawić
   dopiero, gdy wpisane zostaną godziny — do tego czasu pokazujemy "—". Liczone ZAWSZE na żywo z aktualnych
   prizes/godzin (a nie z zapisanego wcześniej cphOverride), żeby nigdy nie "zastygło" na starej wartości —
   np. gdy zmieni się ilość w kolumnie prizes dla wiersza, który miał już wpisane godziny. Pole cphOverride
   nie jest tu w ogóle używane, żeby nie kolidować z jego inną rolą w zakładkach Master/Freelancer (tam
   cphOverride wpływa na przeliczanie Godzin z ilości — to są te same wpisy, współdzielone między zakładkami). */
/* UWAGA: liczone z staffHoursBaseOf (BEZ godzin admin) — godziny admin to praca administracyjna, nie
   produktywna, więc nie powinny "rozwadniać" wyliczonego CPH / % realizacji. */
function staffAchievedCphOf(e) {
  const hours = staffHoursBaseOf(e);
  if (!(hours > 0)) return null;
  return round2(qtyOfStaff(e) / hours);
}
function staffAchievementPctOf(e, campaignCph) {
  const achieved = staffAchievedCphOf(e);
  return (achieved != null && campaignCph > 0) ? round2((achieved / campaignCph) * 100) : null;
}
/* Zakładka Freelancerzy: standardowo ilość/godziny liczone z "tck_via_app" (nie z prizes). WYJĄTEK: jeśli

  );
  const csv = rows.map(r => r.map(csvCell).join(";")).join("\r\n");
  downloadBlob("Master_PS_" + todayIso() + ".csv", "﻿" + csv, "text/csv;charset=utf-8;");
}

/* Import pliku "Lista OcrTransaction" (xlsx/csv) - jeden wiersz = jedna transakcja/promocja */
function parseOcrFile(file, t, onDone, onError) {
  const reader = new FileReader();
  reader.onload = (evt) => {
    try {
      const data = new Uint8Array(evt.target.result);
      const wb = XLSX.read(data, { type: "array" });
      const sheet = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: null });
      let headerIdx = -1;
      for (let i = 0; i < rows.length; i++) {
        if (Array.isArray(rows[i]) && rows[i].some(c => String(c || "").trim().toLowerCase() === "iduser")) {
          headerIdx = i; break;
        }
      }
      if (headerIdx === -1) throw new Error(t("errNoIdUser"));
      const headers = rows[headerIdx].map(h => String(h || "").trim().toLowerCase());
      const col = (name) => headers.indexOf(name.toLowerCase());
      const idxUser = col("idUser"), idxYear = col("year"), idxMonth = col("month"), idxDay = col("day");
      const idxApp = col("tck_via_app"), idxPhys = col("tck_via_physical"), idxPrizes = col("prizes");
      const idxPromoRef = col("promotion_reference"), idxPromoName = col("promotion_name");
      if ([idxUser, idxYear, idxMonth, idxDay, idxApp, idxPhys, idxPrizes].some(i => i === -1)) {
        throw new Error(t("errMissingColumns"));
      }
      const cleanInt = (v) => { const n = parseInt(String(v == null ? "" : v).replace(/[^\d-]/g, ""), 10); return isNaN(n) ? 0 : n; };
      const out = [];
      for (let i = headerIdx + 1; i < rows.length; i++) {
        const row = rows[i];
        if (!row || row[idxUser] == null || String(row[idxUser]).trim() === "") continue;
        const y = cleanInt(row[idxYear]), m = cleanInt(row[idxMonth]), d = cleanInt(row[idxDay]);
        if (!y || !m || !d) continue;
        const iso = `${y}-${String(m).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
        out.push({
          id: uid(),
          date: iso,
          pl: String(row[idxUser]).trim(),
          app: num(row[idxApp]),
          phys: num(row[idxPhys]),
          prizes: num(row[idxPrizes]),
          campaignRef: idxPromoRef !== -1 && row[idxPromoRef] != null ? String(row[idxPromoRef]).trim() : "",
          campaignName: idxPromoName !== -1 && row[idxPromoName] != null ? String(row[idxPromoName]).trim() : "",
        });
      }
      if (out.length === 0) throw new Error(t("errNoValidRows"));
      onDone(out);
    } catch (err) { onError(err); }
  };
  reader.onerror = () => onError(new Error(t("errReadFile")));
  reader.readAsArrayBuffer(file);
}

/* Import kopii zapasowej JSON (pełne dane) */
function parseBackupJson(file, t, onDone, onError) {
  const reader = new FileReader();
  reader.onload = (evt) => {
    try {
      const parsed = JSON.parse(evt.target.result);
      if (!Array.isArray(parsed.entries)) throw new Error(t("errInvalidBackup"));
      onDone(parsed);
    } catch (err) { onError(err); }
  };
  reader.onerror = () => onError(new Error(t("errReadFile")));
  reader.readAsText(file);
}

  const { t } = useLang();
  // qtyFn/fallbackCphFn dają widokom (Freelancerzy = prizes, Freelancer Sales List = tck_via_physical + CPH=140)
  // możliwość podglądu innej wartości "ilości" i domyślnego CPH w podpowiedziach pól — bez zmiany zachowania
  // domyślnego (Master = tck_via_app + tck_via_physical, CPH kampanii), gdy te propsy nie są podane.
  // disableHoursOverride: zakładka Freelancer Sales List NIE pozwala tu wpisywać ręcznych godzin — pole
  // hoursOverride jest wspólne z zakładką Freelancerzy, a ręczne godziny mają dotyczyć wyłącznie tamtej
  // zakładki (patrz komentarz przy salesListHoursOf). Tu pokazujemy tylko wyliczoną wartość, bez edycji.
  // physOnlyLayout: zakładka Freelancer Sales List pokazuje w tabeli tylko tck_via_physical + jeden CPH (bez
  // tck_via_app i prizes) — tu odzwierciedlamy to samo w wierszu edycji, żeby liczba kolumn zgadzała się
  // z nagłówkiem tabeli tej zakładki (7 kolumn, nie 10 jak w Master/Freelancerzy).
  // showAdminHours/onAdminHoursCommit: dodaje kolumnę "Godziny admin" (patrz AdminHoursCell) — używane w
  // zakładkach Freelancerzy/Freelancer Sales List, NIE w Master (patrz wywołania EditableRow w tych
  // zakładkach). Komórka wiąże się z "entry" (nie "draft") i zapisuje się NATYCHMIAST, niezależnie od
  // przycisku "Zapisz" tego wiersza — tak jak CphCell w widoku bez edycji.
  const getQty = qtyFn || qtyOf;
  const getFallbackCph = fallbackCphFn || ((d) => cphForCampaign(d.campaignName, d.campaignRef));
  const effectiveCph = (d) => (hasCphOverride(d) ? Number(d.cphOverride) : getFallbackCph(d));
  const [draft, setDraft] = useState({ ...entry });
  // Wpis "Trening" nie ma żadnej ilości fizycznej, więc w zakładce Freelancer Sales List (disableHoursOverride)
  // wzór ilość/CPH zawsze daje 0 godzin — dlatego mimo disableHoursOverride pozwalamy tu wpisać godziny ręcznie
  // dla wpisów Trening (patrz komentarz przy salesListHoursOf/combinedFreelancerHoursOf).
  const isTrainingRow = isTrainingEntry(draft);
  const isAdminRow = isAdminEntry(draft);
  const set = (k) => (e) => setDraft(d => ({ ...d, [k]: e.target.value }));
  const [campaignChoice, setCampaignChoice] = useState(() => {
    if (entry.campaignRef && CAMPAIGNS.some(o => o.ref === entry.campaignRef)) return entry.campaignRef;
    if (!entry.campaignRef && entry.campaignName === TRAINING_CAMPAIGN_NAME) return "__training__";
    if (!entry.campaignRef && entry.campaignName === ADMIN_CAMPAIGN_NAME) return "__admin__";
    if (entry.campaignName) return "__custom__";
    return "";
  });
  const handleCampaignChoice = (e) => {
    const v = e.target.value;
    setCampaignChoice(v);
    if (v === "__custom__") {
      setDraft(d => ({ ...d, campaignRef: "" }));
    } else if (v === "__training__") {
      setDraft(d => ({ ...d, campaignName: TRAINING_CAMPAIGN_NAME, campaignRef: "" }));
    } else if (v === "__admin__") {
      setDraft(d => ({ ...d, campaignName: ADMIN_CAMPAIGN_NAME, campaignRef: "" }));
    } else if (v === "") {
      setDraft(d => ({ ...d, campaignName: "", campaignRef: "" }));
    } else {
      const opt = CAMPAIGNS.find(o => o.ref === v);
      setDraft(d => ({ ...d, campaignName: opt ? opt.name : "", campaignRef: opt ? opt.ref : "" }));
    }
  };
  return (
    <tr className="bg-amber-50">
      <td className="px-3 py-2"><input type="date" value={draft.date} onChange={set("date")} className="border border-slate-300 rounded px-1 py-0.5 text-xs w-32" /></td>

        </td>
      )}
      <td className="px-3 py-2"><input type="number" value={draft.phys} onChange={set("phys")} className="border border-slate-300 rounded px-1 py-0.5 text-xs w-20" /></td>
      {!physOnlyLayout && (
        <td className="px-3 py-2"><input type="number" value={draft.prizes} onChange={set("prizes")} className="border border-slate-300 rounded px-1 py-0.5 text-xs w-20" /></td>
      )}
      <td className="px-3 py-2 text-center">
        <input type="number" min="1" step="1" value={draft.cphOverride ?? ""} onChange={set("cphOverride")} placeholder={String(getFallbackCph(draft))} title={t("cphCellHint")} className={`border rounded px-1 py-0.5 text-xs w-16 text-center ${draft.cphOverride ? "border-[#00CCCC] bg-[#E6FAFA] text-[#007373] font-semibold" : "border-slate-300"}`} />
      </td>
      <td className="px-3 py-2">
        <select value={campaignChoice} onChange={handleCampaignChoice} className="border border-slate-300 rounded px-1 py-0.5 text-xs w-32">
          <option value="">{t("noCampaign")}</option>

        )}
      </td>
      <td className="px-3 py-2 text-center">
        {disableHoursOverride && !isTrainingRow && !isAdminRow ? (
          <span className="text-xs text-slate-500" title={t("salesListHoursNotEditableHint")}>{fmt(round2(getQty(draft) / effectiveCph(draft)))}</span>
        ) : (

        )}

        <button onClick={() => onSave({ ...draft, app: num(draft.app), phys: num(draft.phys), prizes: num(draft.prizes), hoursOverride: draft.hoursOverride === "" || draft.hoursOverride === null || draft.hoursOverride === undefined ? null : num(draft.hoursOverride), cphOverride: draft.cphOverride === "" || draft.cphOverride === null || draft.cphOverride === undefined ? null : num(draft.cphOverride) })} className="text-emerald-600 hover:text-emerald-800 text-xs font-medium mr-2">{t("save")}</button>
        <button onClick={onCancel} className="text-slate-500 hover:text-slate-700 text-xs">{t("cancel")}</button>

function CphCell({ entry, onCommit, fallbackCph }) {
  const { t } = useLang();
  // fallbackCph pozwala widokom z własnym stałym CPH (np. Freelancer Sales List = 140) pokazywać go jako
  // wartość domyślną, gdy wiersz nie ma jeszcze własnego, ręcznie wpisanego CPH (cphOverride).
  const effective = hasCphOverride(entry) ? Number(entry.cphOverride) : (fallbackCph != null ? fallbackCph : cphForCampaign(entry.campaignName, entry.campaignRef));
  const [val, setVal] = useState(String(effective));
  useEffect(() => { setVal(String(effective)); }, [effective]);
  const commit = () => {
    const trimmed = val.trim();
    if (trimmed === "") { onCommit(null); return; }
    const n = parseFloat(trimmed);
    if (!isNaN(n) && n > 0) onCommit(n);
    else setVal(String(effective));
  };
  const overridden = hasCphOverride(entry);
  return (
    <input
      type="number"
      min="1"
      step="1"
      value={val}
      onChange={(e) => setVal(e.target.value)}
      onBlur={commit}
      onKeyDown={(e) => { if (e.key === "Enter") e.currentTarget.blur(); }}
      title={t("cphCellHint")}
      className={`w-16 rounded px-1 py-0.5 text-xs text-center border ${
        overridden ? "border-[#00CCCC] bg-[#E6FAFA] text-[#007373] font-semibold" : "border-slate-300 text-slate-500"
      }`}
    />
  );
}

/* Odpowiednik CphCell dla zakładki Staff — zapisuje do OSOBNEGO pola staffCphOverride (patrz komentarz
   przy staffTargetCphOf), więc edycja tutaj nigdy nie wpływa na Godziny liczone w Master/Freelancer. */
function StaffCphCell({ entry, onCommit }) {
  const { t } = useLang();
  const fallback = campaignCphAsOfDate(entry.campaignName, entry.date, entry.campaignRef);
  const effective = hasStaffCphOverride(entry) ? Number(entry.staffCphOverride) : fallback;
  const [val, setVal] = useState(String(effective));
  useEffect(() => { setVal(String(effective)); }, [effective]);
  const commit = () => {
    const trimmed = val.trim();
    if (trimmed === "") { onCommit(null); return; }
    const n = parseFloat(trimmed);
    if (!isNaN(n) && n > 0) onCommit(n);
    else setVal(String(effective));
  };
  const overridden = hasStaffCphOverride(entry);
  return (
    <input
      type="number"
      min="1"
      step="1"
      value={val}
      onChange={(e) => setVal(e.target.value)}
      onBlur={commit}
      onKeyDown={(e) => { if (e.key === "Enter") e.currentTarget.blur(); }}
      title={t("staffCphCellHint")}
      className={`w-16 rounded px-1 py-0.5 text-xs text-center border ${
        overridden ? "border-[#00CCCC] bg-[#E6FAFA] text-[#007373] font-semibold" : "border-slate-300 text-slate-500"
      }`}
    />
  );
}

function MasterTab({ entries, pls, onAdd, onAddPl, onUpdate, onDelete, onBulkAdd, onClearAll, notify }) {
  const { t, lang } = useLang();
  const [filterMonth, setFilterMonth] = useState("");
  const [filterPls, setFilterPls] = useState([]);
  const [filterDate, setFilterDate] = useState("");
  const [editingId, setEditingId] = useState(null);
  const ocrInputRef = useRef(null);
  const backupInputRef = useRef(null);

  const months = useMemo(() => Array.from(new Set(entries.map(e => monthKeyOf(e.date)))).sort(), [entries]);

  const filtered = useMemo(() => {
    return entries
      .filter(e => !filterMonth || monthKeyOf(e.date) === filterMonth)
      .filter(e => filterPls.length === 0 || filterPls.includes(e.pl))
      .filter(e => !filterDate || e.date === filterDate)
      .slice()
      .sort((a, b) => (a.date === b.date ? a.pl.localeCompare(b.pl) : a.date.localeCompare(b.date)));
  }, [entries, filterMonth, filterPls, filterDate]);

  const totals = useMemo(() => {
    return filtered.reduce((acc, e) => {
      acc.app += num(e.app); acc.phys += num(e.phys); acc.prizes += num(e.prizes); acc.hours += hoursOf(e);
      return acc;
    }, { app: 0, phys: 0, prizes: 0, hours: 0 });
  }, [filtered]);

  const handleOcrFile = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    parseOcrFile(file, t, (newEntries) => {
      const { unique, duplicates } = splitOcrDuplicates(newEntries, entries);
      if (unique.length > 0) onBulkAdd(unique);
      if (duplicates.length > 0) {
        const msg = unique.length > 0
          ? t("notifyImportedOcrWithDuplicates", { count: unique.length, blocked: duplicates.length })
          : t("notifyAllDuplicatesBlocked", { blocked: duplicates.length });
        notify(msg, "error");
      } else {
        notify(t("notifyImportedOcr", { count: unique.length }), "success");
      }
    }, (err) => notify(t("notifyErrorOcr", { msg: err.message }), "error"));
    e.target.value = "";
  };

  const handleBackupFile = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    parseBackupJson(file, t, (parsed) => {
      if (window.confirm(t("confirmImportBackup", { count: parsed.entries.length }))) {
        onBulkAdd(parsed.entries.map(pe => ({ ...pe, id: pe.id || uid() })), parsed.pls, true);
        notify(t("notifyImportedBackup"), "success");
      }
    }, (err) => notify(t("notifyErrorBackup", { msg: err.message }), "error"));
    e.target.value = "";
  };

  return (
    <div>
      <div className="flex flex-wrap gap-2 mb-4">
        <button onClick={() => ocrInputRef.current.click()} className="bg-white border border-slate-300 hover:bg-slate-50 text-sm font-medium px-3 py-2 rounded-md">{t("importOcr")}</button>
        <input type="file" ref={ocrInputRef} accept=".xlsx,.xls,.csv" className="hidden" onChange={handleOcrFile} />
        <button onClick={() => exportEntriesCsv(filtered)} className="bg-white border border-slate-300 hover:bg-slate-50 text-sm font-medium px-3 py-2 rounded-md">{t("exportCsv")}</button>
        <button onClick={() => exportBackupJson(entries, pls)} className="bg-white border border-slate-300 hover:bg-slate-50 text-sm font-medium px-3 py-2 rounded-md">{t("exportBackup")}</button>
        <button onClick={() => backupInputRef.current.click()} className="bg-white border border-slate-300 hover:bg-slate-50 text-sm font-medium px-3 py-2 rounded-md">{t("importBackup")}</button>
        <input type="file" ref={backupInputRef} accept=".json" className="hidden" onChange={handleBackupFile} />
        <button onClick={onClearAll} className="ml-auto bg-white border border-rose-300 text-rose-600 hover:bg-rose-50 text-sm font-medium px-3 py-2 rounded-md">{t("clearAll")}</button>
      </div>

      <AddEntryForm pls={pls} onAdd={onAdd} onAddPl={onAddPl} notify={notify} />

      <div className="flex flex-wrap gap-3 mb-3 items-center">
        <select value={filterMonth} onChange={e => setFilterMonth(e.target.value)} className="border border-slate-300 rounded-md px-2 py-1.5 text-sm">
          <option value="">{t("allMonths")}</option>
          {months.map(m => <option key={m} value={m}>{monthLabel(lang, m)}</option>)}
        </select>
        <MultiEmployeeSelect options={pls} selected={filterPls} onChange={setFilterPls} allLabel={t("allEmployees")} />
        <div className="flex items-center gap-1.5">
          <label className="text-xs text-slate-500">{t("filterDayLabel")}</label>
          <input type="date" value={filterDate} onChange={e => setFilterDate(e.target.value)} className="border border-slate-300 rounded-md px-2 py-1.5 text-sm" />
        </div>
        {filterDate && (
          <button type="button" onClick={() => setFilterDate("")} className="text-xs px-2 py-1.5 rounded-md border border-slate-300 bg-white hover:bg-slate-100 text-slate-600">
            {t("clearDayFilter")}
          </button>
        )}
        <span className="text-xs text-slate-400">{t("rowsCount", { count: filtered.length })}</span>
      </div>

      <div className="overflow-x-auto border border-slate-200 rounded-xl bg-white shadow-sm">
        <table className="min-w-full text-sm">
          <thead className="bg-slate-100 text-slate-600 sticky top-0">

            </tr>
          </thead>
          <tbody className="divide-y divide-slate-100">
            {filtered.map(e => (
              editingId === e.id ? (
                <EditableRow key={e.id} entry={e} pls={pls} onSave={(draft) => { onUpdate(e.id, draft); setEditingId(null); }} onCancel={() => setEditingId(null)} />

                  <td className="px-3 py-2">{fmt(e.phys)}</td>

                  <td className="px-3 py-2"><CphCell entry={e} onCommit={(v) => onUpdate(e.id, { cphOverride: v })} /></td>
                  <td className="px-3 py-2 max-w-[220px] truncate" title={campaignLabelOf(e, t)}>{campaignLabelOf(e, t) || "—"}</td>
                  <td className="px-3 py-2 font-medium">{fmt(hoursOf(e))}{hasHoursOverride(e) && <span className="ml-1 text-[10px] uppercase text-[#008080] font-semibold" title={t("hoursManualNote")}>({t("manualBadge")})</span>}</td>
                  <td className="px-3 py-2 text-right whitespace-nowrap">
                    <button onClick={() => setEditingId(e.id)} className="text-[#008080] hover:text-[#005c5c] text-xs font-medium mr-3">{t("edit")}</button>
                    <button onClick={() => { if (window.confirm(t("confirmDelete"))) onDelete(e.id); }} className="text-rose-500 hover:text-rose-700 text-xs font-medium">{t("delete")}</button>
                  </td>

              )
            ))}
            {filtered.length === 0 && (
              <tr><td colSpan="10" className="px-3 py-8 text-center text-slate-400">{t("noRows")}</td></tr>
            )}
          </tbody>

}

function MonthlyTab({ entries }) {
  const { t, lang } = useLang();
  const months = useMemo(() => Array.from(new Set(entries.map(e => monthKeyOf(e.date)))).sort(), [entries]);
  const [selectedMonth, setSelectedMonth] = useState("");
  const [dateFrom, setDateFrom] = useState("");
  const [dateTo, setDateTo] = useState("");

  useEffect(() => {
    if (!selectedMonth && months.length) {
      const last = months[months.length - 1];
      setSelectedMonth(last);
      setDateFrom(monthStartOf(last));
      setDateTo(monthEndOf(last));
    }
  }, [months]);

  function handleMonthChange(m) {
    setSelectedMonth(m);
    if (m) { setDateFrom(monthStartOf(m)); setDateTo(monthEndOf(m)); }
  }

  function handleResetToMonth() {
    if (selectedMonth) { setDateFrom(monthStartOf(selectedMonth)); setDateTo(monthEndOf(selectedMonth)); }
    else { setDateFrom(""); setDateTo(""); }
  }

  const grouped = useMemo(() => {
    const map = {};
    entries.filter(e => (!dateFrom || e.date >= dateFrom) && (!dateTo || e.date <= dateTo)).forEach(e => {
      if (!map[e.pl]) map[e.pl] = { pl: e.pl, app: 0, phys: 0, prizes: 0, hours: 0 };
      map[e.pl].app += num(e.app); map[e.pl].phys += num(e.phys); map[e.pl].prizes += num(e.prizes);
      map[e.pl].hours = round2(map[e.pl].hours + hoursOf(e));
    });
    return Object.values(map)
      .map(r => ({ ...r, qty: r.app + r.phys }))
      .sort((a, b) => b.hours - a.hours);
  }, [entries, dateFrom, dateTo]);

  const maxHours = Math.max(1, ...grouped.map(r => r.hours));
  const grand = grouped.reduce((acc, r) => ({ app: acc.app + r.app, phys: acc.phys + r.phys, prizes: acc.prizes + r.prizes, qty: acc.qty + r.qty, hours: round2(acc.hours + r.hours) }), { app: 0, phys: 0, prizes: 0, qty: 0, hours: 0 });

  return (
    <div>
      <div className="flex flex-wrap items-end gap-4 mb-4 bg-slate-50 border border-slate-200 rounded-xl p-3">
        <div className="flex items-center gap-2">
          <label className="text-sm text-slate-600">{t("monthSelect")}</label>
          <select value={selectedMonth} onChange={e => handleMonthChange(e.target.value)} className="border border-slate-300 rounded-md px-2 py-1.5 text-sm">
            {months.length === 0 && <option value="">{t("noData")}</option>}
            {months.map(m => <option key={m} value={m}>{monthLabel(lang, m)}</option>)}
          </select>
        </div>
        <div className="flex items-center gap-2">
          <label className="text-sm text-slate-600">{t("dateFromLabel")}</label>
          <input type="date" value={dateFrom} onChange={e => setDateFrom(e.target.value)} className="border border-slate-300 rounded-md px-2 py-1.5 text-sm" />
        </div>
        <div className="flex items-center gap-2">
          <label className="text-sm text-slate-600">{t("dateToLabel")}</label>
          <input type="date" value={dateTo} onChange={e => setDateTo(e.target.value)} className="border border-slate-300 rounded-md px-2 py-1.5 text-sm" />
        </div>
        <button type="button" onClick={handleResetToMonth} className="text-sm px-3 py-1.5 rounded-md border border-slate-300 bg-white hover:bg-slate-100 text-slate-600">
          {t("resetFilter")}
        </button>
        <div className="text-xs text-slate-400 basis-full">{t("filterRangeNote")}</div>
      </div>

      <div className="overflow-x-auto border border-slate-200 rounded-xl bg-white shadow-sm">
        <table className="min-w-full text-sm">
          <thead className="bg-slate-100 text-slate-600">
            <tr>
              <th className="px-3 py-2 text-left font-medium">PL</th>
              <th className="px-3 py-2 text-left font-medium">tck_via_app</th>
              <th className="px-3 py-2 text-left font-medium">tck_via_physical</th>
              <th className="px-3 py-2 text-left font-medium">prizes</th>
              <th className="px-3 py-2 text-left font-medium">{t("colQty")}</th>
              <th className="px-3 py-2 text-left font-medium">{t("colHours")}</th>
              <th className="px-3 py-2 text-left font-medium w-40"></th>
            </tr>
          </thead>
          <tbody className="divide-y divide-slate-100">
            {grouped.map(r => (
              <tr key={r.pl} className="hover:bg-slate-50">
                <td className="px-3 py-2 font-medium">{r.pl}</td>
                <td className="px-3 py-2">{fmt(r.app)}</td>
                <td className="px-3 py-2">{fmt(r.phys)}</td>
                <td className="px-3 py-2">{fmt(r.prizes)}</td>
                <td className="px-3 py-2">{fmt(r.qty)}</td>
                <td className="px-3 py-2 font-medium">{fmt(r.hours)}</td>
                <td className="px-3 py-2">
                  <div className="h-2 bg-slate-100 rounded-full overflow-hidden">
                    <div className="h-2 bg-[#00CCCC] rounded-full" style={{ width: (r.hours / maxHours * 100) + "%" }}></div>
                  </div>
                </td>
              </tr>
            ))}
            {grouped.length === 0 && (
              <tr><td colSpan="7" className="px-3 py-8 text-center text-slate-400">{t("noDataMonth")}</td></tr>
            )}
          </tbody>
          {grouped.length > 0 && (
            <tfoot className="bg-slate-50 font-semibold border-t border-slate-200">
              <tr>
                <td className="px-3 py-2">{t("sum")}</td>
                <td className="px-3 py-2">{fmt(grand.app)}</td>
                <td className="px-3 py-2">{fmt(grand.phys)}</td>
                <td className="px-3 py-2">{fmt(grand.prizes)}</td>
                <td className="px-3 py-2">{fmt(grand.qty)}</td>
                <td className="px-3 py-2">{fmt(grand.hours)}</td>
                <td></td>
              </tr>
            </tfoot>
          )}
        </table>
      </div>
    </div>
  );
}

    () => Array.from(new Set([...freelancerPls, ...(staffList || [])])).sort(comparePl),
    [freelancerPls, staffList]
  );

  const months = useMemo(() => Array.from(new Set(entries.map(e => monthKeyOf(e.date)))).sort(), [entries]);
  const [selectedMonth, setSelectedMonth] = useState("");

    if (!selectedMonth && months.length) setSelectedMonth(months[months.length - 1]);
  }, [months]);

  const [editingFreelancerId, setEditingFreelancerId] = useState(null);
  const [editingStaffId, setEditingStaffId] = useState(null);

  const freelancerRowsAll = useMemo(
    () => listFreelancerProductivityDaily(entries, freelancerPlSet, selectedMonth),
    [entries, freelancerPlSet, selectedMonth]
  );
  const staffRowsAll = useMemo(
    () => listStaffProductivityDaily(entries, staffSet, selectedMonth),
    [entries, staffSet, selectedMonth]
  );
  const freelancerRows = useMemo(
    () => freelancerRowsAll.filter(r => !selectedPl || r.pl === selectedPl),
    [freelancerRowsAll, selectedPl]
  );
  const staffRows = useMemo(
    () => staffRowsAll.filter(r => !selectedPl || r.pl === selectedPl),
    [staffRowsAll, selectedPl]
  );

  const freelancerGrand = useMemo(() => freelancerRows.reduce((acc, r) => ({
    freelancerQty: round2(acc.freelancerQty + r.freelancerQty),
    freelancerHours: round2(acc.freelancerHours + r.freelancerHours),
    phys: round2(acc.phys + r.phys),
    salesListHours: round2(acc.salesListHours + r.salesListHours),
    combinedQty: round2(acc.combinedQty + r.combinedQty),
    totalHours: round2(acc.totalHours + r.totalHours),
  }), { freelancerQty: 0, freelancerHours: 0, phys: 0, salesListHours: 0, combinedQty: 0, totalHours: 0 }), [freelancerRows]);

  const staffGrand = useMemo(() => staffRows.reduce((acc, r) => ({

function WeeklyTab({ entries, staffList }) {
  const { t } = useLang();
  // JEDNA tabela na tydzień, rozbita na Freelancerzy vs Staff plus Total (patrz komentarz przy
  // groupWeeklyCombined): Ilość = suma "prizes", Godziny = suma Godzin z odpowiednich zakładek
  // (Freelancerzy + Freelancer Sales List dla freelancerów, Staff dla staffu).
  const grouped = useMemo(() => groupWeeklyCombined(entries, staffList), [entries, staffList]);

  const grand = useMemo(() => grouped.reduce((acc, r) => {
    acc.freelancerQty += r.freelancerQty; acc.freelancerHours = round2(acc.freelancerHours + r.freelancerHours);
    acc.staffQty += r.staffQty; acc.staffHours = round2(acc.staffHours + r.staffHours);
    acc.totalQty += r.totalQty; acc.totalHours = round2(acc.totalHours + r.totalHours);
    return acc;
  }, { freelancerQty: 0, freelancerHours: 0, staffQty: 0, staffHours: 0, totalQty: 0, totalHours: 0 }), [grouped]);

  return (
    <div className="overflow-x-auto border border-slate-200 rounded-xl bg-white shadow-sm">
      <table className="min-w-full text-sm">
        <thead className="bg-slate-100 text-slate-600">
          <tr>
            <th className="px-3 py-2 text-left font-medium">{t("tabWeekly").split(" ")[0]}</th>
            <th className="px-3 py-2 text-left font-medium">{t("dateRange")}</th>
            <th className="px-3 py-2 text-left font-medium">{t("weeklyFreelancerQty")}</th>
            <th className="px-3 py-2 text-left font-medium">{t("weeklyFreelancerHours")}</th>
            <th className="px-3 py-2 text-left font-medium">{t("weeklyStaffQty")}</th>
            <th className="px-3 py-2 text-left font-medium">{t("weeklyStaffHours")}</th>
            <th className="px-3 py-2 text-left font-medium">{t("colTotalQty")}</th>
            <th className="px-3 py-2 text-left font-medium">{t("colTotalHours")}</th>
          </tr>
        </thead>
        <tbody className="divide-y divide-slate-100">
          {grouped.map(r => (
            <tr key={r.key} className="hover:bg-slate-50">
              <td className="px-3 py-2 font-medium">{t("weekLabel", { week: r.week, year: r.year })}</td>
              <td className="px-3 py-2 text-slate-500">{formatDisplayDate(r.minDate)} – {formatDisplayDate(r.maxDate)}</td>
              <td className="px-3 py-2">{fmt(r.freelancerQty)}</td>
              <td className="px-3 py-2">{fmt(r.freelancerHours)}</td>
              <td className="px-3 py-2">{fmt(r.staffQty)}</td>
              <td className="px-3 py-2">{fmt(r.staffHours)}</td>
              <td className="px-3 py-2 font-semibold">{fmt(r.totalQty)}</td>
              <td className="px-3 py-2 font-semibold">{fmt(r.totalHours)}</td>
            </tr>
          ))}
          {grouped.length === 0 && (
            <tr><td colSpan="8" className="px-3 py-8 text-center text-slate-400">{t("noDataDot")}</td></tr>
          )}
        </tbody>
        {grouped.length > 0 && (
          <tfoot className="bg-slate-50 font-semibold border-t border-slate-200">
            <tr>
              <td className="px-3 py-2" colSpan="2">{t("sum")}</td>
              <td className="px-3 py-2">{fmt(grand.freelancerQty)}</td>
              <td className="px-3 py-2">{fmt(grand.freelancerHours)}</td>

function CampaignCphInput({ campaign, onCommit }) {
  const { t } = useLang();
  const [val, setVal] = useState(campaign.cph != null ? String(campaign.cph) : "");
  useEffect(() => { setVal(campaign.cph != null ? String(campaign.cph) : ""); }, [campaign.cph]);
  const commit = () => {
    const trimmed = val.trim();
    if (trimmed === "") { onCommit(null); return; }
    const n = parseFloat(trimmed);
    if (!isNaN(n) && n > 0) onCommit(n);
    else setVal(campaign.cph != null ? String(campaign.cph) : "");
  };
  return (
    <input
      type="number"
      min="1"
      step="1"
      value={val}
      onChange={(e) => setVal(e.target.value)}
      onBlur={commit}
      onKeyDown={(e) => { if (e.key === "Enter") e.currentTarget.blur(); }}
      placeholder={String(CPH)}
      title={t("campaignCphFieldHint")}

const FORECAST_START = "2026-07-01";

function ForecastTab({ entries }) {
  const { t, lang } = useLang();

  const plannedByRef = useMemo(() => {
    const map = {};
    FORECAST_SEED.forEach(r => {
      map[r.ref] = round2((map[r.ref] || 0) + r.app + r.extra + r.fd);
    });
    return map;
  }, []);

  const plannedByMonth = useMemo(() => {
    const map = {};
    FORECAST_SEED.forEach(r => {
      const mk = monthKeyOf(r.start) < "2026-07" ? "2026-07" : monthKeyOf(r.start);
      map[mk] = round2((map[mk] || 0) + r.app + r.extra + r.fd);
    });
    return map;
  }, []);

  const actualEntries = useMemo(() => entries.filter(e => e.date >= FORECAST_START), [entries]);

  const actualByRef = useMemo(() => {
    const map = {};
    actualEntries.forEach(e => {
      if (!e.campaignRef) return;
      map[e.campaignRef] = round2((map[e.campaignRef] || 0) + qtyOf(e));
    });
    return map;
  }, [actualEntries]);

  const actualByMonth = useMemo(() => {
    const map = {};
    actualEntries.forEach(e => {
      const mk = monthKeyOf(e.date);
      map[mk] = round2((map[mk] || 0) + qtyOf(e));
    });
    return map;
  }, [actualEntries]);

  const campaignRows = useMemo(() => {
    const refs = new Set([...Object.keys(plannedByRef), ...Object.keys(actualByRef)]);
    return CAMPAIGNS.filter(o => refs.has(o.ref)).map(o => {
      const planned = plannedByRef[o.ref] || 0;
      const actual = actualByRef[o.ref] || 0;
      const pct = planned > 0 ? round2((actual / planned) * 100) : (actual > 0 ? 100 : 0);
      return { ref: o.ref, name: o.name, planned, actual, diff: round2(actual - planned), pct };
    }).sort((a, b) => b.planned - a.planned);
  }, [plannedByRef, actualByRef]);

  const monthRows = useMemo(() => {
    const months = Array.from(new Set([...Object.keys(plannedByMonth), ...Object.keys(actualByMonth)])).sort();
    return months.map(mk => {
      const planned = plannedByMonth[mk] || 0;
      const actual = actualByMonth[mk] || 0;
      const pct = planned > 0 ? round2((actual / planned) * 100) : (actual > 0 ? 100 : 0);
      return { mk, planned, actual, diff: round2(actual - planned), pct };
    });
  }, [plannedByMonth, actualByMonth]);

  const totalPlanned = round2(campaignRows.reduce((s, r) => s + r.planned, 0));
  const totalActual = round2(campaignRows.reduce((s, r) => s + r.actual, 0));
  const totalPct = totalPlanned > 0 ? round2((totalActual / totalPlanned) * 100) : 0;
  const maxPlanned = Math.max(1, ...campaignRows.map(r => r.planned));

  const Card = ({ label, value, accent }) => (
    <div className="bg-white border border-slate-200 rounded-xl shadow-sm p-4">
      <div className="text-xs uppercase tracking-wide text-slate-400">{label}</div>
      <div className={`text-2xl font-semibold mt-1 ${accent || "text-slate-800"}`}>{value}</div>
    </div>
  );

  return (
    <div>
      <p className="text-sm text-slate-500 mb-4">{t("forecastIntro")}</p>

      <div className="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-6">
        <Card label={t("forecastPlanned")} value={fmt(totalPlanned)} />
        <Card label={t("forecastActual")} value={fmt(totalActual)} accent="text-[#007373]" />
        <Card label={t("forecastPct")} value={totalPct + "%"} accent={totalPct >= 100 ? "text-emerald-600" : "text-amber-600"} />
      </div>

      <h3 className="text-sm font-semibold text-slate-700 mb-2">{t("forecastByMonth")}</h3>
      <div className="overflow-x-auto border border-slate-200 rounded-xl bg-white shadow-sm mb-6">
        <table className="min-w-full text-sm">
          <thead className="bg-slate-100 text-slate-600">
            <tr>
              <th className="px-3 py-2 text-left font-medium">{t("tabMonthly")}</th>
              <th className="px-3 py-2 text-left font-medium">{t("forecastPlanned")}</th>
              <th className="px-3 py-2 text-left font-medium">{t("forecastActual")}</th>
              <th className="px-3 py-2 text-left font-medium">{t("forecastDiff")}</th>
              <th className="px-3 py-2 text-left font-medium">{t("forecastPct")}</th>
            </tr>
          </thead>
          <tbody className="divide-y divide-slate-100">
            {monthRows.map(r => (
              <tr key={r.mk} className="hover:bg-slate-50">
                <td className="px-3 py-2 font-medium">{monthLabel(lang, r.mk)}</td>
                <td className="px-3 py-2">{fmt(r.planned)}</td>
                <td className="px-3 py-2">{fmt(r.actual)}</td>
                <td className={`px-3 py-2 ${r.diff < 0 ? "text-red-500" : "text-emerald-600"}`}>{r.diff > 0 ? "+" : ""}{fmt(r.diff)}</td>
                <td className="px-3 py-2 font-medium">{r.pct}%</td>
              </tr>
            ))}
            {monthRows.length === 0 && (
              <tr><td colSpan="5" className="px-3 py-8 text-center text-slate-400">{t("noDataDot")}</td></tr>
            )}
          </tbody>
        </table>
      </div>

      <h3 className="text-sm font-semibold text-slate-700 mb-2">{t("forecastByCampaign")}</h3>
      <div className="overflow-x-auto border border-slate-200 rounded-xl bg-white shadow-sm">
        <table className="min-w-full text-sm">
          <thead className="bg-slate-100 text-slate-600">
            <tr>
              <th className="px-3 py-2 text-left font-medium">{t("colCampaign")}</th>
              <th className="px-3 py-2 text-left font-medium">{t("forecastPlanned")}</th>
              <th className="px-3 py-2 text-left font-medium">{t("forecastActual")}</th>
              <th className="px-3 py-2 text-left font-medium">{t("forecastDiff")}</th>
              <th className="px-3 py-2 text-left font-medium">{t("forecastPct")}</th>
              <th className="px-3 py-2 text-left font-medium w-40"></th>
            </tr>
          </thead>
          <tbody className="divide-y divide-slate-100">
            {campaignRows.map(r => (
              <tr key={r.ref} className="hover:bg-slate-50">
                <td className="px-3 py-2 font-medium max-w-[280px] truncate" title={r.name + " (" + r.ref + ")"}>{r.name}</td>
                <td className="px-3 py-2">{fmt(r.planned)}</td>
                <td className="px-3 py-2">{fmt(r.actual)}</td>
                <td className={`px-3 py-2 ${r.diff < 0 ? "text-red-500" : "text-emerald-600"}`}>{r.diff > 0 ? "+" : ""}{fmt(r.diff)}</td>
                <td className="px-3 py-2 font-medium">{r.pct}%</td>
                <td className="px-3 py-2">
                  <div className="h-2 bg-slate-100 rounded-full overflow-hidden">
                    <div className={`h-2 rounded-full ${r.pct >= 100 ? "bg-emerald-500" : "bg-[#00CCCC]"}`} style={{ width: Math.min(100, (r.planned / maxPlanned * 100)) + "%" }}></div>
                  </div>
                </td>
              </tr>
            ))}
            {campaignRows.length === 0 && (
              <tr><td colSpan="6" className="px-3 py-8 text-center text-slate-400">{t("noDataDot")}</td></tr>
            )}
          </tbody>
        </table>
      </div>
    </div>
  );
}

function MultiEmployeeSelect({ options, selected, onChange, allLabel }) {
  const { t } = useLang();
  const [open, setOpen] = useState(false);
  const ref = useRef(null);
  useEffect(() => {
    function onClickOutside(e) { if (ref.current && !ref.current.contains(e.target)) setOpen(false); }
    document.addEventListener("mousedown", onClickOutside);
    return () => document.removeEventListener("mousedown", onClickOutside);
  }, []);
  const toggle = (p) => {
    onChange(selected.includes(p) ? selected.filter(x => x !== p) : [...selected, p]);
  };
  const label = selected.length === 0
    ? allLabel
    : selected.length === 1
      ? selected[0]
      : t("employeesSelectedCount", { count: selected.length });
  return (
    <div className="relative" ref={ref}>
      <button
        type="button"
        onClick={() => setOpen(o => !o)}
        className="border border-slate-300 rounded-md px-2 py-1.5 text-sm bg-white min-w-[170px] text-left flex items-center justify-between gap-2 hover:border-slate-400"
      >
        <span className="truncate">{label}</span>
        <span className="text-slate-400 text-xs">▾</span>
      </button>
      {open && (
        <div className="absolute z-20 mt-1 w-60 max-h-72 overflow-y-auto bg-white border border-slate-200 rounded-md shadow-lg p-2">
          {options.map(p => (
            <label key={p} className="flex items-center gap-2 px-2 py-1.5 text-sm hover:bg-slate-50 rounded cursor-pointer">
              <input type="checkbox" checked={selected.includes(p)} onChange={() => toggle(p)} className="accent-[#00CCCC]" />
              <span>{p}</span>
            </label>
          ))}
          {options.length === 0 && <div className="px-2 py-1.5 text-xs text-slate-400">{t("noDataDot")}</div>}
          {selected.length > 0 && (
            <button
              type="button"
              onClick={() => onChange([])}
              className="mt-1 w-full text-xs text-center px-2 py-1.5 rounded-md border border-dashed border-slate-300 text-slate-400 hover:text-slate-600 hover:border-slate-400"
            >
              {t("clearSelection")}
            </button>
          )}
        </div>
      )}
    </div>
  );
}

function SummaryTab({ entries, pls, staffOverrides, setStaffOverrides, staffList }) {
  const { t, lang } = useLang();
  const weekly = useMemo(() => groupWeekly(entries), [entries]);
  const [staffDateFrom, setStaffDateFrom] = useState("");
  const [staffDateTo, setStaffDateTo] = useState("");
  const staffFilteredEntries = useMemo(
    () => entries.filter(e => (!staffDateFrom || e.date >= staffDateFrom) && (!staffDateTo || e.date <= staffDateTo)),
    [entries, staffDateFrom, staffDateTo]
  );
  const weeklyByType = useMemo(() => groupWeeklyByType(staffFilteredEntries, staffOverrides, staffList), [staffFilteredEntries, staffOverrides, staffList]);
  function resetStaffDateRange() { setStaffDateFrom(""); setStaffDateTo(""); }
  const [filterPl, setFilterPl] = useState("");
  const monthlyEntries = useMemo(() => (filterPl ? entries.filter(e => e.pl === filterPl) : entries), [entries, filterPl]);
  const monthly = useMemo(() => groupMonthlyPrizesForSummary(monthlyEntries), [monthlyEntries]);
  /* Zakładka Podsumowanie: w listach wyboru pracownika (filtr miesięczny i filtr w Podsumowaniu
     pracowników) pokazujemy wyłącznie aktualnie obowiązujące konta — PL01-PL10 (staff) i PLF11-PLF40
     (freelancerzy) — bez starych/nieaktualnych kodów (np. PL11-PL26 bez "F", NCH035, pgarcia). To dotyczy
     tylko listy wyboru w tej zakładce; nie zmienia globalnej listy `pls` używanej w innych zakładkach, ani
     danych/wierszy w tabelach Podsumowania (te nadal pokazują wszystkie wpisy, niezależnie od PL). */
  const plOptions = useMemo(() => {
    const validPls = new Set([...(staffList && staffList.length ? staffList : STAFF_PLS_FROM_AUGUST_2026), ...FREELANCER_PLS_FROM_AUGUST_2026].map(p => String(p).trim().toUpperCase()));
    const source = pls && pls.length ? pls : [...new Set(entries.map(e => e.pl))];
    return source.filter(p => validPls.has(String(p).trim().toUpperCase())).sort(comparePl);
  }, [pls, entries, staffList]);
  const [empDateFrom, setEmpDateFrom] = useState("");
  const [empDateTo, setEmpDateTo] = useState("");
  const [empFilterPls, setEmpFilterPls] = useState([]);
  const empFilteredEntries = useMemo(
    () => entries.filter(e =>
      (!empDateFrom || e.date >= empDateFrom) &&
      (!empDateTo || e.date <= empDateTo) &&
      (empFilterPls.length === 0 || empFilterPls.includes(e.pl))
    ),
    [entries, empDateFrom, empDateTo, empFilterPls]
  );
  const byEmployee = useMemo(() => groupByEmployee(empFilteredEntries, staffList), [empFilteredEntries, staffList]);
  const byEmployeeSorted = useMemo(() => [...byEmployee].sort((a, b) => comparePl(a.pl, b.pl)), [byEmployee]);
  const [editingWeek, setEditingWeek] = useState(null);
  function resetEmpDateRange() { setEmpDateFrom(""); setEmpDateTo(""); setEmpFilterPls([]); }

  const weekTotals = useMemo(() => weekly.reduce((a, r) => ({ qty: a.qty + r.qty, hours: round2(a.hours + r.hours) }), { qty: 0, hours: 0 }), [weekly]);
  const typeTotals = useMemo(() => weeklyByType.reduce((a, r) => ({ staffQty: a.staffQty + r.staffQty, staffHours: round2(a.staffHours + r.staffHours), freeQty: a.freeQty + r.freeQty, freeHours: round2(a.freeHours + r.freeHours) }), { staffQty: 0, staffHours: 0, freeQty: 0, freeHours: 0 }), [weeklyByType]);

  function toggleStaffForWeek(weekKey, pl, weekPls, weekRefDate) {
    setStaffOverrides(prev => {
      const defaultList = defaultStaffListForDate(weekRefDate, staffList);
      const base = Array.isArray(prev[weekKey]) ? prev[weekKey] : weekPls.filter(p => defaultList.includes(p));
      const has = base.includes(pl);
      const next = has ? base.filter(p => p !== pl) : [...base, pl];
      return { ...prev, [weekKey]: next };
    });
  }
  function resetWeekAssignment(weekKey) {
    setStaffOverrides(prev => {
      const next = { ...prev };
      delete next[weekKey];
      return next;
    });
  }
  const monthTotals = useMemo(() => monthly.reduce((a, r) => ({ qty: a.qty + r.qty, hours: round2(a.hours + r.hours) }), { qty: 0, hours: 0 }), [monthly]);
  const empTotals = useMemo(() => byEmployee.reduce((a, r) => ({ app: a.app + r.app, phys: a.phys + r.phys, prizes: a.prizes + r.prizes, qty: a.qty + r.qty, hours: round2(a.hours + r.hours) }), { app: 0, phys: 0, prizes: 0, qty: 0, hours: 0 }), [byEmployee]);

  return (
    <div>
      <SectionCard title={t("summaryWeekTitle")}>

          <thead className="bg-slate-100 text-slate-600">
            <tr>
              <th className="px-3 py-2 text-left font-medium">{t("tabWeekly").split(" ")[0]}</th>

              <th className="px-3 py-2 text-left font-medium">{t("colQty")}</th>
              <th className="px-3 py-2 text-left font-medium">{t("colHours")}</th>
            </tr>
          </thead>
          <tbody className="divide-y divide-slate-100">
            {weekly.map(r => (
              <tr key={r.key} className="hover:bg-slate-50">
                <td className="px-3 py-2 font-medium">{t("weekLabel", { week: r.week, year: r.year })}</td>
                <td className="px-3 py-2 text-slate-500">{formatDisplayDate(r.minDate)} – {formatDisplayDate(r.maxDate)}</td>
                <td className="px-3 py-2">{fmt(r.qty)}</td>
                <td className="px-3 py-2 font-medium">{fmt(r.hours)}</td>
              </tr>
            ))}
            {weekly.length === 0 && (
              <tr><td colSpan="4" className="px-3 py-6 text-center text-slate-400">{t("noDataDot")}</td></tr>

function HoursCell({ entry, onCommit }) {
  const { t } = useLang();
  // UWAGA: wiąże się z staffHoursBaseOf (BEZ godzin admin), nie z staffHoursOf — inaczej edycja tego pola
  // (np. samo kliknięcie + zapis bez zmiany wartości) "zapiekłaby" już dodane godziny admin do hoursOverride,
  // co przy następnej zmianie godzin admin policzyłoby je podwójnie. Godziny admin mają własną, oddzielną
  // komórkę (AdminHoursCell) w tej samej tabeli.
  const current = staffHoursBaseOf(entry);
  const [val, setVal] = useState(String(current));
  useEffect(() => { setVal(String(current)); }, [current]);
  const commit = () => {
    const trimmed = val.trim();
    if (trimmed === "" || Number(trimmed) === 0) { onCommit({ hoursOverride: null }); return; }
    const n = parseFloat(trimmed);
    if (isNaN(n) || n <= 0) { setVal(String(current)); return; }
    onCommit({ hoursOverride: n });
  };
  return (
    <input
      type="number"
      min="0"
      step="0.01"
      value={val}
      onChange={(e) => setVal(e.target.value)}
      onBlur={commit}
      onKeyDown={(e) => { if (e.key === "Enter") e.currentTarget.blur(); }}
      title={t("staffHoursCellHint")}
      className="w-20 rounded px-1 py-0.5 text-xs text-center border border-[#00CCCC] bg-[#E6FAFA] text-[#007373] font-semibold"
    />
  );
}
/* Komórka "Godziny admin" — dodatkowe godziny, które ZAWSZE sumują się z godzinami wiersza (patrz
   adminHoursOf/hoursOf/staffHoursOf/freelancerHoursOf/salesListHoursOf). Zawsze edytowalna wprost w tabeli
   (bez potrzeby wchodzenia w tryb edycji wiersza) — analogicznie do CphCell/HoursCell powyżej. Używana w
   zakładkach Freelancerzy, Freelancer Sales List i Staff (patrz odpowiednie tabele). */
function AdminHoursCell({ entry, onCommit }) {
  const { t } = useLang();
  const current = adminHoursOf(entry);
  const [val, setVal] = useState(String(current));
  useEffect(() => { setVal(String(current)); }, [current]);
  const commit = () => {
    const trimmed = val.trim();
    if (trimmed === "" || Number(trimmed) === 0) { onCommit({ adminHours: null }); return; }
    const n = parseFloat(trimmed);
    if (isNaN(n) || n < 0) { setVal(String(current)); return; }
    onCommit({ adminHours: n });
  };
  return (
    <input
      type="number"
      min="0"
      step="0.01"
      value={val}
      onChange={(e) => setVal(e.target.value)}
      onBlur={commit}
      onKeyDown={(e) => { if (e.key === "Enter") e.currentTarget.blur(); }}
      title={t("adminHoursCellHint")}
      className="w-20 rounded px-1 py-0.5 text-xs text-center border border-amber-300 bg-amber-50 text-amber-700 font-semibold"
    />
  );
}

/* Wyświetlana wartość jest ZAWSZE liczona na żywo z aktualnych prizes/godzin (staffAchievedCphOf) —
   to nie jest edytowalne pole zapisane w danych, więc nigdy nie może "zastygnąć" na starej wartości. */
function StaffAchievedCphCell({ entry }) {
  const effective = staffAchievedCphOf(entry);
  return (
    <span className="inline-block w-16 text-xs text-center text-slate-500">
      {effective != null ? effective : "—"}
    </span>
  );
}

function StaffAddEntryForm({ staffList, onAdd, notify }) {
  const { t } = useLang();
  const [date, setDate] = useState(todayIso());
  const [pl, setPl] = useState(staffList[0] || "");
  useEffect(() => { if ((!pl || !staffList.includes(pl)) && staffList.length) setPl(staffList[0]); }, [staffList]);
  const [app, setApp] = useState("");
  const [phys, setPhys] = useState("");
  const [prizes, setPrizes] = useState("");
  const [campaignChoice, setCampaignChoice] = useState("");
  const [customCampaignName, setCustomCampaignName] = useState("");
  const [hoursInput, setHoursInput] = useState("");

  const selectedCampaign = CAMPAIGNS.find(o => o.ref === campaignChoice);
  const effectiveCampaignName = campaignChoice === "__custom__" ? customCampaignName.trim() : campaignChoice === "__training__" ? TRAINING_CAMPAIGN_NAME : campaignChoice === "__admin__" ? ADMIN_CAMPAIGN_NAME : (selectedCampaign ? selectedCampaign.name : "");
  const effectiveCampaignRef = (campaignChoice === "__custom__" || campaignChoice === "__training__" || campaignChoice === "__admin__") ? "" : (selectedCampaign ? selectedCampaign.ref : "");
  const campaignCph = campaignCphAsOfDate(effectiveCampaignName, date, effectiveCampaignRef);
  const qtyPreview = qtyOfStaff({ app, phys, prizes });
  const hoursNum = parseFloat(hoursInput);
  const achievedPreview = (!isNaN(hoursNum) && hoursNum > 0) ? round2(qtyPreview / hoursNum) : null;
  const pctPreview = achievedPreview != null && campaignCph > 0 ? round2((achievedPreview / campaignCph) * 100) : null;

  const submit = (e) => {
    e.preventDefault();
    if (!date || !pl) { notify(t("validation"), "error"); return; }
    if (isNaN(hoursNum) || hoursNum <= 0) { notify(t("staffFormHoursRequired"), "error"); return; }
    onAdd({
      date, pl,
      app: num(app), phys: num(phys), prizes: num(prizes),
      campaignName: effectiveCampaignName, campaignRef: effectiveCampaignRef,
      hoursOverride: hoursNum,
    });
    setApp(""); setPhys(""); setPrizes(""); setHoursInput("");
  };

  return (
    <form onSubmit={submit} className="bg-white border border-slate-200 rounded-xl p-4 mb-4 shadow-sm">
      <div className="text-sm font-semibold text-slate-700 mb-3">{t("staffFormTitle")}</div>
      <div className="grid grid-cols-2 md:grid-cols-6 gap-3 items-end">
        <div className="col-span-1">
          <label className="block text-xs text-slate-500 mb-1">{t("formDate")}</label>
          <input type="date" value={date} onChange={e => setDate(e.target.value)} className="w-full border border-slate-300 rounded-md px-2 py-1.5 text-sm" required />
        </div>
        <div className="col-span-1">
          <label className="block text-xs text-slate-500 mb-1">{t("formEmployee")}</label>
          <select value={pl} onChange={e => setPl(e.target.value)} className="w-full border border-slate-300 rounded-md px-2 py-1.5 text-sm">
            {staffList.map(p => <option key={p} value={p}>{p}</option>)}
          </select>
        </div>
        <div className="col-span-1">
          <label className="block text-xs text-slate-500 mb-1">tck_via_app</label>
          <input type="number" min="0" value={app} onChange={e => setApp(e.target.value)} placeholder="0" className="w-full border border-slate-300 rounded-md px-2 py-1.5 text-sm" />
        </div>
        <div className="col-span-1">
          <label className="block text-xs text-slate-500 mb-1">tck_via_physical</label>
          <input type="number" min="0" value={phys} onChange={e => setPhys(e.target.value)} placeholder="0" className="w-full border border-slate-300 rounded-md px-2 py-1.5 text-sm" />
        </div>
        <div className="col-span-1">
          <label className="block text-xs text-slate-500 mb-1">prizes</label>
          <input type="number" min="0" value={prizes} onChange={e => setPrizes(e.target.value)} placeholder="0" className="w-full border border-slate-300 rounded-md px-2 py-1.5 text-sm" />
        </div>
        <div className="col-span-1">
          <button type="submit" className="w-full bg-[#00CCCC] hover:bg-[#008080] text-white text-sm font-medium rounded-md px-3 py-2">{t("formAdd")}</button>
        </div>
      </div>
      <div className="mt-3 grid grid-cols-2 md:grid-cols-6 gap-3 items-end">
        <div className="col-span-1 md:col-span-3">
          <label className="block text-xs text-slate-500 mb-1">{t("formCampaign")}</label>
          <select value={campaignChoice} onChange={e => setCampaignChoice(e.target.value)} className="w-full border border-slate-300 rounded-md px-2 py-1.5 text-sm">
            <option value="">{t("noCampaign")}</option>
            {CAMPAIGNS.map(o => <option key={o.ref} value={o.ref}>{o.name} — {o.ref}</option>)}
            <option value="__training__">{t("trainingOption")}</option>
            <option value="__admin__">{t("adminOption")}</option>
            <option value="__custom__">{t("otherCampaign")}</option>
          </select>
          {campaignChoice === "__custom__" && (
            <input type="text" value={customCampaignName} onChange={e => setCustomCampaignName(e.target.value)} placeholder={t("customCampaignName")} className="w-full border border-slate-300 rounded-md px-2 py-1.5 text-sm mt-2" />
          )}
        </div>
        <div className="col-span-1 md:col-span-2">
          <label className="block text-xs text-slate-500 mb-1">{t("staffFormHoursLabel")}</label>
          <input type="number" step="0.01" min="0" value={hoursInput} onChange={e => setHoursInput(e.target.value)} placeholder="0.00" required className="w-full border border-slate-300 rounded-md px-2 py-1.5 text-sm" />
        </div>
        <div className="col-span-1 flex flex-col justify-end text-xs text-slate-500 leading-relaxed">
          <div>{t("staffCampaignCph")}: <span className="font-semibold text-slate-700">{campaignCph}</span></div>
          <div>
            {t("staffAchievedCph")}: <span className={`font-semibold ${pctPreview == null ? "text-slate-400" : pctPreview >= 100 ? "text-emerald-600" : "text-amber-600"}`}>{achievedPreview != null ? achievedPreview : "—"}</span>
            {pctPreview != null && <span className="ml-1">({pctPreview}%)</span>}
          </div>
        </div>
      </div>
      <div className="text-xs text-slate-400 mt-2">{t("staffFormHelper")}</div>
    </form>
  );
}

function StaffMonthFillForm({ staffList, entries, onBulkAdd, notify }) {
  const { t, lang } = useLang();
  const [monthKey, setMonthKey] = useState(() => todayIso().slice(0, 7));
  const [pl, setPl] = useState(staffList[0] || "");
  useEffect(() => { if ((!pl || !staffList.includes(pl)) && staffList.length) setPl(staffList[0]); }, [staffList]);
  const [campaignChoice, setCampaignChoice] = useState("");
  const [customCampaignName, setCustomCampaignName] = useState("");
  const [dayRows, setDayRows] = useState({});

  useEffect(() => { setDayRows({}); }, [monthKey, pl]);

  const selectedCampaign = CAMPAIGNS.find(o => o.ref === campaignChoice);
  const effectiveCampaignName = campaignChoice === "__custom__" ? customCampaignName.trim() : campaignChoice === "__training__" ? TRAINING_CAMPAIGN_NAME : campaignChoice === "__admin__" ? ADMIN_CAMPAIGN_NAME : (selectedCampaign ? selectedCampaign.name : "");
  const effectiveCampaignRef = (campaignChoice === "__custom__" || campaignChoice === "__training__" || campaignChoice === "__admin__") ? "" : (selectedCampaign ? selectedCampaign.ref : "");
  // Wartość informacyjna (nagłówek formularza) — reprezentatywna dla całego miesiąca. Rzeczywisty CPH
  // użyty do przeliczeń jest liczony PER DZIEŃ niżej (dayCampaignCph), bo miesiąc lipiec/sierpień może
  // obejmować dni z obu stron granicy STAFF_RULE_CUTOFF_DATE.
  const campaignCph = campaignCphAsOfDate(effectiveCampaignName, `${monthKey}-01`, effectiveCampaignRef);
  const total = daysInMonth(monthKey);

  function setRow(day, field, value) {
    setDayRows(prev => ({ ...prev, [day]: { ...(prev[day] || {}), [field]: value } }));
  }

  function handleSaveMonth() {
    const newEntries = [];
    for (let d = 1; d <= total; d++) {
      const row = dayRows[d];
      if (!row) continue;
      const hoursNum = parseFloat(row.hours);
      const hasAnyQty = row.app || row.phys || row.prizes;
      if (!hasAnyQty && (row.hours === undefined || row.hours === "")) continue;
      if (isNaN(hoursNum) || hoursNum <= 0) continue;
      const iso = `${monthKey}-${String(d).padStart(2, "0")}`;
      newEntries.push({
        id: uid(),
        date: iso,
        pl,
        app: num(row.app), phys: num(row.phys), prizes: num(row.prizes),
        campaignName: effectiveCampaignName, campaignRef: effectiveCampaignRef,
        hoursOverride: hoursNum,
      });
    }
    if (newEntries.length === 0) { notify(t("staffMonthNoRows"), "error"); return; }
    const { unique, duplicates } = splitOcrDuplicates(newEntries, entries);
    if (unique.length > 0) onBulkAdd(unique);
    if (duplicates.length > 0) {
      const msg = unique.length > 0
        ? t("staffMonthSavedWithDuplicates", { count: unique.length, blocked: duplicates.length })
        : t("staffMonthAllDuplicates", { blocked: duplicates.length });
      notify(msg, "error");
    } else {
      notify(t("staffMonthSaved", { count: unique.length }), "success");
    }
    setDayRows({});
  }

  const rowsFilled = Object.keys(dayRows).some(d => {
    const r = dayRows[d];
    return r && (r.app || r.phys || r.prizes || r.hours);
  });

  return (
    <div className="bg-white border border-slate-200 rounded-xl shadow-sm p-4 mb-4">
      <div className="text-sm font-semibold text-slate-700 mb-3">{t("staffMonthFormTitle")}</div>
      <div className="flex flex-wrap items-end gap-3 mb-4">
        <div>
          <label className="block text-xs text-slate-500 mb-1">{t("formEmployee")}</label>
          <select value={pl} onChange={e => setPl(e.target.value)} className="border border-slate-300 rounded-md px-2 py-1.5 text-sm min-w-[110px]">
            {staffList.map(p => <option key={p} value={p}>{p}</option>)}
          </select>
        </div>
        <div>
          <label className="block text-xs text-slate-500 mb-1">{t("monthSelect")}</label>
          <input type="month" value={monthKey} onChange={e => setMonthKey(e.target.value)} className="border border-slate-300 rounded-md px-2 py-1.5 text-sm" />
        </div>
        <div className="flex-1 min-w-[220px]">
          <label className="block text-xs text-slate-500 mb-1">{t("formCampaign")}</label>
          <select value={campaignChoice} onChange={e => setCampaignChoice(e.target.value)} className="w-full border border-slate-300 rounded-md px-2 py-1.5 text-sm">
            <option value="">{t("noCampaign")}</option>
            {CAMPAIGNS.map(o => <option key={o.ref} value={o.ref}>{o.name} — {o.ref}</option>)}
            <option value="__training__">{t("trainingOption")}</option>
            <option value="__admin__">{t("adminOption")}</option>
            <option value="__custom__">{t("otherCampaign")}</option>
          </select>
          {campaignChoice === "__custom__" && (
            <input type="text" value={customCampaignName} onChange={e => setCustomCampaignName(e.target.value)} placeholder={t("customCampaignName")} className="w-full border border-slate-300 rounded-md px-2 py-1.5 text-sm mt-2" />
          )}
        </div>
        <div className="text-xs text-slate-500">
          {t("staffCampaignCph")}: <span className="font-semibold text-slate-700">{campaignCph}</span>
        </div>
      </div>

      <div className="overflow-y-auto max-h-96 border border-slate-200 rounded-lg">
        <table className="min-w-full text-sm">
          <thead className="bg-slate-100 text-slate-600 sticky top-0">
            <tr>
              <th className="px-3 py-2 text-left font-medium">{t("colDate")}</th>
              <th className="px-3 py-2 text-left font-medium">tck_via_app</th>
              <th className="px-3 py-2 text-left font-medium">tck_via_physical</th>
              <th className="px-3 py-2 text-left font-medium">prizes</th>
              <th className="px-3 py-2 text-left font-medium">{t("staffFormHoursLabel")}</th>
              <th className="px-3 py-2 text-left font-medium">{t("staffAchievedCph")}</th>
              <th className="px-3 py-2 text-left font-medium">{t("staffAchievementPct")}</th>
            </tr>
          </thead>
          <tbody className="divide-y divide-slate-100">
            {Array.from({ length: total }, (_, i) => i + 1).map(d => {
              const row = dayRows[d] || { app: "", phys: "", prizes: "", hours: "" };
              const qty = qtyOfStaff({ app: row.app, phys: row.phys, prizes: row.prizes });
              const hoursNum = parseFloat(row.hours);
              const achieved = (!isNaN(hoursNum) && hoursNum > 0) ? round2(qty / hoursNum) : null;
              const iso = `${monthKey}-${String(d).padStart(2, "0")}`;
              const dayCampaignCph = campaignCphAsOfDate(effectiveCampaignName, iso, effectiveCampaignRef);
              const pct = achieved != null && dayCampaignCph > 0 ? round2((achieved / dayCampaignCph) * 100) : null;
              return (
                <tr key={d} className="hover:bg-slate-50">
                  <td className="px-3 py-2 whitespace-nowrap text-slate-500">{formatDisplayDate(iso)}</td>
                  <td className="px-2 py-1"><input type="number" min="0" value={row.app} onChange={e => setRow(d, "app", e.target.value)} placeholder="0" className="w-20 border border-slate-300 rounded px-1.5 py-1 text-xs" /></td>
                  <td className="px-2 py-1"><input type="number" min="0" value={row.phys} onChange={e => setRow(d, "phys", e.target.value)} placeholder="0" className="w-20 border border-slate-300 rounded px-1.5 py-1 text-xs" /></td>
                  <td className="px-2 py-1"><input type="number" min="0" value={row.prizes} onChange={e => setRow(d, "prizes", e.target.value)} placeholder="0" className="w-20 border border-slate-300 rounded px-1.5 py-1 text-xs" /></td>
                  <td className="px-2 py-1"><input type="number" min="0" step="0.01" value={row.hours} onChange={e => setRow(d, "hours", e.target.value)} placeholder="0.00" className="w-20 border border-[#00CCCC] bg-[#E6FAFA] rounded px-1.5 py-1 text-xs" /></td>
                  <td className="px-3 py-2 text-slate-500">{achieved != null ? achieved : "—"}</td>
                  <td className={`px-3 py-2 font-medium ${pct == null ? "text-slate-400" : pct >= 100 ? "text-emerald-600" : "text-amber-600"}`}>{pct != null ? pct + "%" : "—"}</td>
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>

      <div className="flex items-center justify-between mt-3">
        <div className="text-xs text-slate-400">{t("staffMonthHelper")}</div>
        <button
          type="button"
          onClick={handleSaveMonth}
          disabled={!rowsFilled}
          className="bg-[#00CCCC] hover:bg-[#008080] disabled:opacity-40 disabled:cursor-not-allowed text-white text-sm font-medium rounded-md px-4 py-2"
        >
          {t("staffMonthSaveBtn")}
        </button>
      </div>
    </div>
  );
}

function StaffProductivityTab({ entries, staffList, onAddStaffPl, onRemoveStaffPl, onResetStaffList, onAdd, onBulkAdd, onUpdate, onDelete, notify }) {
  const { t, lang } = useLang();
  const [newPlCode, setNewPlCode] = useState("");
  const [addMode, setAddMode] = useState("day");

  // Filtry ujednolicone z zakładką Freelancerzy: miesiąc, wielu pracowników naraz, dzień, zakres dat Od-Do.
  const [filterMonth, setFilterMonth] = useState("");
  const [filterStaffPls, setFilterStaffPls] = useState([]);
  const [filterDate, setFilterDate] = useState("");
  const [filterDateFrom, setFilterDateFrom] = useState("");
  const [filterDateTo, setFilterDateTo] = useState("");
  useEffect(() => { setFilterStaffPls(prev => prev.filter(p => staffList.includes(p))); }, [staffList]);

  const staffEntries = useMemo(
    () => entries.filter(e => staffList.includes(String(e.pl || "").trim().toUpperCase())),
    [entries, staffList]
  );

  const months = useMemo(() => Array.from(new Set(staffEntries.map(e => monthKeyOf(e.date)))).sort(), [staffEntries]);

  const filteredStaffEntries = useMemo(() => {
    return staffEntries
      .filter(e => !filterMonth || monthKeyOf(e.date) === filterMonth)
      .filter(e => filterStaffPls.length === 0 || filterStaffPls.includes(e.pl))
      .filter(e => !filterDate || e.date === filterDate)
      .filter(e => !filterDateFrom || e.date >= filterDateFrom)
      .filter(e => !filterDateTo || e.date <= filterDateTo);
  }, [staffEntries, filterMonth, filterStaffPls, filterDate, filterDateFrom, filterDateTo]);

  const sorted = useMemo(
    () => [...filteredStaffEntries].sort((a, b) => (a.date === b.date ? a.pl.localeCompare(b.pl) : b.date.localeCompare(a.date))),
    [filteredStaffEntries]
  );
  const totals = useMemo(() => {
    // UWAGA: "hours" liczone tu z staffHoursBaseOf (BEZ godzin admin), żeby zgadzało się z tym, co widać w
    // edytowalnej komórce Godziny (HoursCell, też oparta na staffHoursBaseOf) i żeby średnia ważona
    // Produktywności/% realizacji nie była "rozwadniana" godzinami admin (patrz staffAchievedCphOf). Godziny
    // admin mają własną, osobną sumę (adminHours) — widoczną w nowej kolumnie "Godziny admin".
    let app = 0, phys = 0, prizes = 0, hours = 0, adminHours = 0, qtyWithHours = 0, expected = 0;
    filteredStaffEntries.forEach(e => {
      app += num(e.app); phys += num(e.phys); prizes += num(e.prizes);
      const h = staffHoursBaseOf(e);
      hours = round2(hours + h);
      adminHours = round2(adminHours + adminHoursOf(e));
      // Do średniej ważonej Produktywności liczymy tylko wiersze z wpisanymi godzinami
      // (ta sama zasada co przy pojedynczym wierszu: bez godzin brak sensownego % realizacji).
      if (h > 0) {
        const q = qtyOfStaff(e);
        qtyWithHours += q;
        const campaignCph = staffTargetCphOf(e);
        if (campaignCph > 0) expected += campaignCph * h;
      }
    });
    const qty = app + phys + prizes;
    const pct = expected > 0 ? round2((qtyWithHours / expected) * 100) : null;
    return { app, phys, prizes, qty, hours, adminHours, pct };
  }, [filteredStaffEntries]);
  function resetStaffDateRange() { setFilterDateFrom(""); setFilterDateTo(""); }

  function handleAddStaffPl() {
    if (!newPlCode.trim()) return;
    onAddStaffPl(newPlCode);
    setNewPlCode("");
  }

  return (
    <div>
      <div className="bg-white border border-slate-200 rounded-xl shadow-sm p-4 mb-4 no-print">
        <div className="flex items-center justify-between mb-2">
          <div className="font-semibold text-slate-700 text-sm">{t("staffListTitle")}</div>
          <button type="button" onClick={onResetStaffList} className="text-xs px-2 py-1 rounded-md border border-dashed border-slate-300 text-slate-400 hover:text-slate-600 hover:border-slate-400">
            {t("resetAssign")}
          </button>
        </div>
        <p className="text-xs text-slate-500 mb-3">{t("staffListNote")}</p>
        <div className="flex flex-wrap gap-2 mb-3">
          {staffList.map(p => (
            <span key={p} className="inline-flex items-center gap-1.5 bg-[#E6FAFA] text-[#007373] text-xs font-medium px-2.5 py-1 rounded-full">
              {p}
              <button type="button" onClick={() => onRemoveStaffPl(p)} className="text-[#007373]/60 hover:text-rose-600">×</button>
            </span>
          ))}
          {staffList.length === 0 && <span className="text-xs text-slate-400">{t("noDataDot")}</span>}
        </div>
        <div className="flex items-center gap-2">
          <input
            type="text"
            value={newPlCode}
            onChange={e => setNewPlCode(e.target.value)}
            onKeyDown={e => { if (e.key === "Enter") { e.preventDefault(); handleAddStaffPl(); } }}
            placeholder={t("staffListAddPlaceholder")}
            className="border border-slate-300 rounded-md px-2 py-1.5 text-sm w-40"
          />
          <button type="button" onClick={handleAddStaffPl} className="text-sm px-3 py-1.5 rounded-md border border-slate-300 bg-white hover:bg-slate-100 text-slate-600">
            {t("staffListAddBtn")}
          </button>
        </div>
      </div>

      <div className="flex gap-2 mb-3 no-print">
        <button
          type="button"
          onClick={() => setAddMode("day")}
          className={`text-xs font-medium px-3 py-1.5 rounded-md border ${addMode === "day" ? "bg-[#00CCCC] border-[#00CCCC] text-white" : "bg-white border-slate-300 text-slate-600 hover:bg-slate-100"}`}
        >
          {t("staffModeDay")}

        <button

        {addMode === "day" && <StaffAddEntryForm staffList={staffList} onAdd={onAdd} notify={notify} />}

        </select>

        <div className="flex items-center gap-1.5">

        <span className="text-xs text-slate-400">{t("rowsCount", { count: sorted.length })}</span>

      <div className="hidden print:block mb-4">
        <div className="text-lg font-semibold text-slate-800">{t("tabStaffProd")}</div>

          {printRangeLabel(t, { filterDate, filterDateFrom, filterDateTo })}

          {filterStaffPls.length > 0 ? ` · ${t("printFilterEmployeesLabel")} ${filterStaffPls.join(", ")}` : ""}
          {` · ${t("rowsCount", { count: sorted.length })}`}

function FreelancerTab({ entries, pls, onAdd, onAddPl, onUpdate, onDelete, notify }) {
  const { t, lang } = useLang();
  // Freelancerzy = wyłącznie loginy PLF11-PLF40 (patrz FREELANCER_PLS_FROM_AUGUST_2026). To jest stała, jednoznaczna
  // definicja niezależna od reguły staff/freelancer z zakładki Podsumowanie (tam klasyfikacja jest zależna od daty).
  const freelancerPlSet = useMemo(() => new Set(FREELANCER_PLS_FROM_AUGUST_2026), []);
  const freelancerPls = useMemo(() => {
    const fromPls = (pls || []).filter(p => freelancerPlSet.has(String(p || "").trim().toUpperCase()));
    return Array.from(new Set([...FREELANCER_PLS_FROM_AUGUST_2026, ...fromPls])).sort(comparePl);
  }, [pls, freelancerPlSet]);

  const [filterMonth, setFilterMonth] = useState("");
  const [filterPls, setFilterPls] = useState([]);
  const [filterDate, setFilterDate] = useState("");
  const [filterDateFrom, setFilterDateFrom] = useState("");
  const [filterDateTo, setFilterDateTo] = useState("");
  const [editingId, setEditingId] = useState(null);

  const freelancerEntries = useMemo(
    () => entries.filter(e => freelancerPlSet.has(String(e.pl || "").trim().toUpperCase())),
    [entries, freelancerPlSet]
  );

  const months = useMemo(() => Array.from(new Set(freelancerEntries.map(e => monthKeyOf(e.date)))).sort(), [freelancerEntries]);

  const filtered = useMemo(() => {
    return freelancerEntries
      .filter(e => !filterMonth || monthKeyOf(e.date) === filterMonth)
      .filter(e => filterPls.length === 0 || filterPls.includes(e.pl))
      .filter(e => !filterDate || e.date === filterDate)
      .filter(e => !filterDateFrom || e.date >= filterDateFrom)
      .filter(e => !filterDateTo || e.date <= filterDateTo)
      .slice()
      .sort((a, b) => (a.date === b.date ? a.pl.localeCompare(b.pl) : a.date.localeCompare(b.date)));
  }, [freelancerEntries, filterMonth, filterPls, filterDate, filterDateFrom, filterDateTo]);

  const totals = useMemo(() => {
    return filtered.reduce((acc, e) => {
      acc.app += num(e.app); acc.phys += num(e.phys); acc.prizes += num(e.prizes); acc.hours = round2(acc.hours + freelancerHoursOf(e));
      acc.adminHours = round2(acc.adminHours + adminHoursOf(e));
      return acc;
