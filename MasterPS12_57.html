/* ============================== PLIK WSPÓŁDZIELONY (OneDrive / inny zsynchronizowany folder) ==============================
   Umożliwia kilku osobom korzystanie z TYCH SAMYCH danych naraz, bez własnego serwera: dane (entries, pls,
   staffList, campaigns, staffOverrides, cph) są zapisywane do jednego pliku .json, który każda osoba wskazuje
   w swoim, lokalnie zsynchronizowanym folderze OneDrive (działa też z innym folderem synchronizowanym, np.
   Dropbox/Google Drive Desktop — dla aplikacji to zwykły plik na dysku). Aplikacja co kilka sekund sprawdza, czy
   plik na dysku się zmienił (np. bo dotarła zmiana od innej osoby przez synchronizację OneDrive) i wtedy wczytuje
   nową wersję. Zapis działa na zasadzie "ostatni zapis wygrywa" — to nie jest prawdziwa baza danych z blokadami
   zapisu, więc przy zapisie DOKŁADNIE w tej samej chwili przez dwie osoby jedna zmiana może zostać nadpisana
   (OneDrive w takiej sytuacji czasem dodatkowo tworzy plik "-kopia konfliktu" do ręcznego porównania). Wymaga
   File System Access API — działa w Chrome/Edge na komputerze; Firefox, Safari i przeglądarki mobilne nie są
   wspierane i aplikacja wtedy po prostu działa jak dotychczas (dane tylko w localStorage tej przeglądarki). */
const SHARED_FILE_SUPPORTED = typeof window !== "undefined" && !!window.showOpenFilePicker && !!window.showSaveFilePicker && typeof indexedDB !== "undefined";
const SHARED_FILE_IDB_DB = "masterps_shared_file_v1";
const SHARED_FILE_IDB_STORE = "handles";
const SHARED_FILE_IDB_KEY = "handle";
const SHARED_FILE_POLL_MS = 5000;
const SHARED_FILE_WRITE_DEBOUNCE_MS = 700;

function sharedFileIdbOpen() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(SHARED_FILE_IDB_DB, 1);
    req.onupgradeneeded = () => { req.result.createObjectStore(SHARED_FILE_IDB_STORE); };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
async function sharedFileIdbGet() {
  try {
    const db = await sharedFileIdbOpen();
    return await new Promise((resolve, reject) => {
      const tx = db.transaction(SHARED_FILE_IDB_STORE, "readonly");
      const req = tx.objectStore(SHARED_FILE_IDB_STORE).get(SHARED_FILE_IDB_KEY);
      req.onsuccess = () => resolve(req.result || null);
      req.onerror = () => reject(req.error);
    });
  } catch (e) { return null; }
}
async function sharedFileIdbSet(handle) {
  try {
    const db = await sharedFileIdbOpen();
    return await new Promise((resolve, reject) => {
      const tx = db.transaction(SHARED_FILE_IDB_STORE, "readwrite");
      tx.objectStore(SHARED_FILE_IDB_STORE).put(handle, SHARED_FILE_IDB_KEY);
      tx.oncomplete = () => resolve(true);
      tx.onerror = () => reject(tx.error);
    });
  } catch (e) { return false; }
}
async function sharedFileIdbClear() {
  try {
    const db = await sharedFileIdbOpen();
    return await new Promise((resolve, reject) => {
      const tx = db.transaction(SHARED_FILE_IDB_STORE, "readwrite");
      tx.objectStore(SHARED_FILE_IDB_STORE).delete(SHARED_FILE_IDB_KEY);
      tx.oncomplete = () => resolve(true);
      tx.onerror = () => reject(tx.error);
    });
  } catch (e) { return false; }
}
async function sharedFileVerifyPermission(handle, forWrite) {
  const opts = forWrite ? { mode: "readwrite" } : { mode: "read" };
  try {
    if ((await handle.queryPermission(opts)) === "granted") return true;
    if ((await handle.requestPermission(opts)) === "granted") return true;
  } catch (e) {}
  return false;
}
async function sharedFileRead(handle) {
  const file = await handle.getFile();
  const text = await file.text();
  const data = text.trim() ? JSON.parse(text) : {};
  return { data, lastModified: file.lastModified };
}
async function sharedFileWrite(handle, data) {
  const writable = await handle.createWritable();
  await writable.write(JSON.stringify(data, null, 2));
  await writable.close();
  const file = await handle.getFile();
  return file.lastModified;
}

/* ---- Scalanie (merge) danych pliku współdzielonego przed zapisem ----
   Zamiast ślepo nadpisywać cały plik aktualnym stanem tej przeglądarki (co mogłoby bezpowrotnie skasować
   wpisy dodane przez inne osoby, które zdążyły zapisać się do pliku - np. na innym komputerze przez OneDrive
   - ale jeszcze nie dotarły do lokalnego stanu tej przeglądarki, bo odpytywanie pliku odbywa się co
   SHARED_FILE_POLL_MS), przed każdym zapisem odczytujemy AKTUALNĄ zawartość pliku z dysku i scalamy ją z
   lokalnym stanem: suma zbiorów (unia) po kluczu (id wpisu / ref kampanii / sam kod loginu), z lokalną wersją
   mającą pierwszeństwo przy konflikcie tego samego klucza (zakładamy, że to najnowsza zmiana wprowadzona w
   TEJ przeglądarce). To naprawia zgłaszany problem "nie widzę wpisów innych osób mimo połączenia z plikiem" -
   bez scalania, w scenariuszu kilku osób dodających dane w podobnym czasie, kolejne zapisy poszczególnych
   przeglądarek mogły się nawzajem "prześcigać" i kasować cudze, jeszcze niepobrane wpisy. */
function unionByKey(diskList, localList, keyFn) {
  const map = new Map();
  (Array.isArray(diskList) ? diskList : []).forEach(item => map.set(keyFn(item), item));
  (Array.isArray(localList) ? localList : []).forEach(item => map.set(keyFn(item), item));
  return Array.from(map.values());
}
function unionStrings(diskList, localList) {
  const set = new Set([...(Array.isArray(diskList) ? diskList : []), ...(Array.isArray(localList) ? localList : [])]);
  return Array.from(set).sort();
}
function mergeSharedPayload(diskData, localPayload) {
  const disk = diskData && typeof diskData === "object" ? diskData : {};
  return {
    entries: unionByKey(disk.entries, localPayload.entries, e => e.id),
    pls: unionStrings(disk.pls, localPayload.pls),
    staffList: unionStrings(disk.staffList, localPayload.staffList),
    campaigns: unionByKey(disk.campaigns, localPayload.campaigns, c => c.ref),
    // staffOverrides: obiekt kluczowany numerem tygodnia (weekKey) -> tablica loginów staffu dla tego
    // tygodnia. Scalanie płytkie (per klucz tygodnia) jest tu bezpieczne, bo każdy klucz to samodzielna,
    // kompletna wartość (cała lista dla danego tygodnia), a nie coś wymagającego głębszego scalania.
    staffOverrides: { ...(disk.staffOverrides && typeof disk.staffOverrides === "object" ? disk.staffOverrides : {}), ...(localPayload.staffOverrides || {}) },
    cph: localPayload.cph,
    savedAt: Date.now(),
  };
}

function App() {
  const [entries, setEntries] = useState(() => {
    try { const raw = localStorage.getItem(STORAGE_ENTRIES); if (raw) return JSON.parse(raw); } catch (e) {}
    return SEED_ENTRIES;
  });
  const [pls, setPls] = useState(() => {
    let base = SEED_PLS;
    try { const raw = localStorage.getItem(STORAGE_PLS); if (raw) { const arr = JSON.parse(raw); if (Array.isArray(arr) && arr.length) base = arr; } } catch (e) {}
    // Dopisujemy nowe kody obowiązujące od sierpnia 2026 (PL01-PL10 staff, PLF11-PLF40 freelancerzy) do listy
    // pracowników, niezależnie od tego, co było już zapisane w tej przeglądarce — nic z bazy nie jest usuwane.
    const merged = Array.from(new Set([...base, ...STAFF_PLS_FROM_AUGUST_2026, ...FREELANCER_PLS_FROM_AUGUST_2026]));
    return merged.sort(comparePl);
  });
  const [lang, setLang] = useState(() => {
    try { const raw = localStorage.getItem(STORAGE_LANG); if (raw && TRANSLATIONS[raw]) return raw; } catch (e) {}
    return "pl";
  });
  const [staffOverrides, setStaffOverrides] = useState(() => {
    try { const raw = localStorage.getItem(STORAGE_STAFF_OVERRIDES); if (raw) return JSON.parse(raw); } catch (e) {}
    return {};
  });
  const [cph, setCphState] = useState(() => {
    try {
      const raw = localStorage.getItem(STORAGE_CPH);
      if (raw) { const n = parseFloat(raw); if (!isNaN(n) && n > 0) return n; }
    } catch (e) {}
    return DEFAULT_CPH;
  });
  const [staffList, setStaffList] = useState(() => {
    try {
      const raw = localStorage.getItem(STORAGE_STAFF_LIST);
      if (raw) { const arr = JSON.parse(raw); if (Array.isArray(arr) && arr.length) return arr; }
    } catch (e) {}
    return [...STAFF_PLS_FROM_AUGUST_2026];
  });
  const [campaigns, setCampaigns] = useState(() => {
    try {
      const raw = localStorage.getItem(STORAGE_CAMPAIGNS);
      if (raw) { const arr = JSON.parse(raw); if (Array.isArray(arr) && arr.length) return arr; }
    } catch (e) {}
    return buildCampaignSeed();
  });
  const [tab, setTab] = useState("master");
  const [toast, setToast] = useState(null);

  // Plik współdzielony (OneDrive) — patrz komentarz przy SHARED_FILE_SUPPORTED wyżej.
  const [sharedFileHandle, setSharedFileHandle] = useState(null);
  const [sharedFileStatus, setSharedFileStatus] = useState(SHARED_FILE_SUPPORTED ? "disconnected" : "unsupported");
  const [sharedFileName, setSharedFileName] = useState("");
  const [sharedFileLastSync, setSharedFileLastSync] = useState(null);
  const sharedFileLastWrittenRef = useRef(null);
  const sharedFileSkipNextWriteRef = useRef(false);
  /* Treść (bez znacznika savedAt) ostatnio zapisanych LUB odczytanych danych — używana do pominięcia zapisu,
     gdy dane faktycznie się nie zmieniły (patrz komentarz przy efekcie zapisu niżej). */
  const sharedFileLastWrittenContentRef = useRef(null);

  useEffect(() => { localStorage.setItem(STORAGE_ENTRIES, JSON.stringify(entries)); }, [entries]);
  useEffect(() => { localStorage.setItem(STORAGE_PLS, JSON.stringify(pls)); }, [pls]);
  useEffect(() => { localStorage.setItem(STORAGE_LANG, lang); }, [lang]);
  useEffect(() => { localStorage.setItem(STORAGE_STAFF_OVERRIDES, JSON.stringify(staffOverrides)); }, [staffOverrides]);
  useEffect(() => { localStorage.setItem(STORAGE_STAFF_LIST, JSON.stringify(staffList)); }, [staffList]);
  useEffect(() => {
    CPH = cph; // aktualizuje globalny współczynnik używany przez cphForCampaign/cphForEntry
    localStorage.setItem(STORAGE_CPH, String(cph));
    setEntries(prev => [...prev]); // wymusza przeliczenie godzin wszędzie tam, gdzie zależą od CPH
  }, [cph]);
  useEffect(() => {
    CAMPAIGNS = campaigns; // aktualizuje globalną, "żywą" listę używaną przez cphForCampaign i dropdowny kampanii
    localStorage.setItem(STORAGE_CAMPAIGNS, JSON.stringify(campaigns));
    setEntries(prev => [...prev]); // wymusza przeliczenie godzin/CPH wszędzie, gdzie zależą od kampanii
  }, [campaigns]);
  useEffect(() => { if (!toast) return; const t = setTimeout(() => setToast(null), 3500); return () => clearTimeout(t); }, [toast]);

  const setCph = (value) => {
    const n = parseFloat(value);
    if (!isNaN(n) && n > 0) setCphState(n);
  };

  const t = useMemo(() => makeT(lang), [lang]);
  const langValue = useMemo(() => ({ lang, t, setLang }), [lang, t]);

  const notify = (msg, type) => setToast({ msg, type: type || "info" });

  /* ---- Plik współdzielony: ładowanie/zapis/łączenie/odłączanie/synchronizacja ---- */
  const buildSharedPayload = () => ({ entries, pls, staffList, campaigns, staffOverrides, cph, savedAt: Date.now() });
  const applySharedPayload = (data) => {
    if (!data) return;
    if (Array.isArray(data.entries)) setEntries(data.entries);
    if (Array.isArray(data.pls)) setPls(data.pls);
    if (Array.isArray(data.staffList) && data.staffList.length) setStaffList(data.staffList);
    if (Array.isArray(data.campaigns) && data.campaigns.length) setCampaigns(data.campaigns);
    if (data.staffOverrides && typeof data.staffOverrides === "object") setStaffOverrides(data.staffOverrides);
    if (typeof data.cph === "number" && data.cph > 0) setCphState(data.cph);
  };
  const loadFromSharedFile = async (handle, opts) => {
    opts = opts || {};
    try {
      const { data, lastModified } = await sharedFileRead(handle);
      sharedFileSkipNextWriteRef.current = true;
      applySharedPayload(data);
      sharedFileLastWrittenRef.current = lastModified;
      sharedFileLastWrittenContentRef.current = JSON.stringify({ ...(data || {}), savedAt: null });
      setSharedFileName(handle.name);
      setSharedFileStatus("connected");
      setSharedFileLastSync(Date.now());
      if (!opts.silent) notify(t("notifySharedFileLoaded"), "success");
    } catch (e) {
      setSharedFileStatus("error");
      if (!opts.silent) notify(t("notifySharedFileError", { msg: e.message }), "error");
    }
  };
  const connectExistingSharedFile = async () => {
    if (!SHARED_FILE_SUPPORTED) return;
    if (!window.confirm(t("sharedFileConfirmLoadOverwrite"))) return;
    try {
      const [handle] = await window.showOpenFilePicker({
        types: [{ description: "JSON", accept: { "application/json": [".json"] } }],
        excludeAcceptAllOption: false,
      });
      const granted = await sharedFileVerifyPermission(handle, true);
      if (!granted) { notify(t("notifySharedFilePermissionDenied"), "error"); return; }
      await sharedFileIdbSet(handle);
      setSharedFileHandle(handle);
      await loadFromSharedFile(handle, {});
    } catch (e) {
      if (e && e.name === "AbortError") return;
      notify(t("notifySharedFileError", { msg: e.message }), "error");
    }
  };
  const createNewSharedFile = async () => {
    if (!SHARED_FILE_SUPPORTED) return;
    if (!window.confirm(t("sharedFileConfirmCreateNew"))) return;
    try {
      const handle = await window.showSaveFilePicker({
        suggestedName: "master-ps-plus-dane.json",
        types: [{ description: "JSON", accept: { "application/json": [".json"] } }],
      });
      const granted = await sharedFileVerifyPermission(handle, true);
      if (!granted) { notify(t("notifySharedFilePermissionDenied"), "error"); return; }
      await sharedFileIdbSet(handle);
      setSharedFileHandle(handle);
      const payload = buildSharedPayload();
      sharedFileSkipNextWriteRef.current = true;
      const lastModified = await sharedFileWrite(handle, payload);
      sharedFileLastWrittenRef.current = lastModified;
      sharedFileLastWrittenContentRef.current = JSON.stringify({ ...payload, savedAt: null });
      setSharedFileName(handle.name);
      setSharedFileStatus("connected");
      setSharedFileLastSync(Date.now());
      notify(t("notifySharedFileCreated"), "success");
    } catch (e) {
      if (e && e.name === "AbortError") return;
      notify(t("notifySharedFileError", { msg: e.message }), "error");
    }
  };
  const reconnectSharedFile = async () => {
    if (!sharedFileHandle) return;
    const granted = await sharedFileVerifyPermission(sharedFileHandle, true);
    if (!granted) { notify(t("notifySharedFilePermissionDenied"), "error"); return; }
    await loadFromSharedFile(sharedFileHandle, {});
  };
  const disconnectSharedFile = () => {
    sharedFileIdbClear();
    setSharedFileHandle(null);
    setSharedFileStatus(SHARED_FILE_SUPPORTED ? "disconnected" : "unsupported");
    setSharedFileName("");
    setSharedFileLastSync(null);
  };
  const syncNowSharedFile = async () => {
    if (!sharedFileHandle) return;
    await loadFromSharedFile(sharedFileHandle, {});
  };

  // Przy starcie: jeśli wcześniej połączono plik współdzielony (uchwyt zapisany w IndexedDB), próbujemy
  // automatycznie odzyskać dostęp bez klikania — jeśli przeglądarka nie pamięta zgody, użytkownik zobaczy
  // przycisk "Przywróć dostęp" (patrz SharedFileBar), bo requestPermission wymaga kliknięcia (gestu użytkownika).
  useEffect(() => {
    if (!SHARED_FILE_SUPPORTED) return;
    (async () => {
      const handle = await sharedFileIdbGet();
      if (!handle) return;
      setSharedFileHandle(handle);
      setSharedFileName(handle.name);
      let granted = false;
      try { granted = (await handle.queryPermission({ mode: "readwrite" })) === "granted"; } catch (e) {}
      if (!granted) { setSharedFileStatus("needsPermission"); return; }
      await loadFromSharedFile(handle, { silent: true });
    })();
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, []);

  // Odpytywanie pliku co kilka sekund — jeśli zmienił się na dysku (np. zapis innej osoby zsynchronizowany
  // przez OneDrive), wczytujemy nową wersję. Własny zapis nie wywołuje ponownego wczytania, bo od razu po
  // zapisie zapamiętujemy jego lastModified w sharedFileLastWrittenRef.
  useEffect(() => {
    if (!sharedFileHandle || sharedFileStatus !== "connected") return;
    const interval = setInterval(async () => {
      try {
        const file = await sharedFileHandle.getFile();
        if (file.lastModified !== sharedFileLastWrittenRef.current) {
          await loadFromSharedFile(sharedFileHandle, { silent: true });
        }
      } catch (e) {
        setSharedFileStatus("error");
      }
    }, SHARED_FILE_POLL_MS);
    return () => clearInterval(interval);
  }, [sharedFileHandle, sharedFileStatus]);

  // Zapis do pliku współdzielonego (z małym debounce) po każdej zmianie współdzielonych danych — pominięty
  // raz tuż po wczytaniu z pliku (sharedFileSkipNextWriteRef), żeby nie odsyłać do pliku tego, co właśnie
  // z niego przyszło.
  // Przed zapisem: 1) odczytujemy AKTUALNĄ zawartość pliku z dysku i SCALAMY ją z lokalnym stanem
  // (mergeSharedPayload — patrz komentarz przy tej funkcji) zamiast ślepo nadpisywać plik samym lokalnym
  // stanem — to naprawia utratę wpisów innych osób, które zdążyły zapisać się do pliku (np. z innego
  // komputera przez OneDrive), zanim ten zapis wystartował, a nie zdążyły jeszcze dotrzeć do lokalnego stanu
  // tej przeglądarki. 2) Pomijamy zapis, jeśli scalona treść (bez samego znacznika savedAt) jest identyczna
  // z tym, co już wiadomo, że jest zapisane/odczytane — zapobiega to "fantomowym" zapisom wywoływanym przez
  // efekty, które odświeżają referencję entries (np. po zmianie CPH/kampanii - patrz efekty wyżej), mimo że
  // realne dane się nie zmieniły; bez tego takie fantomowe zapisy dodatkowo zwiększały ryzyko wyścigu opisanego
  // w punkcie 1. 3) Jeśli scalanie dołożyło do lokalnego stanu wpisy/dane, których ta przeglądarka jeszcze nie
  // miała (bo pochodzą z pliku), aktualizujemy też lokalny stan, żeby użytkownik od razu widział KOMPLETNE dane
  // (bez czekania na najbliższe pollowanie co SHARED_FILE_POLL_MS).
  useEffect(() => {
    if (!sharedFileHandle || sharedFileStatus !== "connected") return;
    if (sharedFileSkipNextWriteRef.current) { sharedFileSkipNextWriteRef.current = false; return; }
    const timeout = setTimeout(async () => {
      try {
        const localPayload = buildSharedPayload();
        const serializedLocalOnly = JSON.stringify({ ...localPayload, savedAt: null });
        let diskData = null;
        try { diskData = (await sharedFileRead(sharedFileHandle)).data; } catch (e) { /* brak odczytu -> scalamy tylko z lokalnym stanem */ }
        const merged = mergeSharedPayload(diskData, localPayload);
        const serialized = JSON.stringify({ ...merged, savedAt: null });
        if (serialized === sharedFileLastWrittenContentRef.current) return;
        const lastModified = await sharedFileWrite(sharedFileHandle, merged);
        sharedFileLastWrittenRef.current = lastModified;
        sharedFileLastWrittenContentRef.current = serialized;
        setSharedFileLastSync(Date.now());
        // Jeśli scalona treść różni się od tego, co było TYLKO w lokalnym stanie (czyli scalanie dołożyło coś
        // z pliku, czego ta przeglądarka jeszcze nie miała), aktualizujemy lokalny stan od razu — użytkownik
        // nie musi czekać na najbliższe pollowanie, żeby zobaczyć pełne dane.
        if (serialized !== serializedLocalOnly) {
          sharedFileSkipNextWriteRef.current = true;
          applySharedPayload(merged);
        }
      } catch (e) {
        setSharedFileStatus("error");
      }
    }, SHARED_FILE_WRITE_DEBOUNCE_MS);
    return () => clearTimeout(timeout);
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [entries, pls, staffList, campaigns, staffOverrides, cph, sharedFileHandle, sharedFileStatus]);

  const addEntry = (entry) => { setEntries(prev => [...prev, { ...entry, id: uid() }]); notify(t("notifyAdded"), "success"); };
  const updateEntry = (id, patch) => setEntries(prev => prev.map(e => (e.id === id ? { ...e, ...patch } : e)));
  const deleteEntry = (id) => setEntries(prev => prev.filter(e => e.id !== id));
  /* Zakładka Kampanie: przycisk "Wyczyść ręczne CPH" — usuwa cphOverride ze wszystkich wpisów danej kampanii
     (dopasowanie po nazwie, tak jak cphForCampaign/campaignCphAsOfDate), żeby zaczęły automatycznie korzystać
     z CPH ustawionego dla kampanii, bez konieczności poprawiania każdego wiersza z osobna w Freelancerach/Staff. */
  const clearCphOverridesForCampaign = (campaignName) => {
    const norm = normalizeCampaignName(campaignName);
    const count = entries.filter(e => normalizeCampaignName(e.campaignName) === norm && hasCphOverride(e)).length;
    if (count > 0) {
      setEntries(prev => prev.map(e => (normalizeCampaignName(e.campaignName) === norm && hasCphOverride(e)) ? { ...e, cphOverride: null } : e));
    }
    return count;
  };
  const addPl = (code) => setPls(prev => (prev.includes(code) ? prev : [...prev, code].sort()));
  const bulkAdd = (list, replacementPls, replaceAll) => {
    if (replaceAll) {
      setEntries(list);
      if (replacementPls) setPls(replacementPls);
      return;
    }
    setEntries(prev => [...prev, ...list]);
    const newPls = Array.from(new Set(list.map(x => x.pl)));
    setPls(prev => Array.from(new Set([...prev, ...newPls])).sort());
  };
  const clearAll = () => {
    if (!window.confirm(t("confirmClearAll"))) return;
    setEntries([]);
    notify(t("notifyCleared"), "success");
  };
  const addStaffPl = (code) => {
    const c = String(code || "").trim().toUpperCase();
    if (!c) return;
    setStaffList(prev => (prev.includes(c) ? prev : [...prev, c].sort(comparePl)));
    setPls(prev => (prev.includes(c) ? prev : [...prev, c].sort(comparePl)));
  };
  const removeStaffPl = (code) => setStaffList(prev => prev.filter(p => p !== code));
  const resetStaffList = () => setStaffList([...STAFF_PLS_FROM_AUGUST_2026].sort(comparePl));
  const addCampaign = (ref, name, cphValue) => {
    const r = String(ref || "").trim();
    const n = String(name || "").trim();
    if (!r || !n) { notify(t("campaignFormValidation"), "error"); return; }
    if (campaigns.some(c => c.ref === r)) { notify(t("campaignDuplicateRef"), "error"); return; }
    const cphNum = cphValue !== "" && cphValue != null && !isNaN(Number(cphValue)) && Number(cphValue) > 0 ? Number(cphValue) : null;
    setCampaigns(prev => [...prev, { ref: r, name: n, cph: cphNum }]);
    notify(t("notifyCampaignAdded"), "success");
  };
  const updateCampaign = (ref, patch) => setCampaigns(prev => prev.map(c => (c.ref === ref ? { ...c, ...patch } : c)));
  const removeCampaign = (ref) => setCampaigns(prev => prev.filter(c => c.ref !== ref));

  return (
    <LangContext.Provider value={langValue}>
      <div className="min-h-screen bg-slate-50 text-slate-800 pb-10">
        <div className="no-print">
          <Header entries={entries} cph={cph} onCphChange={setCph} />
          <SharedFileBar
            status={sharedFileStatus}
            fileName={sharedFileName}
            lastSync={sharedFileLastSync}
            onConnectExisting={connectExistingSharedFile}
            onCreateNew={createNewSharedFile}
            onReconnect={reconnectSharedFile}
            onDisconnect={disconnectSharedFile}
            onSyncNow={syncNowSharedFile}
          />
        </div>
        <div className="max-w-7xl mx-auto px-4">
          <div className="no-print">
            <TabBar tab={tab} setTab={setTab} />
          </div>
          {tab === "master" && (
            <MasterTab entries={entries} pls={pls} onAdd={addEntry} onAddPl={addPl} onUpdate={updateEntry} onDelete={deleteEntry} onBulkAdd={bulkAdd} onClearAll={clearAll} notify={notify} />
          )}
          {tab === "freelancerProd" && (
            <FreelancerTab
              entries={entries}
              pls={pls}
              onAdd={addEntry}
              onAddPl={addPl}
              onUpdate={updateEntry}
              onDelete={deleteEntry}
              notify={notify}
            />
          )}
          {tab === "freelancerSalesList" && (
            <FreelancerSalesListTab
              entries={entries}
              pls={pls}
              onAdd={addEntry}
              onAddPl={addPl}
              onUpdate={updateEntry}
              onDelete={deleteEntry}
              notify={notify}
            />
          )}
          {tab === "staffProd" && (
            <StaffProductivityTab
              entries={entries}
              staffList={staffList}
              onAddStaffPl={addStaffPl}
              onRemoveStaffPl={removeStaffPl}
              onResetStaffList={resetStaffList}
              onAdd={addEntry}
              onBulkAdd={bulkAdd}
              onUpdate={updateEntry}
              onDelete={deleteEntry}
              notify={notify}
            />
          )}
          {tab === "weekly" && <WeeklyTab entries={entries} staffList={staffList} />}
          {tab === "monthly" && <MonthlyTab entries={entries} />}
          {tab === "productivityPrint" && (
            <ProductivityPrintTab
              entries={entries}
              pls={pls}
              staffList={staffList}
              onUpdate={updateEntry}
              onDelete={deleteEntry}
              notify={notify}
            />
          )}
          {tab === "summary" && <SummaryTab entries={entries} pls={pls} staffOverrides={staffOverrides} setStaffOverrides={setStaffOverrides} staffList={staffList} />}
          {tab === "campaigns" && (
            <CampaignsTab
              entries={entries}
              campaigns={campaigns}
              onAddCampaign={addCampaign}
              onUpdateCampaign={updateCampaign}
              onRemoveCampaign={removeCampaign}
              onClearCphOverrides={clearCphOverridesForCampaign}
              notify={notify}
            />
          )}
          {tab === "forecast" && <ForecastTab entries={entries} />}
        </div>
        {toast && <div className="no-print"><Toast toast={toast} /></div>}
        <div className="no-print text-center text-xs text-slate-400 mt-8">{t("footer", { cph })}</div>
      </div>
    </LangContext.Provider>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
